    <label class="f"><span>Cờ thêm — nối vào cờ của dự án</span>
      <input type="text" id="f-extra" value="${esc(draft.extraFlags||'')}" placeholder="${esc(p.extraFlags ? 'dự án đang có: '+p.extraFlags : '--no-cache')}"></label>
    <label class="f"><span>Lệnh build riêng</span>
      <input type="text" id="f-cmd" value="${esc(draft.buildCommand||'')}" placeholder="${esc(inh(p.buildCommand))}"></label>
    <div class="varhelp" id="varhelp"></div>
    ${kvBlock('Build args riêng — trùng key thì đè lên của dự án')}
    ${kvBlock('Labels riêng — trùng key thì đè lên của dự án')}
    <label class="check" id="autopush-wrap"><input type="checkbox" id="f-push" ${draft.autoPush?'checked':''}> Mặc định bật push khi build</label>
    <div class="modal-foot">
      <button class="btn danger left" id="rm">Xóa môi trường</button>
      <button class="btn" id="cancel">Hủy</button>
      <button class="btn primary" id="save">Lưu</button>
    </div>`, true);

  const fsets = m.querySelectorAll('fieldset');
  mountKV(fsets[0], draft.buildArgs);
  mountKV(fsets[1], draft.labels);

  const preview = () => {
    const merged = effective(p, {...draft,
      registry: $('#f-reg', m).value.trim(), image: $('#f-img', m).value.trim(),
      tagPrefix: $('#f-prefix', m).value.trim()});
    $('#preview', m).textContent = repoOf(merged) + ':' + tagOf(merged, e.lastVersion || '1.0.0');
  };
  ['#f-prefix','#f-reg','#f-img'].forEach(s => $(s, m).oninput = preview);
  preview();

  // "Mặc định bật push khi build" là một ô không còn tác dụng gì khi môi
  // trường này không bao giờ push, nên nó ẩn đi thay vì đứng đó gây hiểu
  // nhầm. Tiền tố tag thì ngược lại: tag vẫn tồn tại trên máy, vẫn là thứ
  // phân biệt bản này với bản khác, nên vẫn khai được.
  //
  // Môi trường nguồn của một dự án promote thì không đánh dấu được: promote
  // lấy image từ registry, mà môi trường này thì không bao giờ đẩy lên. Máy
  // chủ cũng từ chối, nhưng nói ngay ở đây thì người dùng biết trước khi bấm
  // Lưu.
  const localChk = $('#f-local', m);
  const isPromoteSource = p.releaseMode === 'promote' && buildEnvId(p) === e.id;
  const syncLocal = () => {
    $('#autopush-wrap', m).style.display = localChk.checked ? 'none' : '';
    $('#local-note', m).innerHTML = (localChk.checked && isPromoteSource)
      ? `<div class="warnbox" style="margin:0 0 12px">${esc(e.name)} đang là <b>môi trường nguồn</b> của dự án này —
         các môi trường khác lấy image từ đó qua registry. Đánh dấu chỉ-máy-này sẽ không lưu được.
         Đổi môi trường nguồn trong <b>Cài đặt dự án</b> trước.</div>`
      : '';
  };
  localChk.onchange = syncLocal; syncLocal();

  mountVarHelp($('#f-cmd', m), $('#varhelp', m));
  // Context lives on the project only (Env has no context of its own — see
  // Project.Effective), so the dialog starts there regardless of this env.
  mountFilePick($('#f-envfile', m), $('#pick-envfile', m), () => p.context || '');

  $('#cancel', m).onclick = closeModal;

  $('#rm', m).onclick = async () => {
    if (!confirm(`Xóa môi trường "${e.name}"? Lịch sử build vẫn được giữ.`)) return;
    const c = cloneConfig();
    const proj = c.projects.find(x => x.id === p.id);
    proj.envs = (proj.envs || []).filter(x => x.id !== e.id);
    try { await saveConfig(c, 'Đã xóa môi trường'); closeModal(); state.sel = {kind:'project', id:p.id}; render(); }
    catch (err) { toast(err.message, true); }
  };

  $('#save', m).onclick = async () => {
    Object.assign(draft, {
      name: $('#f-name', m).value.trim(),
      tagPrefix: $('#f-prefix', m).value.trim(),
      registry: $('#f-reg', m).value.trim(),
      image: $('#f-img', m).value.trim(),
      dockerfile: $('#f-df', m).value.trim(),
      platform: $('#f-plat', m).value.trim(),
      target: $('#f-target', m).value.trim(),
      envFile: $('#f-envfile', m).value.trim(),
      extraFlags: $('#f-extra', m).value.trim(),
      buildCommand: $('#f-cmd', m).value.trim(),
      isOnlyLocal: localChk.checked,
      // Môi trường không push thì cờ "mặc định push" phải tắt hẳn chứ không
      // chỉ ẩn đi: để nó true thì lần bỏ tick sau sẽ bật push trở lại mà
      // người dùng không hề chọn.
      autoPush: !localChk.checked && $('#f-push', m).checked,
    });
    draft.buildArgs = draft.buildArgs.filter(r => r.key.trim());
    draft.labels = draft.labels.filter(r => r.key.trim());
    const c = cloneConfig();
    const proj = c.projects.find(x => x.id === p.id);
    proj.envs = (proj.envs || []).map(x => x.id === e.id ? draft : x);
    try { await saveConfig(c, 'Đã lưu cài đặt môi trường'); closeModal(); }
    catch (err) { toast(err.message, true); }
  };
}

/* ---------- config snapshots ---------- */
async function versionsDialog(){
  let snaps = [];
  try { snaps = await api('/api/config/versions'); } catch (e) { return toast(e.message, true); }
  const m = openModal(`
    <h2>Bản lưu của config.json</h2>
    <p class="sub">Mỗi lần lưu cài đặt, bản cũ được giữ lại ở đây.</p>
    <div id="snaps">${
      snaps.length
        ? snaps.map(s => `<div class="snap">
            <time>${fmt(s.savedAt)}</time>
            <span class="sz">${s.size} B</span>
            <button class="btn sm" data-view="${esc(s.file)}">Xem nội dung</button>
            <button class="btn sm" data-restore="${esc(s.file)}">Khôi phục</button>
          </div>`).join('')
        : `<div class="kv-empty">Chưa có bản lưu nào. Bản đầu tiên xuất hiện sau lần lưu cài đặt kế tiếp.</div>`
    }</div>
    <div class="modal-foot"><button class="btn" id="cancel">Đóng</button></div>`);
  $('#cancel', m).onclick = closeModal;

  $$('[data-view]', m).forEach(el => el.onclick = async () => {
    const raw = await fetch('/api/config/versions/'+encodeURIComponent(el.dataset.view)).then(r => r.text());
    const v = openModal(`<h2>${esc(el.dataset.view)}</h2>
      <pre class="log" style="max-height:420px">${esc(raw)}</pre>
      <div class="modal-foot"><button class="btn" id="back">Đóng</button></div>`, true);
    $('#back', v).onclick = closeModal;
  });

  $$('[data-restore]', m).forEach(el => el.onclick = async () => {
    if (!confirm('Khôi phục cài đặt từ bản lưu này? Cấu hình hiện tại sẽ được lưu lại trước.')) return;
    try {
      await api('/api/config/versions/'+encodeURIComponent(el.dataset.restore)+'/restore', {method:'POST'});
      closeModal(); toast('Đã khôi phục'); await refresh();
    } catch (e) { toast(e.message, true); }
  });
}

/* ---------- bulk import ---------- */
function importDialog(){
  const m = openModal(`
    <h2>Quét thư mục mã nguồn</h2>
    <p class="sub">Chọn một thư mục cha. DIMA tìm các thư mục con có Dockerfile (sâu tối đa ba tầng) và tạo mỗi thư mục một dự án.</p>
    <label class="f"><span>Thư mục cha</span>
      <div class="pathrow">
        <input type="text" id="root" placeholder="ví dụ: D:\\work">
        <button type="button" class="btn" id="pick">Chọn thư mục</button>
      </div>
    </label>
    <div class="grid2">
      <label class="f"><span>Nhóm cho tất cả</span>
        ${groupPickerHTML('group', '', '— lấy theo tên thư mục cha —')}</label>
      <label class="f"><span>Registry cho tất cả — để trống nếu build local</span><input type="text" id="reg" placeholder="git.mmt.local"></label>
    </div>
    <div class="section-label" style="margin:16px 0 8px">Tìm thấy <span class="count" id="count">—</span>
      <button class="btn sm ghost" id="all" style="margin-left:auto">Chọn tất cả</button>
      <button class="btn sm ghost" id="none">Bỏ chọn</button>
    </div>
    <div id="hits"><div class="kv-empty">Chọn thư mục cha để bắt đầu.</div></div>
    <div class="modal-foot">
      <button class="btn" id="cancel">Hủy</button>
      <button class="btn primary" id="go" disabled>Thêm</button>
    </div>`, true);

  const rootIn = $('#root', m), group = mountGroupPicker(m, 'group');
  let hits = [];
  const taken = new Set(projects().flatMap(p => (p.envs||[]).map(e => (effective(p,e).context||'').toLowerCase()).concat([(p.context||'').toLowerCase()])).filter(Boolean));

  const selected = () => $$('#hits input:checked', m).map(c => hits[+c.dataset.i]);
  const syncGo = () => {
    const n = selected().length;
    $('#go', m).disabled = n === 0;
    $('#go', m).textContent = n ? `Thêm ${n} dự án` : 'Thêm';
  };

  const drawHits = () => {
    $('#count', m).textContent = hits.length;
    if (!hits.length){
      $('#hits', m).innerHTML = `<div class="kv-empty">Không thấy thư mục con nào có Dockerfile.</div>`;
      return syncGo();
    }
    const root = (rootIn.value.trim() || '').replace(/[\\/]+$/, '');
    const rel = p => {
      const s = p.startsWith(root) ? p.slice(root.length) : p;
      return s.replace(/^[\\/]+/, '') || '.';
    };
    $('#hits', m).innerHTML = `<div class="builds">` + hits.map((h, i) => {
      const dup = taken.has(h.path.toLowerCase());
      return `<label class="hit${dup ? ' dup' : ''}">
        <input type="checkbox" data-i="${i}" ${dup ? 'disabled' : 'checked'}>
        <b class="hit-name">${esc(h.name)}</b>
        <span class="hit-path" title="${esc(h.path)}">${esc(rel(h.path))}</span>
        <span class="badge ${dup ? '' : 'pushed'}">${dup ? 'đã có' : esc(h.dockerfile)}</span>
      </label>`;
    }).join('') + `</div>`;
    $$('#hits input', m).forEach(c => c.onchange = syncGo);
    syncGo();
  };

  const scan = async () => {
    const path = rootIn.value.trim();
    if (!path) return;
    $('#hits', m).innerHTML = `<div class="kv-empty">Đang quét ${esc(path)}…</div>`;
    try {
      const res = await api('/api/scan-folder?path=' + encodeURIComponent(path));
      hits = res.hits || [];
      if (group.isEmpty()) group.suggest(res.group || '');
      drawHits();
      if (res.truncated) toast('Quá nhiều thư mục, chỉ hiện ' + hits.length + ' cái đầu tiên', true);
    } catch (e) {
      hits = [];
      $('#hits', m).innerHTML = `<div class="kv-empty">${esc(e.message)}</div>`;
      syncGo();
    }
  };

  $('#pick', m).onclick = async () => {
    const b = $('#pick', m);
    b.disabled = true; b.textContent = 'Đang mở…';
    try {
      const picked = await api('/api/pick-folder', {method:'POST'});
      if (picked.path){ rootIn.value = picked.path; await scan(); }
    } catch (e) { toast(e.message, true); }
    finally { b.disabled = false; b.textContent = 'Chọn thư mục'; }
  };
  let t; rootIn.oninput = () => { clearTimeout(t); t = setTimeout(scan, 500); };
  $('#all', m).onclick = () => { $$('#hits input:not([disabled])', m).forEach(c => c.checked = true); syncGo(); };
  $('#none', m).onclick = () => { $$('#hits input', m).forEach(c => c.checked = false); syncGo(); };
  $('#cancel', m).onclick = closeModal;

  $('#go', m).onclick = async () => {
    const chosen = selected();
    if (!chosen.length) return;
    const btn = $('#go', m);
    btn.disabled = true; btn.textContent = 'Đang thêm…';
    const groupName = group.value(), registry = $('#reg', m).value.trim();
    const c = cloneConfig();
    c.projects = c.projects || [];
    chosen.forEach(h => {
      c.projects.push({
        id:'', name:h.name, group:groupName, releaseMode:'rebuild', sourceEnvId:'',
        registry, image:h.name, context:h.path, dockerfile:h.dockerfile,
        platform:'', target:'', extraFlags:'', buildArgs:[], labels:[],
        envs:[
          {id:'', name:'Staging',    tagPrefix:'staging-', buildArgs:[], labels:[]},
          {id:'', name:'Production', tagPrefix:'prod-',    buildArgs:[], labels:[]},
        ],
      });
    });
    try {
      await saveConfig(c, `Đã thêm ${chosen.length} dự án`);
      closeModal();
      state.sel = {kind:'overview'};
      render();
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false; syncGo();
    }
  };
}

/* ---------- import from images already on this machine ---------- */
function imagesDialog(){
  const m = openModal(`
    <h2>Quét image có sẵn</h2>
    <p class="sub">Đọc các image đang có trong Docker trên máy này và đưa chúng vào dự án.
      Mỗi repository thành một dự án; các tag là phiên bản của nó sẽ hiện luôn trong bảng version.</p>
    <div class="grid2">
      <label class="f"><span>Nhóm cho tất cả</span>
        ${groupPickerHTML('group', '', '— Không xếp nhóm —')}</label>
      <label class="f"><span>&nbsp;</span>
        <label class="check" style="height:36px"><input type="checkbox" id="showAll"> Hiện cả image tải về từ Docker Hub</label>
      </label>
    </div>
    <div class="section-label" style="margin:10px 0 8px">Repository <span class="count" id="count">…</span>
      <button class="btn sm ghost" id="all" style="margin-left:auto">Chọn tất cả</button>
      <button class="btn sm ghost" id="none">Bỏ chọn</button>
    </div>
    <div id="repos"><div class="kv-empty">Đang đọc danh sách image…</div></div>
    <div class="modal-foot">
      <button class="btn" id="cancel">Hủy</button>
      <button class="btn primary" id="go" disabled>Thêm</button>
    </div>`, true);

  let repos = [];
  const visible = () => repos.filter(r => $('#showAll', m).checked || r.private || r.known);
  const selected = () => $$('#repos input:checked', m).map(c => c.dataset.repo);

  const syncGo = () => {
    const n = selected().length;
    $('#go', m).disabled = n === 0;
    $('#go', m).textContent = n ? `Thêm ${n} dự án` : 'Thêm';
  };

  const draw = () => {
    const list = visible();
    $('#count', m).textContent = list.length;
    if (!list.length){
      $('#repos', m).innerHTML = `<div class="kv-empty">Không có image nào phù hợp. Tích “Hiện cả image tải về từ Docker Hub” để xem hết.</div>`;
      return syncGo();
    }
    $('#repos', m).innerHTML = `<div class="builds">` + list.map(r => {
      const versions = r.tags.filter(t => t.isVersion);
      const detail = versions.length
        ? versions.slice(0, 3).map(t => t.tag).join(', ') + (versions.length > 3 ? ` +${versions.length-3}` : '')
        : 'chưa có tag nào là phiên bản';
      const origin = r.registry || 'Docker Hub';
      return `<label class="hit${r.known ? ' dup' : ''}">
        <input type="checkbox" data-repo="${esc(r.repository)}" ${r.known ? 'disabled' : (r.private ? 'checked' : '')}>
        <b class="hit-name">${esc(r.name)}</b>
        <span class="hit-path" title="${esc(r.repository)}">${esc(r.repository)}</span>
        <span class="row-when">${esc(detail)}</span>
        <span class="badge ${r.known ? '' : (r.private ? 'pushed' : '')}">${r.known ? 'đã có' : esc(origin)}</span>
      </label>`;
    }).join('') + `</div>`;
    $$('#repos input', m).forEach(c => c.onchange = syncGo);
    syncGo();
  };

  $('#showAll', m).onchange = draw;
  $('#all', m).onclick = () => { $$('#repos input:not([disabled])', m).forEach(c => c.checked = true); syncGo(); };
  $('#none', m).onclick = () => { $$('#repos input', m).forEach(c => c.checked = false); syncGo(); };
  $('#cancel', m).onclick = closeModal;

  (async () => {
    try {
      const res = await api('/api/images');
      repos = res.repos || [];
      draw();
    } catch (e) {
      $('#repos', m).innerHTML = `<div class="kv-empty">${esc(e.message)}</div>`;
    }
  })();

  $('#go', m).onclick = async () => {
    const chosen = selected();
    if (!chosen.length) return;
    const btn = $('#go', m);
    btn.disabled = true; btn.textContent = 'Đang thêm…';
    try {
      const res = await api('/api/images/import', {method:'POST', body:JSON.stringify({
        group: group.value(), repositories: chosen,
      })});
      closeModal();
      toast(`Đã thêm ${res.projects} dự án, ghi nhận ${res.versions} phiên bản`);
      state.sel = {kind:'overview'};
      await refresh();
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false; syncGo();
    }
  };
}

/* ---------- create ---------- */
async function addEnv(projectId){
  const c = cloneConfig();
  const proj = c.projects.find(p => p.id === projectId);
  if (!proj) return;
  proj.envs = proj.envs || [];
  proj.envs.push({id:'', name:'Môi trường '+(proj.envs.length+1), tagPrefix:'', buildArgs:[], labels:[]});
  try {
    const saved = await saveConfig(c);
    const fresh = saved.projects.find(p => p.id === projectId);
    const added = fresh.envs[fresh.envs.length-1];
    state.sel = {kind:'env', id:added.id};
    render();
    envDialog(fresh, added);
  } catch (e) { toast(e.message, true); }
}

$('#scanFolders').onclick = importDialog;
$('#scanImages').onclick = imagesDialog;

$('#addProject').onclick = async () => {
  const c = cloneConfig();
  c.projects = c.projects || [];
  c.projects.push({
    id:'', name:'Dự án '+(c.projects.length+1), releaseMode:'rebuild',
    image:'my-api', context:'', dockerfile:'Dockerfile',
    buildArgs:[], labels:[],
    envs:[{id:'', name:'Staging', tagPrefix:'staging-', buildArgs:[], labels:[]}],
  });
  try {
    const saved = await saveConfig(c);
    const added = saved.projects[saved.projects.length-1];
    state.sel = {kind:'project', id:added.id};
    render();
    projectDialog(added);
  } catch (e) { toast(e.message, true); }
};

/* ---------- go ---------- */
refresh().catch(e => { markPollFail(); toast(e.message, true); });
// A failed poll is counted, not swallowed: see showOffline above for why the
// screen must say so rather than keep drawing the state it last knew.
setInterval(() => { if (!$('.veil')) refresh().catch(() => markPollFail()); }, 5000);

// Sợi dây báo cửa sổ này còn sống. Đóng cửa sổ là hệ điều hành cắt kết nối
// ngay, và DIMA tắt theo để trả lại cổng — thứ mà cách cũ (canh tiến trình
// trình duyệt) bỏ sót, khiến app chạy ngầm mãi và khoá file .exe lúc build.
//
// Không dùng setInterval cho việc này được: trình duyệt bóp hẹn giờ của cửa
// sổ đang ẩn xuống còn khoảng một lần mỗi phút, nên app thu nhỏ sẽ bị hiểu
// nhầm là đã đóng. Kết nối mở thì không bị bóp.
//
// EventSource tự kết nối lại khi đứt, nên khởi động lại DIMA là cửa sổ đang
// mở tự nối lại chứ không cần tải lại trang.
try { new EventSource('/api/alive'); } catch (e) { /* trình duyệt quá cũ: bỏ qua */ }
</script>
