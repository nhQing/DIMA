<!DOCTYPE html>
<!--
  Bản đồ luồng end-to-end — khung dùng chung.
  Dữ liệu của từng dự án được flowmap-build.mjs nhét vào khối DATA bên dưới;
  đừng sửa file này để mô tả một dự án cụ thể.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIMA — Bản đồ luồng end-to-end</title>
<style>
:root{
  --bg:#0c0f14; --bg2:#11151c; --panel:#141922; --line:#232a36; --line2:#2e3746;
  --fg:#e6ebf2; --dim:#8b97a8; --dim2:#5f6b7c; --accent:#57b6ff;
  --nw:214px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:13px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
.mono,code,pre{font-family:Consolas,"JetBrains Mono","SF Mono",monospace}

header{
  flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:10px 16px; background:var(--bg2); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:15px;letter-spacing:.3px}
.brand span{color:var(--dim);font-size:12px}
.legend{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
.legend i{display:inline-flex;align-items:center;gap:6px;font-style:normal;color:var(--dim);font-size:11.5px}
.legend i::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}

main{flex:1 1 auto;display:flex;min-height:0}
aside{
  position:relative;
  flex:0 0 auto; width:var(--asideW,300px); min-width:180px;
  background:var(--bg2); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
body.no-aside aside{display:none}

/* Dải kéo để đổi bề rộng, nằm đè lên mép panel. */
.gutter{
  position:absolute;top:0;bottom:0;width:7px;cursor:col-resize;z-index:30;
}
.gutter::after{
  content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:transparent;transition:background .15s;
}
.gutter:hover::after,.gutter.on::after{background:var(--accent)}
aside .gutter{right:-3px}
.insp .gutter{left:-3px}

button.icon{
  flex:0 0 auto;border:1px solid var(--line2);background:var(--panel);color:var(--dim);
  border-radius:7px;padding:5px 9px;cursor:pointer;font:inherit;line-height:1;
}
button.icon:hover{border-color:#41506a;color:var(--fg)}
.modes{display:flex;gap:4px;padding:10px 10px 0}
.modes button{
  flex:1 1 0;padding:6px 8px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px;
  border:1px solid var(--line2);background:var(--panel);color:var(--dim);
}
.modes button.on{background:#18222f;border-color:#2b4a68;color:var(--fg)}
.search{padding:8px 10px 6px}
.search input{
  width:100%; padding:7px 10px; border-radius:8px; border:1px solid var(--line2);
  background:var(--panel); color:var(--fg); outline:none; font:inherit;
}
.search input:focus{border-color:var(--accent)}
.list{overflow:auto;padding:0 8px 18px;flex:1 1 auto}
.grp{padding:14px 8px 6px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2)}
.flow{
  display:block;width:100%;text-align:left;cursor:pointer;
  padding:8px 10px;margin-bottom:3px;border-radius:8px;
  border:1px solid transparent;background:none;color:var(--fg);font:inherit;
}
.flow:hover{background:#1a212c}
.flow.on{background:#18222f;border-color:#2b4a68}
.flow .t{display:flex;align-items:center;gap:8px}
.flow .n{
  flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--line);
  color:var(--dim);display:grid;place-items:center;font-size:10.5px
}
.flow.on .n{background:var(--accent);color:#06121d;font-weight:700}
.flow .s{color:var(--dim);font-size:11.5px;margin-top:3px;margin-left:28px}

.scr{margin:10px 0 2px;padding:8px 10px;border-radius:8px;background:#151b24;border:1px solid var(--line)}
.scr .sn{display:flex;align-items:baseline;gap:8px}
.scr .sn b{font-size:12.5px}
.scr .sn code{color:var(--dim2);font-size:10.5px;margin-left:auto}
.scr .sd{color:var(--dim);font-size:11px;margin-top:3px}
.btnrow{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  padding:7px 10px 7px 14px;margin:2px 0;border-radius:8px;
  border:1px solid transparent;background:none;color:var(--fg);font:inherit;
}
.btnrow:hover{background:#1a212c}
.btnrow.on{background:#18222f;border-color:#2b4a68}
.btnrow .chip{
  flex:0 0 auto;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:2px 8px;border-radius:6px;background:#1e2733;border:1px solid var(--line2);
  font-size:11.5px;color:#cfe0f2;
}
.btnrow.on .chip{background:var(--accent);border-color:var(--accent);color:#06121d;font-weight:600}
.btnrow .to{color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btnrow.nav{cursor:default}
.btnrow.nav:hover{background:none}
.btnrow.nav .chip{background:none;border-style:dashed;color:var(--dim2)}
.btnrow.nav .to{color:var(--dim2);font-style:italic}

section{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg2);
}
.crumb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.crumb .c-screen{color:var(--dim);font-size:12px}
.crumb .c-btn{
  padding:1px 8px;border-radius:6px;background:#1e2733;border:1px solid var(--line2);
  font-size:11.5px;color:#cfe0f2;
}
.crumb .c-sep{color:var(--dim2)}
.crumb .c-flow{font-size:14px;font-weight:600}
.crumb .c-sub{color:var(--dim);font-size:11.5px}
.spacer{flex:1 1 auto}
button.b{
  border:1px solid var(--line2);background:var(--panel);color:var(--fg);
  padding:6px 11px;border-radius:7px;cursor:pointer;font:inherit;
}
button.b:hover:not(:disabled){border-color:#41506a;background:#1a2130}
button.b:disabled{opacity:.4;cursor:default}
button.b.run{background:var(--accent);border-color:var(--accent);color:#06121d;font-weight:600}
button.b.run:hover:not(:disabled){background:#77c5ff}
button.b.stop{background:#3a1f26;border-color:#6b3540;color:#ffb3bd}
.speed{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11.5px}
.speed input{width:90px;accent-color:var(--accent)}

.trigbar{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:6px 14px;border-bottom:1px solid var(--line);background:#0f131a;
}
.trigbar .lbl{color:var(--dim2);font-size:11px}
.tchip{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:inherit;font-size:11.5px;
  padding:3px 9px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);color:var(--dim);
}
.tchip:hover{border-color:#41506a;color:var(--fg)}
.tchip.on{background:#18222f;border-color:#3d6c96;color:var(--fg)}
.tchip s{text-decoration:none;color:var(--dim2)}
.tchip.on s{color:#8fb9dd}

.wrap{flex:1 1 auto;position:relative;overflow:auto;background:
  radial-gradient(circle at 1px 1px,#1b2230 1px,transparent 0) 0 0/26px 26px, var(--bg)}
.sizer{position:relative}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
svg.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}

.band{position:absolute;left:0;pointer-events:none}
.band .fill{position:absolute;inset:0;background:var(--c);opacity:.030}
.band .rule{position:absolute;left:0;right:0;top:0;height:1px;background:var(--line)}
.lane-label{
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--c);opacity:.85;white-space:nowrap;pointer-events:none;
}
.lane-label small{display:block;color:var(--dim2);letter-spacing:.2px;text-transform:none;font-size:10.5px;margin-top:2px}

.node{
  position:absolute;width:var(--nw);padding:9px 11px 10px;border-radius:10px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line2);
  transition:border-color .22s, box-shadow .22s, transform .22s, background .22s;
}
.node::before{
  content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2px;border-radius:2px;
  background:var(--c);opacity:.55;
}
.node:hover{border-color:#41506a}
.node .n-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.node .n-i{
  width:17px;height:17px;border-radius:5px;background:#1d2530;color:var(--dim);
  display:grid;place-items:center;font-size:10px;flex:0 0 auto
}
.node .n-file{color:var(--dim2);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .n-fn{font-family:Consolas,monospace;font-size:12.5px;color:var(--c);word-break:break-word}
.node .n-desc{color:var(--dim);font-size:11.5px;margin-top:5px}
.node.done{border-color:#33506b;background:#161d27}
.node.done .n-i{background:var(--c);color:#06121d;font-weight:700}
.node.active{
  border-color:var(--c);background:#1a2331;transform:scale(1.035);
  box-shadow:0 0 0 1px var(--c),0 0 26px -4px var(--c),0 10px 30px -12px #000;
  z-index:3;
}
.node.active .n-i{background:var(--c);color:#06121d;font-weight:700}
.node.active .n-desc{color:#c3ccd8}
.node.picked{outline:2px dashed var(--c);outline-offset:3px}

.e-base{fill:none;stroke:var(--line2);stroke-width:1.6}
.e-lit{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linecap:round;opacity:0}
.e-lit.on{opacity:1}
.e-flow{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:7 13;opacity:0}
.e-flow.on{opacity:.9;animation:march .55s linear infinite}
@keyframes march{to{stroke-dashoffset:-20}}
.e-base.err{stroke-dasharray:5 6;stroke:#6b414b}
.e-base.loop{stroke-dasharray:5 6;stroke:#3f5f55}
.e-alt{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 8;opacity:0}
.e-alt.on{opacity:.9;animation:march .75s linear infinite}
.e-label{font-size:10.5px;fill:var(--dim2);font-family:Consolas,monospace}
.e-label.err{fill:#a8626f}
.e-label.loop{fill:#6fae92}

.insp{
  position:relative;
  flex:0 0 auto;width:var(--inspW,340px);min-width:240px;
  background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.insp.hide{display:none}
/* Màn hẹp thì panel nổi lên trên canvas, thay vì bóp canvas còn một dải. */
@media (max-width:1240px){
  .insp{position:fixed;top:0;right:0;bottom:0;z-index:20;box-shadow:-18px 0 40px -20px #000}
}
.insp-head{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.insp-head .lane{
  font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--c);
  border:1px solid var(--c);border-radius:5px;padding:1px 6px;opacity:.85;flex:0 0 auto;margin-top:2px;
}
.insp-head .nm{flex:1 1 auto;min-width:0}
.insp-head .nm b{font-family:Consolas,monospace;font-size:14px;word-break:break-word}
.insp-head .nm div{color:var(--dim2);font-size:11px;margin-top:2px}
.insp-head .x{flex:0 0 auto;border:none;background:none;color:var(--dim2);cursor:pointer;font-size:17px;line-height:1;padding:0 2px}
.insp-head .x:hover{color:var(--fg)}
.insp-body{overflow:auto;padding:4px 14px 20px;flex:1 1 auto}
.sec{margin-top:14px}
.sec > h4{margin:0 0 6px;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2);font-weight:600}
.loc{display:flex;align-items:center;gap:8px}
.loc code{
  flex:1 1 auto;background:var(--panel);border:1px solid var(--line2);border-radius:6px;
  padding:5px 8px;font-size:11.5px;color:#cfe0f2;overflow:hidden;text-overflow:ellipsis;
  user-select:all;cursor:text;
}
.loc button{
  flex:0 0 auto;border:1px solid var(--line2);background:var(--panel);color:var(--fg);
  border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit;font-size:11.5px;
}
.loc button:hover{border-color:#41506a}
.desc{color:#c3ccd8;font-size:12.5px}
.sig{
  background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;
  font-size:11.5px;color:var(--dim);white-space:pre-wrap;word-break:break-word;
}
.pos{color:var(--dim);font-size:12px}
.hop{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.hop button{
  flex:1 1 130px;min-width:0;text-align:left;border:1px solid var(--line2);background:var(--panel);
  color:var(--fg);border-radius:7px;padding:6px 9px;cursor:pointer;font:inherit;font-size:11.5px;
}
.hop button:hover{border-color:#41506a;background:#1a2130}
.hop button span{display:block;color:var(--dim2);font-size:10px;margin-bottom:1px}
.hop button b{font-family:Consolas,monospace;font-weight:400;font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xref button{
  display:block;width:100%;text-align:left;border:1px solid transparent;background:none;
  color:var(--fg);border-radius:7px;padding:5px 8px;cursor:pointer;font:inherit;font-size:11.5px;margin-bottom:2px;
}
.xref button:hover{background:#1a212c;border-color:var(--line2)}
.xref button i{font-style:normal;color:var(--dim2);font-size:10.5px;margin-left:6px}
.code{
  background:#0e1218;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;
  font-size:11px;line-height:1.55;color:#b9c6d6;overflow:auto;max-height:340px;margin:0;white-space:pre;
}
.nosrc{color:var(--dim2);font-size:11.5px;font-style:italic}
.stamp{color:var(--dim2);font-size:10.5px;margin-top:6px}

footer{
  flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg2);
  padding:8px 14px 10px;display:flex;flex-direction:column;gap:7px;
}
.track{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.pip{
  flex:0 0 auto;min-width:26px;height:22px;padding:0 7px;border-radius:6px;cursor:pointer;
  background:#1a2028;border:1px solid var(--line);color:var(--dim2);font-size:10.5px;
  display:grid;place-items:center;
}
.pip:hover{border-color:var(--line2)}
.pip.done{background:#1d2b39;border-color:#2f4a63;color:#9fc4e4}
.pip.active{background:var(--accent);border-color:var(--accent);color:#06121d;font-weight:700}
.now{display:flex;gap:9px;align-items:baseline;min-height:19px}
.now .k{color:var(--dim2);font-size:11px;flex:0 0 auto}
.now .fn{font-family:Consolas,monospace;color:var(--fg)}
.now .d{color:var(--dim);font-size:12px}
.hint{color:var(--dim2);font-size:11px}
kbd{background:#1c232e;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:10.5px}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:#1d2733;border:1px solid #3d6c96;border-radius:8px;padding:7px 14px;font-size:12px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;
}
.toast.on{opacity:1}
.fatal{margin:40px auto;max-width:560px;padding:20px;border:1px solid #6b3540;border-radius:10px;background:#1a1216}
</style>
</head>
<body>

<header>
  <div class="brand"><b id="appName"></b><span id="appSub"></span></div>
  <div class="legend" id="legend"></div>
</header>

<main>
  <aside>
    <div class="modes">
      <button id="mTheme" class="on">Theo chủ đề</button>
      <button id="mScreen">Theo màn hình</button>
    </div>
    <div class="search"><input id="q" placeholder="Lọc…" autocomplete="off"></div>
    <div class="list" id="list"></div>
    <div class="gutter" id="gutterL" title="Kéo để đổi bề rộng"></div>
  </aside>

  <section>
    <div class="toolbar">
      <button class="icon" id="bAside" title="Ẩn/hiện danh sách luồng (B)">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <div class="speed">Tốc độ<input type="range" id="speed" min="1" max="10" value="6"></div>
      <button class="b" id="bPrev" title="Lùi một bước">◀</button>
      <button class="b run" id="bPlay">▶ Chạy</button>
      <button class="b" id="bNext" title="Tiến một bước">▶|</button>
      <button class="b" id="bReset">Đặt lại</button>
      <button class="b" id="bFit" title="Vừa khung">⤢</button>
    </div>
    <div class="trigbar" id="trigbar"></div>

    <div class="wrap" id="wrap"><div class="sizer" id="sizer"><div class="stage" id="stage">
      <svg class="edges" id="svg"></svg>
    </div></div></div>

    <footer>
      <div class="track" id="track"></div>
      <div class="now" id="now"></div>
    </footer>
  </section>

  <div class="insp hide" id="insp">
    <div class="gutter" id="gutterR" title="Kéo để đổi bề rộng"></div>
    <div class="insp-head" id="inspHead"></div>
    <div class="insp-body" id="inspBody"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>

return data;\n}","approx":false},"api.state()":{"sig":"func (a *api) state(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) state(w http.ResponseWriter, r *http.Request) {\n\tversion, ok := a.store.DockerVersion()\n\twriteJSON(w, http.StatusOK, map[string]any{\n\t\t\"config\":        a.store.Config(),\n\t\t\"builds\":        a.store.Builds(),\n\t\t\"dockerOk\":      ok,\n\t\t\"dockerVersion\": version,\n\t\t\"buildxOk\":      a.store.BuildxOK(),\n\t\t\"appVersion\":    appVersion,\n\t})\n}","approx":false},"Store.Config()":{"sig":"func (s *Store) Config() Config {","code":"func (s *Store) Config() Config {\n\ts.mu.RLock()\n\tdefer s.mu.RUnlock()\n\treturn s.config\n}","approx":false},"Store.Builds()":{"sig":"func (s *Store) Builds() []Build {","code":"// Builds returns the history newest first.\nfunc (s *Store) Builds() []Build {\n\ts.mu.RLock()\n\tdefer s.mu.RUnlock()\n\tout := make([]Build, len(s.builds))\n\tcopy(out, s.builds)\n\tsort.Slice(out, func(i, j int) bool { return out[i].StartedAt.After(out[j].StartedAt) })\n\treturn out\n}","approx":false},"DockerVersion()":{"sig":"func (s *Store) DockerVersion() (string, bool) {","code":"// DockerVersion reports whether the docker CLI is reachable.\n//\n// The UI polls the state endpoint every few seconds, so the answer is cached\n// briefly: asking docker each time meant spawning a process per poll, per\n// open window, for a value that almost never changes.\nfunc (s *Store) DockerVersion() (string, bool) {\n\tconst freshFor = 10 * time.Second\n\n\ts.mu.RLock()\n\tif time.Since(s.dockerCheckedAt) < freshFor {\n\t\tv, ok := s.dockerVersion, s.dockerOK\n\t\ts.mu.RUnlock()\n\t\treturn v, ok\n\t}\n\ts.mu.RUnlock()\n\n\tctx, cancel := context.WithTimeout(context.Background(), 6*time.Second)\n\tdefer cancel()\n\tcmd := exec.CommandContext(ctx, s.Config().DockerBin, \"version\", \"--format\", \"{{.Server.Version}}\")\n\thideWindow(cmd)\n\tout, err := cmd.Output()\n\n\tv := \"\"\n\tif err == nil {\n\t\tv = strings.TrimSpace(string(out))\n\t}\n\n\ts.mu.Lock()\n\ts.dockerVersion, s.dockerOK, s.dockerCheckedAt = v, v != \"\", time.Now()\n\ts.mu.Unlock()\n\treturn v, v != \"\"\n}","approx":false},"BuildxOK()":{"sig":"func (s *Store) BuildxOK() bool { return s.buildxAvailable() }","code":"// BuildxOK reports whether promotes can skip the pull/push round trip.\nfunc (s *Store) BuildxOK() bool { return s.buildxAvailable() }","approx":false},"writeJSON()":{"sig":"func writeJSON(w http.ResponseWriter, code int, v any) {","code":"func writeJSON(w http.ResponseWriter, code int, v any) {\n\tw.Header().Set(\"Content-Type\", \"application/json; charset=utf-8\")\n\tw.WriteHeader(code)\n\t_ = json.NewEncoder(w).Encode(v)\n}","approx":false},"render()":{"sig":"function render(){ renderRail(); renderPane(); }","code":"/* ---------- render ---------- */\nfunction render(){ renderRail(); renderPane(); }","approx":false},"renderPane()":{"sig":"function renderPane(){","code":"function renderPane(){\n  const sel = state.sel;\n  if (sel.kind === 'project'){ const p = findProject(sel.id); if (p) return renderProject(p); }\n  if (sel.kind === 'env'){ const hit = findEnv(sel.id); if (hit) return renderEnv(hit.p, hit.e); }\n  renderOverview();\n}","approx":false},"projectDialog()":{"sig":"function projectDialog(p){","code":"/* ---------- project settings ---------- */\nfunction projectDialog(p){\n  const draft = JSON.parse(JSON.stringify(p));\n  draft.buildArgs = draft.buildArgs || [];\n  draft.labels = draft.labels || [];\n  const envs = draft.envs || [];\n\n  const m = openModal(`\n    <h2>Cài đặt dự án ${esc(p.name)}</h2>\n    <p class=\"sub\">Giá trị ở đây áp cho mọi môi trường của dự án. Môi trường nào khai riêng thì giá trị của nó thắng.</p>\n    <div class=\"grid2\">\n      <label class=\"f\"><span>Tên dự án</span><input type=\"text\" id=\"f-name\" value=\"${esc(draft.name)}\"></label>\n      <label class=\"f\"><span>Nhóm — để trống thì nằm ngoài nhóm</span>\n        <input type=\"text\" id=\"f-group\" list=\"groups\" value=\"${esc(draft.group||'')}\" placeholder=\"ví dụ: khách hàng A\">\n        <datalist id=\"groups\">${groupNames().map(g => `<option value=\"${esc(g)}\">`).join('')}</datalist>\n      </label>\n    </div>\n    <div class=\"grid2\">\n      <label class=\"f\"><span>Cách đưa version qua các môi trường</span>\n        <select id=\"f-mode\">\n          <option value=\"rebuild\" ${draft.releaseMode!=='promote'?'selected':''}>Build lại cho từng môi trường</option>\n          <option value=\"promote\" ${draft.releaseMode==='promote'?'selected':''}>Build một lần rồi promote</option>\n        </select></label>\n    </div>\n    <label class=\"f\" id=\"src-wrap\"><span>Môi trường nguồn — nơi duy nhất được build</span>\n      <select id=\"f-src\">${envs.map(e => `<option value=\"${esc(e.id)}\" ${e.id===buildEnvId(p)?'selected':''}>${esc(e.name)}</option>`).join('')}</select>\n    </label>\n    <label class=\"f\"><span>Thư mục mã nguồn — nơi chạy lệnh docker build</span>\n      <div class=\"pathrow\">\n        <input type=\"text\" id=\"f-ctx\" value=\"${esc(draft.context||'')}\" placeholder=\"chưa chọn thư mục\">\n        <button type=\"button\" class=\"btn\" id=\"pick-ctx\">Chọn thư mục</button>\n…","approx":false},"envDialog()":{"sig":"function envDialog(p, e){","code":"/* ---------- environment settings ---------- */\nfunction envDialog(p, e){\n  const draft = JSON.parse(JSON.stringify(e));\n  draft.buildArgs = draft.buildArgs || [];\n  draft.labels = draft.labels || [];\n  const inh = v => v ? `kế thừa: ${v}` : 'để trống';\n\n  const m = openModal(`\n    <h2>Cài đặt môi trường ${esc(e.name)}</h2>\n    <p class=\"sub\">Chỉ khai những gì khác với dự án ${esc(p.name)}. Ô để trống thì lấy giá trị của dự án.</p>\n    <div class=\"grid2\">\n      <label class=\"f\"><span>Tên môi trường</span><input type=\"text\" id=\"f-name\" value=\"${esc(draft.name)}\"></label>\n      <label class=\"f\"><span>Tiền tố tag</span><input type=\"text\" id=\"f-prefix\" ed = await api('/api/config', {method:'PUT', body:JSON.stringify(next)});\n  state.config = saved;\n  if (okMsg) toast(okMsg);\n  await refresh();\n  return saved;\n}","approx":false},"api.saveConfig()":{"sig":"func (a *api) saveConfig(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) saveConfig(w http.ResponseWriter, r *http.Request) {\n\tvar c Config\n\tif err := json.NewDecoder(r.Body).Decode(&c); err != nil {\n\t\tfail(w, http.StatusBadRequest, \"JSON không hợp lệ: \"+err.Error())\n\t\treturn\n\t}\n\tfor _, p := range c.Projects {\n\t\tif strings.TrimSpace(p.Name) == \"\" {\n\t\t\tfail(w, http.StatusBadRequest, \"mỗi dự án phải có tên\")\n\t\t\treturn\n\t\t}\n\t\tfor _, e := range p.Envs {\n\t\t\tif strings.TrimSpace(e.Name) == \"\" {\n\t\t\t\tfail(w, http.StatusBadRequest, \"môi trường trong dự án \"+p.Name+\" chưa có tên\")\n\t\t\t\treturn\n\t\t\t}\n\t\t\t// The image may be set on either level; what matters is the\n\t\t\t// value the environment ends up with.\n\t\t\tif strings.TrimSpace(p.Effective(e).Image) == \"\" {\n\t\t\t\tfail(w, http.StatusBadRequest, \"môi trường \"+e.Name+\" chưa có tên image — khai ở dự án hoặc ở chính môi trường\")\n\t\t\t\treturn\n\t\t\t}\n\t\t\tif strings.ContainsAny(e.TagPrefix, badTagChars) {\n\t\t\t\tfail(w, http.StatusBadRequest, \"tiền tố tag của \"+e.Name+\" không được chứa khoảng trắng hoặc dấu : / \\\\\")\n\t\t\t\treturn\n\t\t\t}\n\t\t\t// Deliberately NOT checked here: whether the build context\n\t\t\t// exists on disk. Saving rewrites the whole file, so refusing it\n\t\t\t// over one bad folder blocks every unrelated edit — including\n\t\t\t// deleting the very project that is broken. A folder can also\n…","approx":false},"Project.Effective()":{"sig":"func (p Project) Effective(e Env) Env {","code":"// Effective resolves an environment against its project. Every consumer\n// (the builder, the API, the pull command) works with the result, never\n// with the raw Env.\nfunc (p Project) Effective(e Env) Env {\n\tout := e\n\tout.Registry = firstNonEmpty(e.Registry, p.Registry)\n\tout.Image = firstNonEmpty(e.Image, p.Image)\n\tout.Context = firstNonEmpty(e.Context, p.Context)\n\tout.Dockerfile = firstNonEmpty(e.Dockerfile, p.Dockerfile)\n\tout.Platform = firstNonEmpty(e.Platform, p.Platform)\n\tout.Target = firstNonEmpty(e.Target, p.Target)\n\tout.BuildArgs = mergeKV(p.BuildArgs, e.BuildArgs)\n\tout.Labels = mergeKV(p.Labels, e.Labels)\n\t// Flags are additive by nature, so the environment's are appended to the\n\t// project's rather than replacing them.\n\tout.ExtraFlags = strings.TrimSpace(strings.TrimSpace(p.ExtraFlags) + \" \" + strings.TrimSpace(e.ExtraFlags))\n\treturn out\n}","approx":false},"Store.SaveConfig()":{"sig":"func (s *Store) SaveConfig(c Config) error {","code":"// SaveConfig snapshots the current file before overwriting it, so every\n// settings change is recoverable from the Versions list.\nfunc (s *Store) SaveConfig(c Config) error {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\ts.snapshotConfigLocked()\n\tc = normalise(c)\n\tif err := s.writeConfigFile(c); err != nil {\n\t\treturn err\n\t}\n\ts.config = c\n\treturn nil\n}","approx":false},"snapshotConfigLocked()":{"sig":"func (s *Store) snapshotConfigLocked() {","code":"// snapshotConfigLocked copies the config file as it is on disk into the\n// versions folder. Callers hold the lock, or run before the store is shared.\nfunc (s *Store) snapshotConfigLocked() {\n\told, err := os.ReadFile(s.configPath())\n\tif err != nil {\n\t\treturn\n\t}\n\tname := fmt.Sprintf(\"config-%s.json\", time.Now().Format(\"20060102-150405\"))\n\t_ = os.WriteFile(filepath.Join(s.root, \"versions\", name), old, 0o644)\n}","approx":false},"normalise()":{"sig":"func normalise(c Config) Config {","code":"// normalise fills in the defaults and identifiers a hand-edited or restored\n// config.json may be missing.\nfunc normalise(c Config) Config {\n\tif strings.TrimSpace(c.DockerBin) == \"\" {\n\t\tc.DockerBin = \"docker\"\n\t}\n\tc.SchemaVersion = currentSchema\n\tfor i := range c.Projects {\n\t\tp := &c.Projects[i]\n\t\tif p.ID == \"\" {\n\t\t\tp.ID = newID()\n\t\t}\n\t\tp.Group = strings.TrimSpace(p.Group)\n\t\tif p.ReleaseMode != ModePromote {\n\t\t\tp.ReleaseMode = ModeRebuild\n\t\t}\n\t\tif p.BuildArgs == nil {\n\t\t\tp.BuildArgs = []KV{}\n\t\t}\n\t\tif p.Labels == nil {\n\t\t\tp.Labels = []KV{}\n\t\t}\n\t\tif p.Envs == nil {\n\t\t\tp.Envs = []Env{}\n\t\t}\n\t\tfor j := range p.Envs {\n\t\t\te := &p.Envs[j]\n\t\t\tif e.ID == \"\" {\n\t\t\t\te.ID = newID()\n\t\t\t}\n\t\t\tif e.LastVersion == \"\" && e.LastTag != \"\" {\n\t\t\t\te.LastVersion = e.LastTag\n…","approx":false},"writeConfigFile()":{"sig":"func (s *Store) writeConfigFile(c Config) error {","code":"func (s *Store) writeConfigFile(c Config) error {\n\traw, err := json.MarshalIndent(c, \"\", \"  \")\n\tif err != nil {\n\t\treturn err\n\t}\n\treturn os.WriteFile(s.configPath(), append(raw, '\\n'), 0o644)\n}","approx":false},"mountPath()":{"sig":"function mountPath(input, btn, infoEl, wantedDockerfile, inheritedPath, onPick){","code":"function mountPath(input, btn, infoEl, wantedDockerfile, inheritedPath, onPick){\n  let timer;\n\n  const render = info => {\n    const inherited = !input.value.trim() && info.path;\n    if (!info.path){\n      infoEl.className = 'pathinfo none';\n      infoEl.textContent = 'Chưa chọn thư mục — build sẽ không chạy được.';\n      return;\n    }\n    const prefix = inherited ? 'Kế thừa ' + info.path + ' — ' : '';\n    if (!info.exists){\n      infoEl.className = 'pathinfo bad';\n      infoEl.textContent = prefix + 'không tìm thấy thư mục này.';\n      return;\n    }\n    if (!info.isDir){\n      infoEl.className = 'pathinfo bad';\n      infoEl.textContent = prefix + 'đây là một file, không phải thư mục.';\n      return;\n    }\n    if (info.hasWanted){\n      infoEl.className = 'pathinfo ok';\n      infoEl.textContent = prefix + 'đã thấy ' + info.wanted + ' trong thư mục này.';\n      return;\n    }\n    infoEl.className = 'pathinfo bad';\n    infoEl.textContent = prefix + (info.dockerfiles.length\n      ? 'không thấy ' + info.wanted + '. Thư mục này đang có: ' + info.dockerfiles.join(', ')\n      : 'không thấy Dockerfile nào trong thư mục này.');\n…","approx":false},"POST /api/pick-folder":{"sig":"const picked = await api('/api/pick-folder', {method:'POST'});","code":"const label = btn.textContent;\nbtn.textContent = 'Đang mở…';\ntry {\n  const picked = await api('/api/pick-folder', {method:'POST'});\n  if (picked.path){\n    input.value = picked.path;\n    if (onPick) onPick(picked.path);\n  }\n  await check();","approx":true},"api.pickFolder()":{"sig":"func (a *api) pickFolder(w http.ResponseWriter, r *http.Request) {","code":"// pickFolder opens the desktop's own folder chooser. The UI runs in a\n// browser, which is not allowed to know real paths, so the dialog has to be\n// opened by this process and the chosen path handed back.\nfunc (a *api) pickFolder(w http.ResponseWriter, r *http.Request) {\n\tpath, err := pickFolder(\"Chọn thư mục mã nguồn của dự án\")\n\tif err != nil {\n\t\tfail(w, http.StatusInternalServerError, err.Error())\n\t\treturn\n\t}\n\twriteJSON(w, http.StatusOK, inspectFolder(path, \"\"))\n}","approx":false},"pickFolder()":{"sig":"func pickFolder(title string) (string, error) {","code":"// The dialog is opened by powershell.exe instead of by calling shell32 from\n// this process. Doing it by hand worked, but it made the unsigned binary\n// look suspicious to Smart App Control, which then refused to run DIMA at\n// all — an app that will not start is worse than a dialog that takes an\n// extra second to appear. powershell.exe ships signed by Microsoft, so this\n// route is allowed. Its console window is suppressed by hideWindow.\nfunc pickFolder(title string) (string, error) {\n\tscript := `[Console]::OutputEncoding = [System.Text.Encoding]::UTF8\nAdd-Type -AssemblyName System.Windows.Forms\n$d = New-Object System.Windows.Forms.FolderBrowserDialog\n$d.Description = '` + strings.ReplaceAll(title, \"'\", \"\") + `'\n$d.ShowNewFolderButton = $true\n$d.RootFolder = [Environment+SpecialFolder]::MyComputer\nif ($d.ShowDialog() -eq [System.Windows.Forms.DialogResult]::OK) { [Console]::Out.Write($d.SelectedPath) }`\n\n\tcmd := exec.Command(\"powershell.exe\", \"-NoProfile\", \"-STA\", \"-Command\", script)\n\thideWindow(cmd)\n\tout, err := cmd.Output()\n\tif err != nil {\n\t\treturn \"\", fmt.Errorf(\"không mở được hộp thoại chọn thư mục: %w\", err)\n\t}\n\treturn strings.TrimSpace(string(out)), nil\n}","approx":false},"inspectFolder()":{"sig":"func inspectFolder(path, dockerfile string) folderInfo {","code":"func inspectFolder(path, dockerfile string) folderInfo {\n\tinfo := folderInfo{Path: path, Wanted: dockerfileOr(dockerfile), Dockerfiles: []string{}}\n\tif strings.TrimSpace(path) == \"\" {\n\t\treturn info\n\t}\n\tst, err := os.Stat(path)\n\tif err != nil {\n\t\treturn info\n\t}\n\tinfo.Exists = true\n\tinfo.IsDir = st.IsDir()\n\tif !info.IsDir {\n\t\treturn info\n\t}\n\tentries, err := os.ReadDir(path)\n\tif err != nil {\n\t\treturn info\n\t}\n\tfor _, e := range entries {\n\t\tif e.IsDir() {\n\t\t\tcontinue\n\t\t}\n\t\tif n := e.Name(); n == \"Dockerfile\" || strings.HasPrefix(n, \"Dockerfile.\") ||\n\t\t\tstrings.HasSuffix(strings.ToLower(n), \".dockerfile\") {\n\t\t\tinfo.Dockerfiles = append(info.Dockerfiles, n)\n\t\t}\n\t}\n\t// The configured Dockerfile may sit in a subfolder, so check the path\n\t// rather than only the listing above.\n\tif _, err := os.Stat(filepath.Join(path, info.Wanted)); err == nil {\n…","approx":false},"render(info)":{"sig":"const render = info => {","code":"const render = info => {\n  const inherited = !input.value.trim() && info.path;\n  if (!info.path){\n    infoEl.className = 'pathinfo none';\n    infoEl.textContent = 'Chưa chọn thư mục — build sẽ không chạy được.';\n    return;\n  }\n  const prefix = inherited ? 'Kế thừa ' + info.path + ' — ' : '';\n  if (!info.exists){\n    infoEl.className = 'pathinfo bad';\n    infoEl.textContent = prefix + 'không tìm thấy thư mục này.';\n    return;\n  }\n  if (!info.isDir){\n    infoEl.className = 'pathinfo bad';\n    infoEl.textContent = prefix + 'đây là một file, không phải thư mục.';\n    return;\n  }\n  if (info.hasWanted){\n    infoEl.className = 'pathinfo ok';\n    infoEl.textContent = prefix + 'đã thấy ' + info.wanted + ' trong thư mục này.';\n    return;\n  }\n  infoEl.className = 'pathinfo bad';\n  infoEl.textContent = prefix + (info.dockerfiles.length\n    ? 'không thấy ' + info.wanted + '. Thư mục này đang có: ' + info.dockerfiles.join(', ')\n    : 'không thấy Dockerfile nào trong thư mục này.');\n};","approx":false},"importDialog()":{"sig":"function importDialog(){","code":"/* ---------- bulk import ---------- */\nfunction importDialog(){\n  const m = openModal(`\n    <h2>Quét thư mục mã nguồn</h2>\n    <p class=\"sub\">Chọn một thư mục cha. DIMA tìm các thư mục con có Dockerfile (sâu tối đa ba tầng) và tạo mỗi thư mục một dự án.</p>\n    <label class=\"f\"><span>Thư mục cha</span>\n      <div class=\"pathrow\">\n        <input type=\"text\" id=\"root\" placeholder=\"ví dụ: D:\\\\work\">\n        <button type=\"button\" class=\"btn\" id=\"pick\">Chọn thư mục</button>\n      </div>\n    </label>\n    <div class=\"grid2\">\n      <label class=\"f\"><span>Nhóm cho tất cả</span><input type=\"text\" id=\"group\" list=\"groups2\" placeholder=\"lấy theo tên thư mục cha\">\n        <datalist id=\"groups2\">${groupNames().map(g => `<option value=\"${esc(g)}\">`).join('')}</datalist></label>\n      <label class=\"f\"><span>Registry cho tất cả — để trống nếu build local</span><input type=\"text\" id=\"reg\" placeholder=\"git.mmt.local\"></label>\n    </div>\n    <div class=\"section-label\" style=\"margin:16px 0 8px\">Tìm thấy <span class=\"count\" id=\"count\">—</span>\n      <button class=\"btn sm ghost\" id=\"all\" style=\"margin-left:auto\">Chọn tất cả</button>\n      <button class=\"btn sm ghost\" id=\"none\">Bỏ chọn</button>\n    </div>\n    <div id=\"hits\"><div class=\"kv-empty\">Chọn thư mục cha để bắt đầu.</div></div>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" id=\"cancel\">Hủy</button>\n      <button class=\"btn primary\" id=\"go\" disabled>Thêm</button>\n    </div>`, true);\n\n  const rootIn = $('#root', m), groupIn = $('#group', m);\n  let hits = [];\n  const taken = new Set(projects().flatMap(p => (p.envs||[]).map(e => (effective(p,e).context||'').toLowerCase()).concat([(p.context||'').toLowerCase()])).filter(Boolean));\n\n  const selected = () => $$('#hits input:checked', m).map(c => hits[+c.dataset.i]);\n…","approx":false},"scan()":{"sig":"const scan = async () => {","code":"const scan = async () => {\n  const path = rootIn.value.trim();\n  if (!path) return;\n  $('#hits', m).innerHTML = `<div class=\"kv-empty\">Đang quét ${esc(path)}…</div>`;\n  try {\n    const res = await api('/api/scan-folder?path=' + encodeURIComponent(path));\n    hits = res.hits || [];\n    if (!groupIn.value.trim()) groupIn.value = res.group || '';\n    drawHits();\n    if (res.truncated) toast('Quá nhiều thư mục, chỉ hiện ' + hits.length + ' cái đầu tiên', true);\n  } catch (e) {\n    hits = [];\n    $('#hits', m).innerHTML = `<div class=\"kv-empty\">${esc(e.message)}</div>`;\n    syncGo();\n  }\n};","approx":false},"api.scanFolder()":{"sig":"func (a *api) scanFolder(w http.ResponseWriter, r *http.Request) {","code":"// tree of repositories can be added in one go instead of one at a time.\n//\n// It looks three levels down, which covers a flat folder of repositories,\n// the common apps/<name> layout, and one grouping folder above either of\n// them. Descending stops as soon as a folder turns out to be buildable, so\n// a repository's own subfolders are never mistaken for separate projects.\nfunc (a *api) scanFolder(w http.ResponseWriter, r *http.Request) {\n\troot := strings.TrimSpace(r.URL.Query().Get(\"path\"))\n\tif root == \"\" {\n\t\tfail(w, http.StatusBadRequest, \"chưa chọn thư mục để quét\")\n\t\treturn\n\t}\n\tst, err := os.Stat(root)\n\tif err != nil || !st.IsDir() {\n\t\tfail(w, http.StatusBadRequest, \"không tìm thấy thư mục: \"+root)\n\t\treturn\n\t}\n\n\thits := []scanHit{}\n\t// The parent folder may itself be a project.\n\tif df := dockerfileIn(root); df != \"\" {\n\t\thits = append(hits, scanHit{Name: filepath.Base(root), Path: root, Dockerfile: df, Depth: 0})\n\t}\n\tvar walk func(dir string, depth int)\n\twalk = func(dir string, depth int) {\n\t\tif depth > 3 || len(hits) >= maxScanHits {\n\t\t\treturn\n\t\t}\n\t\tentries, err := os.ReadDir(dir)\n\t\tif err != nil {\n\t\t\treturn\n\t\t}\n\t\tfor _, e := range entries {\n\t\t\tif !e.IsDir() || len(hits) >= maxScanHits || skipDir(e.Name()) {\n\t\t\t\tcontinue\n\t\t\t}\n…","approx":false},"skipDir()":{"sig":"func skipDir(name string) bool {","code":"// skipDir keeps the scan out of folders that never hold a project of their own.\nfunc skipDir(name string) bool {\n\tswitch name {\n\tcase \"node_modules\", \"vendor\", \"dist\", \"build\", \"target\", \"bin\", \"obj\",\n\t\t\".git\", \".idea\", \".vscode\", \".venv\", \"venv\", \"__pycache__\":\n\t\treturn true\n\t}\n\treturn strings.HasPrefix(name, \".\")\n}","approx":false},"dockerfileIn()":{"sig":"func dockerfileIn(dir string) string {","code":"// dockerfileIn returns the Dockerfile to use for a folder, or \"\".\nfunc dockerfileIn(dir string) string {\n\tif _, err := os.Stat(filepath.Join(dir, \"Dockerfile\")); err == nil {\n\t\treturn \"Dockerfile\"\n\t}\n\tentries, err := os.ReadDir(dir)\n\tif err != nil {\n\t\treturn \"\"\n\t}\n\tfor _, e := range entries {\n\t\tif e.IsDir() {\n\t\t\tcontinue\n\t\t}\n\t\tif n := e.Name(); strings.HasPrefix(n, \"Dockerfile.\") ||\n\t\t\tstrings.HasSuffix(strings.ToLower(n), \".dockerfile\") {\n\t\t\treturn n\n\t\t}\n\t}\n\treturn \"\"\n}","approx":false},"drawHits()":{"sig":"const drawHits = () => {","code":"const drawHits = () => {\n  $('#count', m).textContent = hits.length;\n  if (!hits.length){\n    $('#hits', m).innerHTML = `<div class=\"kv-empty\">Không thấy thư mục con nào có Dockerfile.</div>`;\n    return syncGo();\n  }\n  const root = (rootIn.value.trim() || '').replace(/[\\\\/]+$/, '');\n  const rel = p => {\n    const s = p.startsWith(root) ? p.slice(root.length) : p;\n    return s.replace(/^[\\\\/]+/, '') || '.';\n  };\n  $('#hits', m).innerHTML = `<div class=\"builds\">` + hits.map((h, i) => {\n    const dup = taken.has(h.path.toLowerCase());\n    return `<label class=\"hit${dup ? ' dup' : ''}\">\n      <input type=\"checkbox\" data-i=\"${i}\" ${dup ? 'disabled' : 'checked'}>\n      <b class=\"hit-name\">${esc(h.name)}</b>\n      <span class=\"hit-path\" title=\"${esc(h.path)}\">${esc(rel(h.path))}</span>\n      <span class=\"badge ${dup ? '' : 'pushed'}\">${dup ? 'đã có' : esc(h.dockerfile)}</span>\n    </label>`;\n  }).join('') + `</div>`;\n  $$('#hits input', m).forEach(c => c.onchange = syncGo);\n  syncGo();\n};","approx":false},"imagesDialog()":{"sig":"function imagesDialog(){","code":"/* ---------- import from images already on this machine ---------- */\nfunction imagesDialog(){\n  const m = openModal(`\n    <h2>Quét image có sẵn</h2>\n    <p class=\"sub\">Đọc các image đang có trong Docker trên máy này và đưa chúng vào dự án.\n      Mỗi repository thành một dự án; các tag là phiên bản của nó sẽ hiện luôn trong bảng version.</p>\n    <div class=\"grid2\">\n      <label class=\"f\"><span>Nhóm cho tất cả</span>\n        <input type=\"text\" id=\"group\" list=\"groups3\" placeholder=\"để trống nếu không xếp nhóm\">\n        <datalist id=\"groups3\">${groupNames().map(g => `<option value=\"${esc(g)}\">`).join('')}</datalist></label>\n      <label class=\"f\"><span>&nbsp;</span>\n        <label class=\"check\" style=\"height:36px\"><input type=\"checkbox\" id=\"showAll\"> Hiện cả image tải về từ Docker Hub</label>\n      </label>\n    </div>\n    <div class=\"section-label\" style=\"margin:10px 0 8px\">Repository <span class=\"count\" id=\"count\">…</span>\n      <button class=\"btn sm ghost\" id=\"all\" style=\"margin-left:auto\">Chọn tất cả</button>\n      <button class=\"btn sm ghost\" id=\"none\">Bỏ chọn</button>\n    </div>\n    <div id=\"repos\"><div class=\"kv-empty\">Đang đọc danh sách image…</div></div>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" id=\"cancel\">Hủy</button>\n      <button class=\"btn primary\" id=\"go\" disabled>Thêm</button>\n    </div>`, true);\n\n  let repos = [];\n  const visible = () => repos.filter(r => $('#showAll', m).checked || r.private || r.known);\n  const selected = () => $$('#repos input:checked', m).map(c => c.dataset.repo);\n\n  const syncGo = () => {\n    const n = selected().length;\n    $('#go', m).disabled = n === 0;\n…","approx":false},"Store.LocalImages()":{"sig":"func (s *Store) LocalImages() ([]LocalImage, error) {","code":"// LocalImages lists what `docker images` sees, so existing work can be\n// pulled into DIMA instead of being retyped.\n//\n// It asks for tab separated fields rather than JSON: the field names of\n// `docker images --format json` have moved between docker versions, while\n// this template has been stable for years.\nfunc (s *Store) LocalImages() ([]LocalImage, error) {\n\tctx, cancel := context.WithTimeout(context.Background(), 20*time.Second)\n\tdefer cancel()\n\tcmd := exec.CommandContext(ctx, s.Config().DockerBin, \"images\",\n\t\t\"--format\", \"{{.Repository}}\\t{{.Tag}}\\t{{.ID}}\\t{{.Size}}\\t{{.CreatedSince}}\\t{{.CreatedAt}}\")\n\thideWindow(cmd)\n\tout, err := cmd.Output()\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"không đọc được danh sách image: %w\", err)\n\t}\n\n\tlist := []LocalImage{}\n\tfor _, line := range strings.Split(string(out), \"\\n\") {\n\t\tf := strings.Split(strings.TrimRight(line, \"\\r\"), \"\\t\")\n\t\tif len(f) < 6 || f[0] == \"\" || f[0] == \"<none>\" || f[1] == \"<none>\" {\n\t\t\tcontinue\n\t\t}\n\t\timg := LocalImage{Repository: f[0], Tag: f[1], ID: f[2], Size: f[3], Age: f[4]}\n\t\t// \"2026-09-22 15:45:38 +0700 +07\" — the trailing zone name is not\n\t\t// part of a layout Go understands, so parse the prefix only.\n\t\tif t, err := time.Parse(\"2006-01-02 15:04:05 -0700\", strings.Join(strings.Fields(f[5])[:3], \" \")); err == nil {\n\t\t\timg.CreatedAt = t\n\t\t}\n\t\tlist = append(list, img)\n\t}\n\treturn list, nil\n}","approx":false},"GroupImages()":{"sig":"func GroupImages(images []LocalImage) []ImageRepo {","code":"// GroupImages folds a flat image list into one entry per repository,\n// newest first.\nfunc GroupImages(images []LocalImage) []ImageRepo {\n\tbyRepo := map[string]*ImageRepo{}\n\torder := []string{}\n\n\tfor _, img := range images {\n\t\tr, ok := byRepo[img.Repository]\n\t\tif !ok {\n\t\t\treg, name := splitRepository(img.Repository)\n\t\t\tshort := name\n\t\t\tif i := strings.LastIndex(short, \"/\"); i >= 0 {\n\t\t\t\tshort = short[i+1:]\n\t\t\t}\n\t\t\tr = &ImageRepo{\n\t\t\t\tRepository: img.Repository, Registry: reg, Image: name,\n\t\t\t\tName: short, Private: reg != \"\", Age: img.Age,\n\t\t\t\tTags: []ImageTag{}, Prefixes: []string{},\n\t\t\t}\n\t\t\tbyRepo[img.Repository] = r\n\t\t\torder = append(order, img.Repository)\n\t\t}\n\t\tprefix, version, isVersion := classifyTag(img.Tag)\n\t\tr.Tags = append(r.Tags, ImageTag{\n\t\t\tTag: img.Tag, Prefix: prefix, Version: version, IsVersion: isVersion,\n\t\t\tID: img.ID, Size: img.Size, Age: img.Age, CreatedAt: img.CreatedAt,\n\t\t})\n\t}\n\n\tout := make([]ImageRepo, 0, len(order))\n\tfor _, name := range order {\n\t\tr := byRepo[name]\n…","approx":false},"splitRepository()":{"sig":"func splitRepository(repo string) (registry, image string) {","code":"// splitRepository separates the registry host from the image name.\n//\n// The first segment is a registry only when it looks like a host: it has a\n// dot or a port, or it is localhost. That is the same rule docker itself\n// uses, and it is why moby/buildkit is an image on Docker Hub while\n// harbor.tech/mm/app is an image on a private registry.\nfunc splitRepository(repo string) (registry, image string) {\n\tparts := strings.SplitN(repo, \"/\", 2)\n\tif len(parts) == 2 && (strings.ContainsAny(parts[0], \".:\") || parts[0] == \"localhost\") {\n\t\treturn parts[0], parts[1]\n\t}\n\treturn \"\", repo\n}","approx":false},"classifyTag()":{"sig":"func classifyTag(tag string) (prefix, version string, isVersion bool) {","code":"// classifyTag decides whether a tag names a release, and splits off the\n// environment prefix if it has one. A release has to contain a digit:\n// latest, cache, stable and local do not.\nfunc classifyTag(tag string) (prefix, version string, isVersion bool) {\n\tm := tagPattern.FindStringSubmatch(tag)\n\tif m == nil {\n\t\treturn \"\", tag, false\n\t}\n\tprefix, version = m[1], m[2]\n\tif version == \"\" {\n\t\tprefix, version = \"\", tag\n\t}\n\tif !strings.ContainsAny(version, \"0123456789\") {\n\t\treturn \"\", tag, false\n\t}\n\treturn prefix, version, true\n}","approx":false},"api.listImages()":{"sig":"func (a *api) listImages(w http.ResponseWriter, r *http.Request) {","code":"// listImages reports the repositories already on this machine, so work that\n// predates DIMA can be pulled in instead of retyped.\nfunc (a *api) listImages(w http.ResponseWriter, r *http.Request) {\n\timages, err := a.store.LocalImages()\n\tif err != nil {\n\t\tfail(w, http.StatusInternalServerError, err.Error())\n\t\treturn\n\t}\n\trepos := GroupImages(images)\n\n\t// Mark what is already covered, so the screen can grey those out rather\n\t// than let the same repository be imported twice.\n\tknown := map[string]bool{}\n\tfor _, p := range a.store.Config().Projects {\n\t\tfor _, e := range p.Envs {\n\t\t\tknown[strings.ToLower(p.Effective(e).Repo())] = true\n\t\t}\n\t}\n\ttype row struct {\n\t\tImageRepo\n\t\tKnown bool `json:\"known\"`\n\t}\n\tout := make([]row, 0, len(repos))\n\tfor _, rp := range repos {\n\t\tout = append(out, row{ImageRepo: rp, Known: known[strings.ToLower(rp.Repository)]})\n\t}\n\twriteJSON(w, http.StatusOK, map[string]any{\"repos\": out})\n}","approx":false},"draw()":{"sig":"const draw = () => {","code":"const draw = () => {\n  const list = visible();\n  $('#count', m).textContent = list.length;\n  if (!list.length){\n    $('#repos', m).innerHTML = `<div class=\"kv-empty\">Không có image nào phù hợp. Tích “Hiện cả image tải về từ Docker Hub” để xem hết.</div>`;\n    return syncGo();\n  }\n  $('#repos', m).innerHTML = `<div class=\"builds\">` + list.map(r => {\n    const versions = r.tags.filter(t => t.isVersion);\n    const detail = versions.length\n      ? versions.slice(0, 3).map(t => t.tag).join(', ') + (versions.length > 3 ? ` +${versions.length-3}` : '')\n      : 'chưa có tag nào là phiên bản';\n    const origin = r.registry || 'Docker Hub';\n    return `<label class=\"hit${r.known ? ' dup' : ''}\">\n      <input type=\"checkbox\" data-repo=\"${esc(r.repository)}\" ${r.known ? 'disabled' : (r.private ? 'checked' : '')}>\n      <b class=\"hit-name\">${esc(r.name)}</b>\n      <span class=\"hit-path\" title=\"${esc(r.repository)}\">${esc(r.repository)}</span>\n      <span class=\"row-when\">${esc(detail)}</span>\n      <span class=\"badge ${r.known ? '' : (r.private ? 'pushed' : '')}\">${r.known ? 'đã có' : esc(origin)}</span>\n    </label>`;\n  }).join('') + `</div>`;\n  $$('#repos input', m).forEach(c => c.onchange = syncGo);\n  syncGo();\n};","approx":false},"api.importImages()":{"sig":"func (a *api) importImages(w http.ResponseWriter, r *http.Request) {","code":"// importImages turns chosen repositories into projects, and records the\n// tags they already carry as history entries — without those the imported\n// project would claim to have no versions while the images sit right there\n// on the machine.\nfunc (a *api) importImages(w http.ResponseWriter, r *http.Request) {\n\tvar req struct {\n\t\tGroup        string   `json:\"group\"`\n\t\tRepositories []string `json:\ d};\n    render();\n    projectDialog(added);\n  } catch (e) { toast(e.message, true); }\n};","approx":false},"addEnv()":{"sig":"async function addEnv(projectId){","code":"/* ---------- create ---------- */\nasync function addEnv(projectId){\n  const c = cloneConfig();\n  const proj = c.projects.find(p => p.id === projectId);\n  if (!proj) return;\n  proj.envs = proj.envs || [];\n  proj.envs.push({id:'', name:'Môi trường '+(proj.envs.length+1), tagPrefix:'', buildArgs:[], labels:[]});\n  try {\n    const saved = await saveConfig(c);\n    const fresh = saved.projects.find(p => p.id === projectId);\n    const added = fresh.envs[fresh.envs.length-1];\n    state.sel = {kind:'env', id:added.id};\n    render();\n    envDialog(fresh, added);\n  } catch (e) { toast(e.message, true); }\n}","approx":false},"versionsDialog()":{"sig":"async function versionsDialog(){","code":"/* ---------- config snapshots ---------- */\nasync function versionsDialog(){\n  let snaps = [];\n  try { snaps = await api('/api/config/versions'); } catch (e) { return toast(e.message, true); }\n  const m = openModal(`\n    <h2>Bản lưu của config.json</h2>\n    <p class=\"sub\">Mỗi lần lưu cài đặt, bản cũ được giữ lại ở đây.</p>\n    <div id=\"snaps\">${\n      snaps.length\n        ? snaps.map(s => `<div class=\"snap\">\n            <time>${fmt(s.savedAt)}</time>\n            <span class=\"sz\">${s.size} B</span>\n            <button class=\"btn sm\" data-view=\"${esc(s.file)}\">Xem nội dung</button>\n            <button class=\"btn sm\" data-restore=\"${esc(s.file)}\">Khôi phục</button>\n          </div>`).join('')\n        : `<div class=\"kv-empty\">Chưa có bản lưu nào. Bản đầu tiên xuất hiện sau lần lưu cài đặt kế tiếp.</div>`\n    }</div>\n    <div class=\"modal-foot\"><button class=\"btn\" id=\"cancel\">Đóng</button></div>`);\n  $('#cancel', m).onclick = closeModal;\n\n  $$('[data-view]', m).forEach(el => el.onclick = async () => {\n    const raw = await fetch('/api/config/versions/'+encodeURIComponent(el.dataset.view)).then(r => r.text());\n    const v = openModal(`<h2>${esc(el.dataset.view)}</h2>\n      <pre class=\"log\" style=\"max-height:420px\">${esc(raw)}</pre>\n      <div class=\"modal-foot\"><button class=\"btn\" id=\"back\">Đóng</button></div>`, true);\n    $('#back', v).onclick = closeModal;\n  });\n\n  $$('[data-restore]', m).forEach(el => el.onclick = async () => {\n    if (!confirm('Khôi phục cài đặt từ bản lưu này? Cấu hình hiện tại sẽ được lưu lại trước.')) return;\n    try {\n…","approx":false},"api.listVersions()":{"sig":"func (a *api) listVersions(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) listVersions(w http.ResponseWriter, r *http.Request) {\n\twriteJSON(w, http.StatusOK, a.store.Snapshots())\n}","approx":false},"Store.Snapshots()":{"sig":"func (s *Store) Snapshots() []Snapshot {","code":"func (s *Store) Snapshots() []Snapshot {\n\tentries, _ := os.ReadDir(filepath.Join(s.root, \"versions\"))\n\tout := []Snapshot{}\n\tfor _, e := range entries {\n\t\t// Only config snapshots are restorable; the folder also holds the\n\t\t// history backup taken during a schema migration.\n\t\tif e.IsDir() || !strings.HasPrefix(e.Name(), \"config-\") || !strings.HasSuffix(e.Name(), \".json\") {\n\t\t\tcontinue\n\t\t}\n\t\tinfo, err := e.Info()\n\t\tif err != nil {\n\t\t\tcontinue\n\t\t}\n\t\tout = append(out, Snapshot{File: e.Name(), SavedAt: info.ModTime(), Size: info.Size()})\n\t}\n\tsort.Slice(out, func(i, j int) bool { return out[i].SavedAt.After(out[j].SavedAt) })\n\treturn out\n}","approx":false},"api.readVersion()":{"sig":"func (a *api) readVersion(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) readVersion(w http.ResponseWriter, r *http.Request) {\n\traw, err := a.store.ReadSnapshot(r.PathValue(\"file\"))\n\tif err != nil {\n\t\tfail(w, http.StatusNotFound, \"không đọc được bản lưu\")\n\t\treturn\n\t}\n\tw.Header().Set(\"Content-Type\", \"application/json; charset=utf-8\")\n\t_, _ = w.Write(raw)\n}","approx": s identical afterwards.\nfunc liftCommon(p *Project) {\n\tif len(p.Envs) < 2 {\n\t\treturn\n\t}\n\tfields := []struct {\n\t\tproj func(*Project) *string\n\t\tenv  func(*Env) *string\n\t}{\n\t\t{func(p *Project) *string { return &p.Registry }, func(e *Env) *string { return &e.Registry }},\n\t\t{func(p *Project) *string { return &p.Image }, func(e *Env) *string { return &e.Image }},\n\t\t{func(p *Project) *string { return &p.Context }, func(e *Env) *string { return &e.Context }},\n\t\t{func(p *Project) *string { return &p.Dockerfile }, func(e *Env) *string { return &e.Dockerfile }},\n\t\t{func(p *Project) *string { return &p.Platform }, func(e *Env) *string { return &e.Platform }},\n\t\t{func(p *Project) *string { return &p.Target }, func(e *Env) *string { return &e.Target }},\n\t\t{func(p *Project) *string { return &p.ExtraFlags }, func(e *Env) *string { return &e.ExtraFlags }},\n\t}\n\tfor _, f := range fields {\n\t\tfirst := *f.env(&p.Envs[0])\n\t\tif strings.TrimSpace(first) == \"\" {\n\t\t\tcontinue\n\t\t}\n\t\tsame := true\n\t\tfor i := range p.Envs {\n\t\t\tif *f.env(&p.Envs[i]) != first {\n\t\t\t\tsame = false\n\t\t\t\tbreak\n\t\t\t}\n\t\t}\n\t\tif !same {\n\t\t\tcontinue\n…","approx":false},"migrateHistory()":{"sig":"func (s *Store) migrateHistory() {","code":"// migrateHistory backfills the fields added in schema 2. Old records carry\n// a tag but no version; before projects existed there were no tag prefixes,\n// so the tag is the version.\nfunc (s *Store) migrateHistory() {\n\tchanged := false\n\tfor i := range s.builds {\n\t\tb := &s.builds[i]\n\t\tif b.Kind == \"\" {\n\t\t\tb.Kind = KindBuild\n\t\t\tchanged = true\n\t\t}\n\t\tif b.Version == \"\" && b.Tag != \"\" {\n\t\t\tb.Version = b.Tag\n\t\t\tchanged = true\n\t\t}\n\t\tif b.ProjectID == \"\" {\n\t\t\tif p, _, ok := s.config.FindEnv(b.EnvID); ok {\n\t\t\t\tb.ProjectID, b.ProjectName = p.ID, p.Name\n\t\t\t\tchanged = true\n\t\t\t}\n\t\t}\n\t}\n\tif !changed {\n\t\treturn\n\t}\n\tif old, err := os.ReadF .ID == envID {\n\t\t\t\treturn p, e, true\n\t\t\t}\n\t\t}\n\t}\n\treturn Project{}, Env{}, false\n}","approx":false},"Project.CanBuild()":{"sig":"func (p Project) CanBuild(envID string) bool {","code":"// CanBuild reports whether a build may start in this environment.\nfunc (p Project) CanBuild(envID string) bool {\n\tif p.ReleaseMode != ModePromote {\n\t\treturn true\n\t}\n\treturn p.BuildEnvID() == envID\n}","approx":false},"checkBuildable()":{"sig":"func checkBuildable(p Project, e Env) string {","code":"// checkBuildable reports why an environment could not be built, or \"\".\nfunc checkBuildable(p Project, e Env) string {\n\tenv := p.Effective(e)\n\tctx := strings.TrimSpace(env.Context)\n\tif ctx == \"\" {\n\t\treturn \"môi trường \" + e.Name + \" chưa chọn thư mục mã nguồn — mở Cài đặt dự án và bấm “Chọn thư mục”\"\n\t}\n\t// A relative path would resolve against wherever this process happens to\n\t// be running — the install folder, when opened from the Start Menu. It\n\t// is never what the person meant.\n\tif !filepath.IsAbs(ctx) {\n\t\treturn \"thư mục mã nguồn của \" + e.Name + \" đang là đường dẫn tương đối (\" + ctx +\n\t\t\t\"), phải là đường dẫn đầy đủ — bấm “Chọn thư mục” để chọn lại\"\n\t}\n\tst, err := os.Stat(ctx)\n\tif err != nil {\n\t\treturn \"không tìm thấy thư mục mã nguồn của \" + e.Name + \": \" + ctx\n\t}\n\tif !st.IsDir() {\n\t\treturn ctx + \" là một file, không phải thư mục\"\n\t}\n\twant := dockerfileOr(env.Dockerfile)\n\tif _, err := os.Stat(filepath.Join(ctx, want)); err != nil {\n\t\treturn \"không thấy \" + want + \" trong \" + ctx\n\t}\n\treturn \"\"\n}","approx":false},"checkVersion()":{"sig":"func checkVersion(v string) (string, string) {","code":"// checkVersion validates the project version a build or promote is given.\nfunc checkVersion(v string) (string, string) {\n\tv = strings.TrimSpace(v)\n\tif v == \"\" {\n\t\treturn \"\", \"chưa nhập version\"\n\t}\n\tif strings.ContainsAny(v, badTagChars) {\n\t\treturn \"\", \"version không được chứa khoảng trắng hoặc dấu : / \\\\\"\n\t}\n\treturn v, \"\"\n}","approx":false},"Store.Start()":{"sig":"func (s *Store) Start(p Project, target Env, version string, push bool) Build {","code":"// Start kicks off a build (and an optional push) in the background and\n// returns the new build record immediately. It always works with the\n// environment resolved against its project.\nfunc (s *Store) Start(p Project, target Env, version string, push bool) Build {\n\tenv := p.Effective(target)\n\tref := env.Ref(version)\n\targv := buildArgv(env, ref)\n\tdocker := s.Config().DockerBin\n\n\tb := Build{\n\t\tID:          newID(),\n\t\tProjectID:   p.ID,\n\t\tProjectName: p.Name,\n\t\tEnvID:       target.ID,\n\t\tEnvName:     target.Name,\n\t\tVersion:     version,\n\t\tTag:         env.Tag(version),\n\t\tRef:         ref,\n\t\tKind:        KindBuild,\n\t\tStatus:      \"running\",\n\t\tCommand:     docker + \" \" + strings.Join(argv, \" \"),\n\t\tStartedAt:   time.Now(),\n\t}\n\ts.addBuild(b)\n\ts.rememberVersion(target.ID, version)\n\n\tlb := s.logFor(b.ID)\n\tctx, cancel := context.WithCancel(context.Background())\n\ts.registerCancel(b.ID, cancel)\n\n\tgo func() {\n\t\tdefer cancel()\n\t\tdefer s.clearCancel(b.ID)\n…","approx":false},"Env.Ref()":{"sig":"func (e Env) Ref(version string) string {","code":"// Ref is the full image reference for a project version.\nfunc (e Env) Ref(version string) string {\n\treturn e.Repo() + \":\" + e.Tag(version)\n}","approx":false},"buildArgv()":{"sig":"func buildArgv(env Env, ref string) []string {","code":"// buildArgv assembles the docker command line for an environment.\nfunc buildArgv(env Env, ref string) []string {\n\targs := []string{\"build\", \"-t\", ref}\n\tif f := strings.TrimSpace(env.Dockerfile); f != \"\" {\n\t\targs = append(args, \"-f\", f)\n\t}\n\tfor _, kv := range env.BuildArgs {\n\t\tif strings.TrimSpace(kv.Key) == \"\" {\n\t\t\tcontinue\n\t\t}\n\t\targs = append(args, \"--build-arg\", kv.Key+\"=\"+kv.Value) r\n\t}\n\treturn cmd.Wait()\n}","approx":false},"docker push":{"sig":"if push {","code":"\treturn\n}\n\nif push {\n\tlb.writeString(\"\\n$ \" + docker + \" push \" + ref + \"\\n\\n\")\n\tif err := s.run(ctx, lb, env.Context, docker, \"push\", ref); err != nil {\n\t\tstatus := \"failed\"\n\t\tif ctx.Err() != nil {\n\t\t\tstatus = \"canceled\"","approx":true},"Store.digest()":{"sig":"func (s *Store) digest(workdir, docker, ref string) string {","code":"func (s *Store) digest(workdir, docker, ref string) string {\n\tcmd := exec.Command(docker, \"image\", \"inspect\", \"--format\", \"{{index .RepoDigests 0}}\", ref)\n\thideWindow(cmd)\n\tif wd := strings.TrimSpace(workdir); wd != \"\" && wd != \".\" {\n\t\tif info, err := os.Stat(wd); err == nil && info.IsDir() {\n\t\t\tcmd.Dir = wd\n\t\t}\n\t}\n\tout, err := cmd.Output()\n\tif err != nil {\n\t\treturn \"\"\n\t}\n\tline := strings.TrimSpace(string(out))\n\tif i := strings.Index(line, \"@\"); i >= 0 {\n\t\treturn line[i+1:]\n\t}\n\treturn \"\"\n}","approx":false},"Store.finish()":{"sig":"func (s *Store) finish(id, status, errMsg string) {","code":"func (s *Store) finish(id, status, errMsg string) {\n\ts.updateBuild(id, func(b *Build) {\n\t\tb.Status = status\n\t\tb.Err = errMsg\n\t\tb.FinishedAt = time.Now()\n\t})\n}","approx":false},"loadLog()":{"sig":"async function loadLog(id, offset=0){","code":"async function loadLog(id, offset=0){\n  if (!state.open.has(id)) return;\n  let data;\n  try { data = await api(`/api/build/${id}/log?offset=${offset}`); }\n  catch { return; }\n  const text = offset === 0\n    ? (data.chunk || '(chưa có output)')\n    : (state.logText.get(id) || '') + (data.chunk || '');\n  state.logText.set(id, text);\n\n  const pre = document.getElementById('log-'+id);\n  if (!pre) return;\n  const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;\n  pre.textContent = text;\n  if (atBottom) pre.scrollTop = pre.scrollHeight;\n\n  if (data.build.status === 'running'){\n    stopPoll(id);\n    state.pollers.set(id, setTimeout(() => loadLog(id, data.offset), 800));\n  } else {\n    stopPoll(id);\n    const known = state.builds.find(b => b.id === id);\n    if (known && known.status !== data.build.status) refresh();\n  }\n}","approx":false},"api.buildLog()":{"sig":"func (a *api) buildLog(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) buildLog(w http.ResponseWriter, r *http.Request) {\n\tid := r.PathValue(\"id\")\n\tb, ok := a.store.Build(id)\n\tif !ok {\n\t\tfail(w, http.StatusNotFound, \"không tìm thấy bản build\")\n\t\treturn\n\t}\n\toffset, _ := strconv.Atoi(r.URL.Query().Get(\"offset\"))\n\tchunk, next := a.store.LogSince(id, offset)\n\twriteJSON(w, http.StatusOK, map[string]any{\n\t\t\"build\": b, \"chunk\": chunk, \"offset\": next,\n\t})\n}","approx":false},"Store.LogSince()":{"sig":"func (s *Store) LogSince(id string, offset int) (string, int) {","code":"// LogSince returns new output past offset. It falls back to the on-disk log\n// for builds from an earlier session.\nfunc (s *Store) LogSince(id string, offset int) (string, int) {\n\ts.mu.RLock()\n\tlb, ok := s.logs[id]\n\ts.mu.RUnlock()\n\tif ok {\n\t\treturn lb.since(offset)\n\t}\n\traw, err := os.ReadFile(s.logPath(id))\n\tif err != nil {\n\t\treturn \"\", 0\n\t}\n\tif offset < 0 || offset > len(raw) {\n\t\toffset = 0\n\t}\n\treturn string(raw[offset:]), len(raw)\n}","approx":false},"logBuffer.since()":{"sig":"func (l *logBuffer) since(offset int) (string, int) {","code":"func (l *logBuffer) since(offset int) (string, int) {\n\tl.mu.Lock()\n\tdefer l.mu.Unlock()\n\tb := l.buf.Bytes()\n\tif offset < 0 || offset > len(b) {\n\t\toffset = 0\n\t}\n\treturn string(b[offset:]), len(b)\n}","approx":false},"nối vào <pre>":{"sig":"pre.textContent = text;","code":"const pre = document.getElementById('log-'+id);\nif (!pre) return;\nconst atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;\npre.textContent = text;\nif (atBottom) pre.scrollTop = pre.scrollHeight;\n\nif (data.build.status === 'running'){\n  stopPoll(id);\n  state.pollers.set(id, setTimeout(() => loadLog(id, data.offset), 800));","approx":true},"status !== running?":{"sig":"if (data.build.status === 'running'){","code":"pre.textContent = text;\nif (atBottom) pre.scrollTop = pre.scrollHeight;\n\nif (data.build.status === 'running'){\n  stopPoll(id);\n  state.pollers.set(id, setTimeout(() => loadLog(id, data.offset), 800));\n} else {\n  stopPoll(id);\n  const known = state.builds.find(b => b.id === id);","approx":true},"nút Push":{"sig":"$$('[data-push]', host).forEach(el => {","code":"$$('[data-copy]', host).forEach(el => {\n  el.onclick = ev => { ev.stopPropagation(); copy(el.dataset.copy, 'Đã chép'); };\n});\n$$('[data-push]', host).forEach(el => {\n  el.onclick = async ev => {\n    ev.stopPropagation();\n    el.disabled = true; el.textContent = 'Đang push…';\n    try { await api(`/api/build/${el.dataset.push}/push`, {method:'POST'}); toast('Đã push'); await refresh(); }\n    catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Push'; }","approx":true},"api.pushBuild()":{"sig":"func (a *api) pushBuild(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) pushBuild(w http.ResponseWriter, r *http.Request) {\n\tb, ok := a.store.Build(r.PathValue(\"id\"))\n\tif !ok {\n\t\tfail(w, http.StatusNotFound, \"không tìm thấy bản build\")\n\t\treturn\n\t}\n\tworkdir := \"\"\n\tif p, e, found := a.store.Config().FindEnv(b.EnvID); found {\n\t\tworkdir = p.Effective(e).Context\n\t}\n\tif err := a.store.PushExisting(b, workdir); err != nil {\n\t\tfail(w, http.StatusInternalServerError, err.Error())\n\t\treturn\n\t}\n\tupdated, _ := a.store.Build(b.ID)\n\twriteJSON(w, http.StatusOK, updated)\n}","approx":false},"Store.Build()":{"sig":"func (s *Store) Build(id string) (Build, bool) {","code":"func (s *Store) Build(id string) (Build, bool) {\n\ts.mu.RLock()\n\tdefer s.mu.RUnlock()\n\tfor _, b := range s.builds {\n\t\tif b.ID == id {\n\t\t\treturn b, true\n\t\t}\n\t}\n\treturn Build{}, false\n}","approx":false},"PushExisting()":{"sig":"func (s *Store) PushExisting(b Build, workdir string) error {","code":"// PushExisting pushes an image that was built earlier without pushing.\nfunc (s *Store) PushExisting(b Build, workdir string) error {\n\tdocker := s.Config().DockerBin\n\tlb := s.logFor(b.ID)\n\tlb.writeString(\"\\n$ \" + docker + \" push \" + b.Ref + \"\\n\\n\")\n\tif err := s.run(context.Background(), lb, workdir, docker, \"push\", b.Ref); err != nil {\n\t\tlb.writeString(\"\\n\" + err.Error() + \"\\n\")\n\t\treturn err\n\t}\n\ts.updateBuild(b.ID, func(x *Build) {\n\t\tx.Pushed = true\n\t\tif x.Status == \"failed\" {\n\t\t\treturn\n\t\t}\n\t\tx.Status = \"success\"\n\t})\n\tif d := s.digest(workdir, docker, b.Ref); d != \"\" {\n\t\ts.updateBuild(b.ID, func(x *Build) { x.Digest = d })\n\t}\n\treturn nil\n}","approx":false},"Store.updateBuild()":{"sig":"func (s *Store) updateBuild(id string, fn func(*Build)) {","code":"func (s *Store) updateBuild(id string, fn func(*Build)) {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\tfor i := range s.builds {\n\t\tif s.builds[i].ID == id {\n\t\t\tfn(&s.builds[i])\n\t\t\ts.persistHistoryLocked()\n\t\t\treturn\n\t\t}\n\t}\n}","approx":false},"promoteDialog()":{"sig":"function promoteDialog(p, src, target, version){","code":"/* ---------- promote dialog ---------- */\nfunction promoteDialog(p, src, target, version){\n  const targets = (p.envs || []).filter(e => e.id !== src.envId);\n  if (!targets.length) return toast('Dự án chưa có môi trường nào khác để đưa sang', true);\n  const initial = target && target.id !== src.envId ? target.id : targets[0].id;\n\n  const m = openModal(`\n    <h2>Đưa version ${esc(version || src.version)} sang môi trường khác</h2>\n    <p class=\"sub\">Không build lại. Image giữ nguyên digest, chỉ được gắn thêm tag mới.</p>\n    ${state.buildxOk ? '' : `<div class=\"warnbox\">Máy này không có <code>docker buildx</code>, nên image sẽ phải kéo về rồi đẩy lê \" \"+strings.Join(st, \" \"))\n\t}\n\n\tb := Build{\n\t\tID:            newID(),\n\t\tProjectID:     p.ID,\n\t\tProjectName:   p.Name,\n\t\tEnvID:         target.ID,\n\t\tEnvName:       target.Name,\n\t\tVersion:       version,\n\t\tTag:           env.Tag(version),\n\t\tRef:           ref,\n\t\tDigest:        src.Digest,\n\t\tKind:          KindPromote,\n\t\tSourceBuildID: src.ID,\n\t\tStatus:        \"running\",\n\t\tCommand:       strings.Join(lines, \" && \"),\n\t\tStartedAt:     time.Now(),\n\t}\n\ts.addBuild(b)\n\ts.rememberVersion(target.ID, version)\n…","approx":false},"repoOf()":{"sig":"func repoOf(ref string) string {","code":"// repoOf strips the tag or digest from an image reference, leaving the\n// repository. The colon of a registry port is not a tag separator, so only\n// a colon after the last slash counts.\nfunc repoOf(ref string) string {\n\tif i := strings.LastIndex(ref, \"@\"); i >= 0 {\n\t\tref = ref[:i]\n\t}\n\tslash := strings.LastIndex(ref, \"/\")\n\tif i := strings.LastIndex(ref, \":\"); i > slash {\n\t\treturn ref[:i]\n\t}\n\treturn ref\n}","approx":false},"buildxAvailable()":{"sig":"func (s *Store) buildxAvailable() bool {","code":"// buildxAvailable is checked once per run: the answer cannot change while\n// the app is open.\nfunc (s *Store) buildxAvailable() bool {\n\ts.buildxOnce.Do(func() {\n\t\tctx, cancel := context.WithTimeout(context.Background(), 6*time.Second)\n\t\tdefer cancel()\n\t\tcmd := exec.CommandContext(ctx, s.Config().DockerBin, \"buildx\", \"version\")\n\t\thideWindow(cmd)\n\t\ts.buildxOK = cmd.Run() == nil\n\t})\n\treturn s.buildxOK\n}","approx":false},"promoteSteps()":{"sig":"func promoteSteps(buildx bool, srcRef, dstRef string) [][]string {","code":"// image a second tag.\n//\n// buildx does it on the registry: nothing is transferred, the digest is\n// untouched and a multi-arch manifest survives. Without buildx the image\n// has to come down to this machine and go back up, which is slower and\n// flattens a multi-arch manifest to the local platform.\nfunc promoteSteps(buildx bool, srcRef, dstRef string) [][]string {\n\tif buildx {\n\t\treturn [][]string{{\"buildx\", \"imagetools\", \"create\", \"-t\", dstRef, srcRef}}\n\t}\n\treturn [][]string{\n\t\t{\"pull\", srcRef},\n\t\t{\"tag\", srcRef, dstRef},\n\t\t{\"push\", dstRef},\n\t}\n}","approx":false},"nút Dừng build":{"sig":"$$('[data-cancel]', host).forEach(el => {","code":"    catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Push'; }\n  };\n});\n$$('[data-cancel]', host).forEach(el => {\n  el.onclick = async ev => {\n    ev.stopPropagation();\n    try { await api(`/api/build/${el.dataset.cancel}/cancel`, {method:'POST'}); toast('Đã dừng'); }\n    catch (err) { toast(err.message, true); }\n  };","approx":true},"api.cancelBuild()":{"sig":"func (a *api) cancelBuild(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) cancelBuild(w http.ResponseWriter, r *http.Request) {\n\tif !a.store.Cancel(r.PathValue(\"id\")) {\n\t\tfail(w, http.StatusConflict, \"bản build này không còn chạy\")\n\t\treturn\n\t}\n\twriteJSON(w, http.StatusOK, map[string]string{\"status\": \"canceled\"})\n}","approx":false},"Store.Cancel()":{"sig":"func (s *Store) Cancel(id string) bool {","code":"func (s *Store) Cancel(id string) bool {\n\ts.mu.Lock()\n\tfn, ok := s.cancels[id]\n\ts.mu.Unlock()\n\tif ok && fn != nil {\n\t\tfn()\n\t}\n\treturn ok\n}","approx":false},"context cancel":{"sig":"func (s *Store) Start(p Project, target Env, version string, push bool) Build {","code":"// Start kicks off a build (and an optional push) in the background and\n// returns the new build record immediately. It always works with the\n// environment resolved against its project.\nfunc (s *Store) Start(p Project, target Env, version string, push bool) Build {\n\tenv := p.Effective(target)\n\tref := env.Ref(version)\n\targv := buildArgv(env, ref)\n\tdocker := s.Config().DockerBin\n","approx":true},"nút Xóa khỏi lịch sử":{"sig":"$$('[data
