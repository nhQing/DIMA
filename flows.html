ch sử? Image trên registry không bị đụng tới.')) return;\n    await api(`/api/build/${el.dataset.del}`, {method:'DELETE'});\n    state.open.delete(el.dataset.del); stopPoll(el.dataset.del);","approx":true},"api.deleteBuild()":{"sig":"func (a *api) deleteBuild(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) deleteBuild(w http.ResponseWriter, r *http.Request) {\n\ta.store.DeleteBuild(r.PathValue(\"id\"))\n\tw.WriteHeader(http.StatusNoContent)\n}","approx":false},"Store.DeleteBuild()":{"sig":"func (s *Store) DeleteBuild(id string) {","code":"func (s *Store) DeleteBuild(id string) {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\tkept := s.builds[:0]\n\tfor _, b := range s.builds {\n\t\tif b.ID != id {\n\t\t\tkept = append(kept, b)\n\t\t}\n\t}\n\ts.builds = kept\n\tdelete(s.logs, id)\n\ts.persistHistoryLocked()\n\t_ = os.Remove(s.logPath(id))\n}","approx":false},"persistHistoryLocked()":{"sig":"func (s *Store) persistHistoryLocked() {","code":"func (s *Store) persistHistoryLocked() {\n\traw, err := json.MarshalIndent(history{Builds: s.builds}, \"\", \"  \")\n\tif err != nil {\n\t\treturn\n\t}\n\t_ = writeFileAtomic(s.historyPath(), append(raw, '\\n'), 0o644)\n}","approx":false},"ask()":{"sig":"const ask = async () => {","code":"// The preview is the server's planBuild — the same function the build\n// runs — so what is shown here is what will run, character for character.\nconst ask = async () => {\n  const mine = ++seq;\n  let plan;\n  try {\n    // Same fallback as the Build button, so an emptied box previews the\n    // version that would actually be built.\n    plan = await api('/api/build/preview', {method:'POST', body:JSON.stringify({\n      envId: e.id, version: ver.value.trim() || start, push: pushChk(),\n      params: fields ? values() : undefined,\n    })});\n  } catch (err) {\n    if (mine === seq){ $('#cmd', m).textContent = err.message; go.disabled = true; }\n    return;\n  }\n  if (mine !== seq) return; // a newer keystroke already asked\n  lastPlan = plan;\n  if (!fields){\n    fields = plan.params || [];\n    drawParams();\n    // The first preview ran on the server's starting values; from here on\n    // the boxes on screen are the truth, so ask once more with them.\n    if (fields.length) schedule();\n  }\n  $('#cmd', m).textContent = (plan.steps || [plan.command]).join('\\n');\n  $('#refline', m).textContent = plan.ref;\n  const issues = [\n    ...(plan.blocked || []),\n    ...(plan.problems || []).map(x => 'chưa điền tham số bắt buộc: ' + x),\n  ];\n  $('#problems', m).innerHTML = issues.length\n…","approx":false},"POST /api/build/preview":{"sig":"plan = await api('/api/build/preview', {method:'POST', body:JSON.stringify({","code":"try {\n  // Same fallback as the Build button, so an emptied box previews the\n  // version that would actually be built.\n  plan = await api('/api/build/preview', {method:'POST', body:JSON.stringify({\n    envId: e.id, version: ver.value.trim() || start, push: pushChk(),\n    params: fields ? values() : undefined,\n  })});\n} catch (err) {\n  if (mine === seq){ $('#cmd', m).textContent = err.message; go.disabled = true; }","approx":true},"api.previewBuild()":{"sig":"func (a *api) previewBuild(w http.ResponseWriter, r *http.Request) {","code":"//\n// It goes through planBuild, the same function Start runs, so the preview\n// cannot show one command and the build run another. The dialog asks again\n// on every pause in typing. Nothing here runs docker or writes anything; the\n// only process it may start is git, for the labels, and that answer is\n// cached for a few seconds (ReadGitCached).\nfunc (a *api) previewBuild(w http.ResponseWriter, r *http.Request) {\n\tvar req buildRequest\n\tif err := json.NewDecoder(r.Body).Decode(&req); err != nil {\n\t\tfail(w, http.StatusBadRequest, \"JSON không hợp lệ\")\n\t\treturn\n\t}\n\tcfg := a.store.Config()\n\tproject, env, found := cfg.FindEnv(req.EnvID)\n\tif !found {\n\t\tfail(w, http.StatusNotFound, \"không tìm thấy môi trường\")\n\t\treturn\n\t}\n\tversion := strings.TrimSpace(req.Version)\n\tif version == \"\" {\n\t\tversion = env.LastVersion\n\t}\n\tblocked := []string{}\n\tif _, msg := checkVersion(version); msg != \"\" {\n\t\tblocked = append(blocked, msg)\n\t}\n\tplan := planBuild(cfg.DockerBin, project, env, version, req.Params, ReadGitCached(project.Effective(env).Context, 5*time.Second))\n\tif msg := CheckBuildCommand(plan.Custom); msg != \"\" {\n\t\tblocked = append(blocked, msg)\n\t}\n\tsteps := []string{plan.Command}\n\tif req.Push && !plan.Env.IsOnlyLocal {\n\t\tsteps = append(steps, cfg.DockerBin+\" push \"+plan.Ref)\n\t}\n\tconfirmWhy := confirmReason(project, env)\n\twriteJSON(w, http.StatusOK, map[string]any{\n…","approx":false},"commandParams()":{"sig":"func commandParams(command string) []string {","code":"// commandParams lists the user's own placeholders in a command, in the order\n// they first appear, each once.\nfunc commandParams(command string) []string {\n\tout := []string{}\n\tseen := map[string]bool{}\n\tfor _, m := range placeholderRe.FindAllStringSubmatch(command, -1) {\n\t\tname := m[1]\n\t\tif isBuiltinVar(name) || seen[name] {\n\t\t\tcontinue\n\t\t}\n\t\tseen[name] = true\n\t\tout = append(out, name)\n\t}\n\treturn out\n}","approx":false},"paramFields()":{"sig":"func paramFields(env Env, given map[string]string) []ParamField {","code":"// paramFields lists every parameter an effective environment's command asks\n// for, each with the value the dialog should show. Given values win, then\n// the value used in this environment's last build, then the default.\n//\n// A flag's value is \"true\" or \"false\" here — the state of the checkbox —\n// and only becomes Options when the command is expanded.\nfunc paramFields(env Env, given map[string]string) []ParamField {\n\tdefs := map[string]Param{}\n\tfor _, p := range env.Params {\n\t\tdefs[p.Name] = p\n\t}\n\tout := []ParamField{}\n\tfor _, name := range commandParams(env.BuildCommand) {\n\t\tdef, ok := defs[name]\n\t\tif !ok {\n\t\t\tdef = Param{Name: name}\n\t\t}\n\t\tif def.Kind == \"\" {\n\t\t\tdef.Kind = ParamText\n\t\t}\n\t\tvalue, ok := given[name]\n\t\tif !ok {\n\t\t\tvalue, ok = env.LastParams[name]\n\t\t}\n\t\tif !ok {\n\t\t\tvalue = def.Default\n\t\t}\n\t\tif def.Kind == ParamFlag {\n\t\t\tvalue = flagState(value)\n\t\t}\n\t\tout = append(out, ParamField{Param: def, Value: value})\n\t}\n\treturn out\n}","approx":false},"paramValues()":{"sig":"func paramValues(fields []ParamField) (map[string]string, []string) {","code":"// paramValues turns the dialog's rows into what each placeholder expands\n// to, and lists the required ones left empty or holding a value the\n// dropdown never offered.\nfunc paramValues(fields []ParamField) (map[string]string, []string) {\n\tvalues := map[string]string{}\n\tproblems := []string{}\n\tfor _, f := range fields {\n\t\tv := strings.TrimSpace(f.Value)\n\t\tswitch f.Kind {\n\t\tcase ParamFlag:\n\t\t\tv = \"\"\n\t\t\tif flagState(f.Value) == \"true\" {\n\t\t\t\tv = strings.TrimSpace(f.Options)\n\t\t\t}\n\t\tcase ParamChoice:\n\t\t\tif v != \"\" && !slices.Contains(splitOptions(f.Options), v) {\n\t\t\t\tproblems = append(problems, f.Name+\" (giá trị “\"+v+\"” không có trong danh sách chọn)\")\n\t\t\t\tcontinue\n\t\t\t}\n\t\t}\n\t\tif f.Required && f.Kind != ParamFlag && v == \"\" {\n\t\t\tproblems = append(problems, f.Name)\n\t\t}\n\t\tvalues[f.Name] = v\n\t}\n\treturn values, problems\n}","approx":false},"buildVarValues()":{"sig":"func buildVarValues(p Project, target Env, env Env, version, ref string, labels []KV) map[string]string {","code":"// buildVarValues collects what each placeholder stands for, for one build.\n// labels are every label the image should carry, DIMA's own first.\nfunc buildVarValues(p Project, target Env, env Env, version, ref string, labels []KV) map[string]string {\n\tflags := make([]string, 0, len(labels))\n\tfor _, kv := range labels {\n\t\tflags = append(flags, \"--label \"+shellQuote(kv.Key+\"=\"+kv.Value))\n\t}\n\treturn map[string]string{\n\t\t\"labels\":     strings.Join(flags, \" \"),\n\t\t\"tag\":        env.Tag(version),\n\t\t\"ref\":        ref,\n\t\t\"repo\":       env.Repo(),\n\t\t\"registry\":   strings.TrimSpace(env.Registry),\n\t\t\"image\":      strings.TrimSpace(env.Image),\n\t\t\"env\":        target.Name,\n\t\t\"project\":    p.Name,\n\t\t\"context\":    strings.TrimSpace(env.Context),\n\t\t\"dockerfile\": dockerfileOr(env.Dockerfile),\n\t\t\"envfile\":    envFileOr(env.EnvFile),\n\t}\n}","approx":false},"expandVars()":{"sig":"func expandVars(template string, values map[string]string) string {","code":"// One pass, not one ReplaceAll per name: a substituted value is never read\n// again. Otherwise a branch named fix{ref} inside {labels}, or a parameter\n// typed as {tag}, would be expanded a second time — and a quote inside a\n// later value could break out of the quoting {labels} put around an earlier\n// one. Unknown placeholders are left exactly as written: silently blanking\n// them would turn a typo into a command that runs and does the wrong thing.\nfunc expandVars(template string, values map[string]string) string {\n\treturn placeholderRe.ReplaceAllStringFunc(template, func(m string) string {\n\t\tif v, ok := values[m[1:len(m)-1]]; ok {\n\t\t\treturn v\n\t\t}\n\t\treturn m\n\t})\n}","approx":false},"drawParams()":{"sig":"const drawParams = () => {","code":"const drawParams = () => {\n  const host = $('#params', m);\n  if (!fields || !fields.length){ host.innerHTML = ''; return; }\n  host.innerHTML = `<div class=\"field-name\" style=\"margin-top:16px\">Tham số</div>\n    <table class=\"ptable\"><tbody>${fields.map(f => `<tr>\n      <th title=\"${esc(f.about || '')}\"><code>{${esc(f.name)}}</code>${f.required ? '<span class=\"req\" title=\"bắt buộc\">*</span>' : ''}\n        ${f.about ? `<div class=\"pabout\">${esc(f.about)}</div>` : ''}</th>\n      <td>${paramInputHTML(f)}</td>\n    </tr>`).join('')}</tbody></table>`;\n  $$('[data-pv]', host).forEach(el => { el.oninput = schedule; el.onchange = schedule; });\n};\n\n// The preview is the server's planBuild — the same function the build\n// runs — so what is shown here is what will run, character for character.\nconst ask = async () => {\n  const mine = ++seq;\n  let plan;\n  try {\n    // Same fallback as the Build button, so an emptied box previews the\n    // version that would actually be built.\n    plan = await api('/api/build/preview', {method:'POST', body:JSON.stringify({\n      envId: e.id, version: ver.value.trim() || start, push: pushChk(),\n      params: fields ? values() : undefined,\n    })});\n  } catch (err) {\n    if (mine === seq){ $('#cmd', m).textContent = err.message; go.disabled = true; }\n    return;\n  }\n  if (mine !== seq) return; // a newer keystroke already asked\n  lastPlan = plan;\n…","approx":false},"syncGo()":{"sig":"function syncGo(){","code":"function syncGo(){\n  const unconfirmed = lastPlan && lastPlan.needsConfirm && !($('#confirm', m) || {}).checked;\n  go.disabled = issuesNow.length > 0 || !!unconfirmed;\n}","approx":false},"mountVarHelp()":{"sig":"async function mountVarHelp(input, host, inheritedCmd){","code":"// mountVarHelp shows the placeholders under the command box, and previews\n// the command as it will actually be run.\nasync function mountVarHelp(input, host, inheritedCmd){\n  if (!host) return;\n  const vars = await buildVars();\n  const chips = vars.map(v =>\n    `<button type=\"button\" class=\"chip\" data-var=\"${esc(v.name)}\" title=\"${esc(v.about)}\">{${esc(v.name)}}</button>`).join('');\n\n  const draw = () => {\n    const cmd = input.value.trim();\n    if (!cmd){\n      host.innerHTML = inheritedCmd\n        ? `<div class=\"varnote\">Để trống thì dùng lệnh của dự án.</div>`\n        : `<div class=\"varnote\">Để trống thì DIMA chạy <code>docker build</code> như bình thường.</div>`;\n      return;\n    }\n    // {version} đã bỏ. Lệnh cũ còn dùng nó sẽ bị từ chối lúc build, nên nói\n    // ra ngay tại ô đang gõ thay vì để người dùng gặp lỗi sau.\n    const stale = cmd.includes('{version}')\n      ? `<div class=\"warnbox\">Biến <code>{version}</code> đã bỏ: nó không kèm tiền tố tag, nên lệnh\n          sẽ gắn tag khác với tag DIMA đi tìm lúc push. Đổi thành <code>{tag}</code> (chỉ phần tag)\n          hoặc <code>{ref}</code> (tên image đầy đủ). DIMA sẽ không chạy lệnh còn biến này.</div>`\n      : '';\n    host.innerHTML = `\n      <div class=\"varnote\">Chạy trong thư mục mã nguồn. Lệnh phải gắn tag image thành <code>{ref}</code>,\n        nếu không thì push và promote sẽ không dùng được.</div>\n      ${stale}\n      <div class=\"suggest\">${chips}</div>`;\n    $$('[data-var]', host).forEach(b => b.onclick = () => {\n      const at = input.selectionStart ?? input.value.length;\n      input.value = input.value.slice(0, at) + '{' + b.dataset.var + '}' + input.value.slice(at);\n      input.focus();\n…","approx":false},"commandParamsOf()":{"sig":"async function commandParamsOf(cmd){","code":"// commandParamsOf mirrors commandParams in command.go.\nasync function commandParamsOf(cmd){\n  const builtin = new Set((await buildVars()).map(v => v.name).concat(['version']));\n  const out = [];\n  for (const m of String(cmd || '').matchAll(/\\{([A-Za-z][A-Za-z0-9_-]*)\\}/g)){\n    if (!builtin.has(m[1]) && !out.includes(m[1])) out.push(m[1]);\n  }\n  return out;\n}","approx":false},"mountParamDefs()":{"sig":"function mountParamDefs(host, cmdInput, rows, cmdOf, inherited){","code":"// mountParamDefs keeps `rows` (the level's own Param rows, edited in place)\n// in step with the placeholders of the command being typed. `cmdOf` gives\n// the command in effect; `inherited` is the project's rows when editing an\n// environment, whose own rows then only override.\nfunction mountParamDefs(host, cmdInput, rows, cmdOf, inherited){\n  let names = [];\n  const own = name => rows.find(r => r.name === name);\n  const inh = name => (inherited || []).find(r => r.name === name);\n\n  const optsHint = k => k === 'choice' ? 'a, b, c' : k === 'flag' ? 'chữ chèn vào khi tick, vd -NoCache' : '';\n  const defaultCell = (r, dis) => r.kind === 'flag'\n    ? `<select data-k=\"default\" ${dis}><option value=\"false\">không tick</option>\n        <option value=\"true\" ${r.default === 'true' ? 'selected' : ''}>tick sẵn</option></select>`\n    : `<input type=\"text\" data-k=\"default\" value=\"${esc(r.default || '')}\" placeholder=\"để trống\" ${dis}>`;\n\n  const draw = () => {\n    if (!names.length){\n      host.innerHTML = cmdOf()\n        ? `<div class=\"varnote\" style=\"margin:-6px 0 16px\">Lệnh chưa có tham số nào của riêng bạn. Gõ thêm <code>{tên}</code>\n            — ví dụ <code>-Cache {cache}</code> — để build hỏi nó trong một bảng.</div>`\n        : '';\n      return;\n    }\n    host.innerHTML = `<div class=\"field-name\">Tham số của lệnh — hộp thoại Build sẽ hỏi từng cái</div>\n      <div style=\"overflow-x:auto\"><table class=\"pdef\"><thead><tr>\n        ${inherited ? '<th title=\"Khai riêng cho môi trường này, thay cho dòng của dự án\">Riêng</th>' : ''}\n        <th>Tham số</th><th>Kiểu</th><th>Mặc định</th><th>Lựa chọn</th><th title=\"Không cho build khi còn trống\">Bắt buộc</th><th>Ghi chú</th>\n      </tr></thead><tbody>${names.map(name => {\n        const mine = own(name);\n        const r = mine || inh(name) || {name, kind:'text'};\n        const dis = inherited && !mine ? 'disabled' : '';\n        const kind = r.kind || 'text';\n        return `<tr data-row=\"${esc(name)}\" class=\"${dis ? 'inherited' : ''}\">\n          ${inherited ? `<td><input type=\"checkbox\" data-own ${mine ? 'checked' : ''}></td>` : ''}\n…","approx":false},"PUT /api/config":{"sig":"const saved = await api('/api/config', {method:'PUT', body:JSON.stringify(next)});","code":"}\n\nasync function saveConfig(next, okMsg){\n  const saved = await api('/api/config', {method:'PUT', body:JSON.stringify(next)});\n  state.config = saved;\n  if (okMsg) toast(okMsg);\n  await refresh();\n  return saved;\n}","approx":true},"CheckParams()":{"sig":"func CheckParams(params []Param) string {","code":"// CheckParams reports why a list of parameter rows cannot be saved, or \"\".\nfunc CheckParams(params []Param) string {\n\tfor _, p := range params {\n\t\tname := strings.TrimSpace(p.Name)\n\t\tif name == \"\" {\n\t\t\tcontinue\n\t\t}\n\t\tif !placeholderRe.MatchString(\"{\" + name + \"}\") {\n\t\t\treturn \"tên tham số “\" + name + \"” chỉ được gồm chữ, số, - và _, và phải bắt đầu bằng chữ\"\n\t\t}\n\t\tif isBuiltinVar(name) {\n\t\t\treturn \"tên tham số “\" + name + \"” trùng với biến DIMA tự điền — đặt tên khác\"\n\t\t}\n\t\tswitch p.Kind {\n\t\tcase \"\", ParamText, ParamChoice, ParamFlag:\n\t\tdefault:\n\t\t\treturn \"tham số “\" + name + \"” có kiểu không hợp lệ: \" + p.Kind\n\t\t}\n\t\tif p.Kind == ParamChoice && len(splitOptions(p.Options)) == 0 {\n\t\t\treturn \"tham số “\" + name + \"” là danh sách chọn nhưng chưa có lựa chọn nào\"\n\t\t}\n\t}\n\treturn \"\"\n}","approx":false},"Store.saveConfigLocked()":{"sig":"func (s *Store) saveConfigLocked(c Config) error {","code":"// saveConfigLocked snapshots, normalises and writes in one turn of the lock.\n// It is separate from SaveConfig so a caller that already edited s.config\n// under the lock can save without releasing it: a save built from a snapshot\n// taken before an unlock silently undoes whatever was written during the gap.\nfunc (s *Store) saveConfigLocked(c Config) error {\n\ts.snapshotConfigLocked()\n\treturn s.writeConfigLocked(c)\n}","approx":false},"registryDialog()":{"sig":"async function registryDialog(p){","code":"async function registryDialog(p){\n  const m = openModal(`\n    <h2>Đọc từ registry</h2>\n    <p class=\"sub\">Các tag đang có trên registry của ${esc(p.name)}, xếp vào môi trường theo tiền tố tag.\n      Dùng thông tin <code>docker login</code> đã lưu trên máy này.</p>\n    <div id=\"reg\"><div class=\"kv-empty\">Đang đọc registry…</div></div>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" id=\"cancel\">Đóng</button>\n      <button class=\"btn primary\" id=\"go\" disabled>Ghi vào lịch sử</button>\n    </div>`, true);\n  $('#cancel', m).onclick = closeModal;\n\n  let res;\n  try { res = await api('/api/registry/tags?projectId=' + encodeURIComponent(p.id)); }\n  catch (err) { $('#reg', m).innerHTML = `<div class=\"warnbox\">${esc(err.message)}</div>`; return; }\n\n  const repos = res.repos || [];\n  if (!repos.length){\n    $('#reg', m).innerHTML = `<div class=\"kv-empty\">Dự án không có môi trường nào đẩy lên registry.</div>`;\n    return;\n  }\n  $('#reg', m).innerHTML = repos.map(r => {\n    if (r.error) return `<div class=\"section-label\" style=\"margin:6px 0 8px\">${esc(r.repo)}</div>\n      <div class=\"warnbox\">${esc(r.error)}</div>`;\n    const fresh = r.rows.filter(x => !x.known).length;\n    const rows = r.rows.map(x => `<label class=\"hit${x.known ? ' dup' : ''}\">\n        <input type=\"checkbox\" data-key=\"${esc(x.envId + '|' + x.tag)}\" ${x.known ? 'disabled' : 'checked'}>\n        <b class=\"hit-name\">${esc(x.tag)}</b>\n        <span class=\"row-when\">${esc(x.envName)} · ${esc(fmt(x.pushedAt))}</span>\n        <span class=\"hit-path\" title=\"${esc(x.digest)}\">${esc(shortDigest(x.digest) || 'không rõ digest')}</span>\n…","approx":false},"api.registryTags()":{"sig":"func (a *api) registryTags(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) registryTags(w http.ResponseWriter, r *http.Request) {\n\tp, ok := a.store.Config().FindProject(r.URL.Query().Get(\"projectId\"))\n\tif !ok {\n\t\tfail(w, http.StatusNotFound, \"không tìm thấy dự án\")\n\t\treturn\n\t}\n\twriteJSON(w, http.StatusOK, map[string]any{\"repos\": a.readRegistry(p)})\n}","approx":false},"api.readRegistry()":{"sig":"func (a *api) readRegistry(p Project) []registryRepo {","code":"// readRegistry lists, per repository a project pushes to, the tags found on\n// the registry and the environment each belongs to. One repository failing\n// — no login, a typo in the image name — does not hide the others.\nfunc (a *api) readRegistry(p Project) []registryRepo {\n\thistory := a.store.Builds()\n\tout := []registryRepo{}\n\tfor _, repo := range projectRepos(p) {\n\t\tr := registryRepo{Repo: repo, Rows: []RegistryRow{}, Unmatched: []RemoteTag{}}\n\t\ttags, err := a.reg().ListTags(repo)\n\t\tif err != nil {\n\t\t\tr.Error = err.Error()\n\t\t} else {\n\t\t\tr.Rows, r.Unmatched = matchTags(p, repo, tags, history)\n\t\t}\n\t\tout = append(out, r)\n\t}\n\treturn out\n}","approx":false},"registryClient.ListTags()":{"sig":"func (c *registryClient) ListTags(repo string) ([]RemoteTag, error) {","code":"// ListTags reads every tag of one repository, e.g. harbor.tech/mmt/admin.\nfunc (c *registryClient) ListTags(repo string) ([]RemoteTag, error) {\n\thost, name := splitRepository(repo)\n\tif host == \"\" {\n\t\treturn nil, fmt.Errorf(\"%s không có registry riêng — DIMA chỉ đọc registry của bạn, không đọc Docker Hub\", repo)\n\t}\n\ttags, err := c.harborTags(host, name)\n\tif err == errNotHarbor {\n\t\ttags, err = c.harborV1Tags(host, name)\n\t}\n\tif err == errNotHarbor {\n\t\ttags, err = c.genericTags(host, name)\n\t}\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\t// Stable: tags without a push time keep the order the lister gave them.\n\tsort.SliceStable(tags, func(i, j int) bool { return tags[i].PushedAt.After(tags[j].PushedAt) })\n\treturn tags, nil\n}","approx":false},"dockerCredentials()":{"sig":"func dockerCredentials(host string) (string, string, error) {","code":"// dockerCredentials finds the login `docker login <host>` stored, with the\n// same precedence the docker CLI uses: a per-registry helper, then an inline\n// auth entry, then the default credential store.\nfunc dockerCredentials(host string) (string, string, error) {\n\traw, err := os.ReadFile(dockerConfigPath())\n\tif err != nil {\n\t\treturn \"\", \"\", nil // no docker config: anonymous\n\t}\n\tvar cfg dockerConfigFile\n\tif err := json.Unmarshal(bytes.TrimPrefix(raw, []byte(\"\\xef\\xbb\\xbf\")), &cfg); err != nil {\n\t\treturn \"\", \"\", fmt.Errorf(\"không đọc được %s: %w\", dockerConfigPath(), err)\n\t}\n\tkey := registryKey(host)\n\tfor reg, helper := range cfg.CredHelpers {\n\t\tif registryKey(reg) == key {\n\t\t\treturn credentialHelper(helper, host)\n\t\t}\n\t}\n\tfor reg, a := range cfg.Auths {\n\t\tif registryKey(reg) != key || a.Auth == \"\" {\n\t\t\tcontinue\n\t\t}\n\t\tdec, err := base64.StdEncoding.DecodeString(a.Auth)\n\t\tif err != nil {\n\t\t\treturn \"\", \"\", fmt.Errorf(\"mục đăng nhập của %s trong config.json hỏng\", host)\n\t\t}\n\t\tuser, pass, _ := strings.Cut(string(dec), \":\")\n\t\treturn user, pass, nil\n\t}\n\tif cfg.CredsStore != \"\" {\n\t\treturn credentialHelper(cfg.CredsStore, host)\n\t}\n\treturn \"\", \"\", nil\n…","approx":false},"credentialHelper()":{"sig":"func credentialHelper(name, host string) (string, string, error) {","code":"// credentialHelper asks docker-credential-<name> for a login. A helper that\n// knows nothing about the host answers with an error, which means anonymous.\n//\n// It gets a deadline: a helper can block — pass waiting on a GPG pinentry,\n// docker-credential-desktop waiting on a Docker Desktop still starting — and\n// without one the registry dialog would spin forever.\nfunc credentialHelper(name, host string) (string, string, error) {\n\tbin := \"docker-credential-\" + name\n\tctx, cancel := context.WithTimeout(context.Background(), 15*time.Second)\n\tdefer cancel()\n\tvar out bytes.Buffer\n\tcmd := exec.CommandContext(ctx, bin, \"get\")\n\thideWindow(cmd)\n\tcmd.Stdin = strings.NewReader(host)\n\tcmd.Stdout = &out\n\tif err := cmd.Run(); err != nil {\n\t\tif ctx.Err() != nil {\n\t\t\treturn \"\", \"\", fmt.Errorf(\"%s không trả lời sau 15 giây — kiểm tra Docker Desktop đã chạy xong chưa, rồi thử lại\", bin)\n\t\t}\n\t\tif _, lookErr := exec.LookPath(bin); lookErr != nil {\n\t\t\treturn \"\", \"\", fmt.Errorf(\"không tìm thấy %s — docker lưu mật khẩu qua nó, nên hãy kiểm tra Docker còn cài và nằm trong PATH\", bin)\n\t\t}\n\t\treturn \"\", \"\", nil\n\t}\n\tvar got struct{ Username, Secret string }\n\tif err := json.Unmarshal(out.Bytes(), &got); err != nil {\n\t\treturn \"\", \"\", fmt.Errorf(\"%s trả về dữ liệu lạ: %w\", bin, err)\n\t}\n\treturn got.Username, got.Secret, nil\n}","approx":false},"registryClient.harborTags()":{"sig":"func (c *registryClient) harborTags(host, name string) ([]RemoteTag, error) {","code":"// harborTags uses Harbor's API: GET /api/v2.0/projects/{p}/repositories/{r}/artifacts.\n// A repository below the project (\"mmt/team/app\") is one name to Harbor, so\n// its slashes are encoded twice — Harbor decodes the path once itself.\nfunc (c *registryClient) harborTags(host, name string) ([]RemoteTag, error) {\n\tproject, repo, ok := strings.Cut(name, \"/\")\n\tif !ok {\n\t\treturn nil, errNotHarbor // Harbor always has a project segment\n\t}\n\trepoEnc := url.PathEscape(url.PathEscape(repo))\n\tout := []RemoteTag{}\n\tconst pageSize = 100\n\tfor page := 1; page <= 50; page++ {\n\t\tpath := fmt.Sprintf(\"/api/v2.0/projects/%s/repositories/%s/artifacts?with_tag=true&page_size=%d&page=%d\",\n\t\t\turl.PathEscape(project), repoEnc, pageSize, page)\n\t\tresp, err := c.get(host, path, map[string]string{\"Accept\": \"application/json\"}, http.MethodGet)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tif resp.StatusCode == http.StatusNotFound && page == 1 {\n\t\t\t// Either not a Harbor at all, or a Harbor without this repository.\n\t\t\t// The generic API tells the two apart with a clearer answer.\n\t\t\tresp.Body.Close()\n\t\t\treturn nil, errNotHarbor\n\t\t}\n\t\tif resp.StatusCode != http.StatusOK {\n\t\t\tresp.Body.Close()\n\t\t\treturn nil, fmt.Errorf(\"Harbor %s trả về HTTP %d cho %s\", host, resp.StatusCode, name)\n\t\t}\n\t\tvar arts []struct {\n\t\t\tDigest   string    `json:\"digest\"`\n\t\t\tPushTime time.Time `json:\"push_time\"`\n\t\t\tTags     []struct {\n\t\t\t\tName     string    `json:\"name\"`\n…","approx":false},"registryClient.harborV1Tags()":{"sig":"func (c *registryClient) harborV1Tags(host, name string) ([]RemoteTag, error) {","code":"// harborV1Tags uses the API of Harbor 1.x: GET /api/repositories/{name}/tags,\n// with the whole repository name as one segment. Harbor 1.x is still common\n// on self-hosted machines — harbor.tech runs 1.10 — and it is also the one\n// that refuses manifest lists, which is why promote has to copy manifests\n// as they are (see promoteSteps).\nfunc (c *registryClient) harborV1Tags(host, name string) ([]RemoteTag, error) {\n\tpath := \"/api/repositories/\" + url.PathEscape(name) + \"/tags\"\n\tresp, err := c.get(host, path, map[string]string{\"Accept\": \"application/json\"}, http.MethodGet)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tdefer resp.Body.Close()\n\tif resp.StatusCode == http.StatusNotFound {\n\t\treturn nil, errNotHarbor\n\t}\n\tif resp.StatusCode != http.StatusOK {\n\t\treturn nil, fmt.Errorf(\"Harbor %s trả về HTTP %d cho %s\", host, resp.StatusCode, name)\n\t}\n\tvar list []struct {\n\t\tName     string    `json:\"name\"`\n\t\tDigest   string    `json:\"digest\"`\n\t\tPushTime time.Time `json:\"push_time\"`\n\t\tCreated  time.Time `json:\"created\"`\n\t}\n\tif err := json.NewDecoder(resp.Body).Decode(&list); err != nil {\n\t\treturn nil, errNotHarbor\n\t}\n\tout := make([]RemoteTag, 0, len(list))\n\tfor _, t := range list {\n\t\twhen := t.PushTime\n\t\tif when.IsZero() {\n\t\t\twhen = t.Created\n\t\t}\n\t\tout = append(out, RemoteTag{Tag: t.Name, Digest: t.Digest, PushedAt: when})\n\t}\n…","approx":false},"registryClient.genericTags()":{"sig":"func (c *registryClient) genericTags(host, name string) ([]RemoteTag, error) {","code":"func (c *registryClient) genericTags(host, name string) ([]RemoteTag, error) {\n\ttags := []string{}\n\t// A registry may cap n and page the rest behind a Link header\n\t// (rel=\"next\"); without following it the list is silently cut short.\n\tpath := \"/v2/\" + name + \"/tags/list?n=1000\"\n\tfor page := 0; path != \"\" && page < 50; page++ {\n\t\tresp, err := c.get(host, path, map[string]string{\"Accept\": \"application/json\"}, http.MethodGet)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tif resp.StatusCode == http.StatusNotFound {\n\t\t\tresp.Body.Close()\n\t\t\treturn nil, fmt.Errorf(\"không có repository %s trên %s\", name, host)\n\t\t}\n\t\tif resp.StatusCode != http.StatusOK {\n\t\t\tresp.Body.Close()\n\t\t\treturn nil, fmt.Errorf(\"%s trả về HTTP %d cho %s\", host, resp.StatusCode, name)\n\t\t}\n\t\tvar body struct {\n\t\t\tTags []string `json:\"tags\"`\n\t\t}\n\t\terr = json.NewDecoder(resp.Body).Decode(&body)\n\t\tresp.Body.Close()\n\t\tif err != nil {\n\t\t\treturn nil, fmt.Errorf(\"%s không trả về danh sách tag: %w\", host, err)\n\t\t}\n\t\ttags = append(tags, body.Tags...)\n\t\tpath = nextLink(resp.Header.Get(\"Link\"))\n\t}\n\t// The tags API gives no dates, so the newest-first order is a guess: a\n…","approx":false},"registryClient.token()":{"sig":"func (c *registryClient) token(host string, params map[string]string, user, secret string) (string, error) {","code":"// The realm is whatever the registry's 401 says, so it is not trusted with\n// the stored password blindly: the password only goes over https (when the\n// registry itself is reached over https), and only to the registry's own\n// host or a host under the same parent domain — registry.gitlab.com hands\n// out tokens from gitlab.com, Harbor from itself. Anywhere else gets the\n// request without credentials, which is enough for a public repository.\nfunc (c *registryClient) token(host string, params map[string]string, user, secret string) (string, error) {\n\trealm := params[\"realm\"]\n\tif realm == \"\" {\n\t\treturn \"\", fmt.Errorf(\"registry đòi token nhưng không nói lấy ở đâu\")\n\t}\n\tru, err := url.Parse(realm)\n\tif err != nil || ru.Host == \"\" {\n\t\treturn \"\", fmt.Errorf(\"registry đưa esponseWriter, r *http.Request) {","code":"// registryImport records chosen registry tags in the history.\n//\n// The request names tags, not digests: the registry is asked again here, so\n// the digest written into the history — the thing promote will re-tag — is\n// the registry's answer and never something the page sent back.\nfunc (a *api) registryImport(w http.ResponseWriter, r *http.Request) {\n\tvar req struct {\n\t\tProjectID string `json:\"projectId\"`\n\t\t// Keys are \"envId|tag\".\n\t\tKeys []string `json:\"keys\"`\n\t}\n\tif err := json.NewDecoder(r.Body).Decode(&req); err != nil {\n\t\tfail(w, http.StatusBadRequest, \"JSON không hợp lệ\")\n\t\treturn\n\t}\n\tp, ok := a.store.Config().FindProject(req.ProjectID)\n\tif !ok {\n\t\tfail(w, http.StatusNotFound, \"không tìm thấy dự án\")\n\t\treturn\n\t}\n\twanted := map[string]bool{}\n\tfor _, k := range req.Keys {\n\t\twanted[k] = true\n\t}\n\tif len(wanted) == 0 {\n\t\tfail(w, http.StatusBadRequest, \"chưa chọn tag nào\")\n\t\treturn\n\t}\n\n\t// A registry without push times (the generic API) leaves the order of\n\t// its tags as the only clue. Stamping those \"now\" would make the oldest\n\t// imported tag the newest record — and the newest success is what every\n\t// screen takes as the environment's current version. They are dated just\n\t// before everything the environment already has instead, one second\n\t// apart, keeping the lister's newest-first order.\n…","approx":false},"cleanupDialog()":{"sig":"function cleanupDialog(p){","code":"function cleanupDialog(p){\n  const m = openModal(`\n    <h2>Dọn image cũ của ${esc(p.name)}</h2>\n    <p class=\"sub\">Chỉ xoá image trên máy này (<code>docker rmi</code>, không ép). Registry không bị đụng tới.</p>\n    <label class=\"f\" style=\"max-width:260px\"><span>Giữ lại mỗi môi trường</span>\n      <select id=\"keep\">${[1,2,3,5,10].map(n => `<option value=\"${n}\" ${n === 3 ? 'selected' : ''}>${n} bản mới nhất</option>`).join('')}</select>\n    </label>\n    <div class=\"note\" style=\"margin:-6px 0 14px\">Luôn giữ: bản hiện tại của mỗi môi trường, image có container đang dùng, và tag không phải phiên bản (latest, cache…).</div>\n    <div id=\"plan\"><div class=\"kv-empty\">Đang đọc image trên máy…</div></div>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" id=\"cancel\">Đóng</button>\n      <button class=\"btn danger\" id=\"go\" disabled>Xoá</button>\n    </div>`, true);\n  $('#cancel', m).onclick = closeModal;\n  const go = $('#go', m), keepSel = $('#keep', m);\n\n  const sync = () => {\n    const n = $$('[data-ref]:checked', m).length;\n    go.disabled = !n;\n    go.textContent = n ? `Xoá ${n} image` : 'Xoá';\n  };\n  const load = async () => {\n    $('#plan', m).innerHTML = `<div class=\"kv-empty\">Đang đọc image trên máy…</div>`;\n    let res;\n    try { res = await api(`/api/cleanup?projectId=${encodeURIComponent(p.id)}&keep=${keepSel.value}`); }\n    catch (err) { $('#plan', m).innerHTML = `<div class=\"warnbox\">${esc(err.message)}</div>`; return sync(); }\n    const items = res.items || [];\n    $('#plan', m).innerHTML = items.length ? `<div class=\"builds\">${items.map(it => `<label class=\"hit${it.remove ? '' : ' dup'}\">\n        <input type=\"checkbox\" data-ref=\"${esc(it.ref)}\" ${it.remove ? 'checked' : 'disabled'}>\n        <b class=\"hit-name\">${esc(it.tag)}</b>\n…","approx":false},"api.cleanupPreview()":{"sig":"func (a *api) cleanupPreview(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) cleanupPreview(w http.ResponseWriter, r *http.Request) {\n\tp, ok := a.store.Config().FindProject(r.URL.Query().Get(\"projectId\"))\n\tif !ok {\n\t\tfail(w, http.StatusNotFound, \"không tìm thấy dự án\")\n\t\treturn\n\t}\n\tkeep := keepParam(r.URL.Query().Get(\"keep\"))\n\titems, err := a.cleanupPlan(p, keep)\n\tif err != nil {\n\t\tfail(w, http.StatusInternalServerError, err.Error())\n\t\treturn\n\t}\n\twriteJSON(w, http.StatusOK, map[string]any{\"keep\": keep, \"items\": items})\n}","approx":false},"api.cleanupPlan()":{"sig":"func (a *api) cleanupPlan(p Project, keep int) ([]CleanupItem, error) {","code":"func (a *api) cleanupPlan(p Project, keep int) ([]CleanupItem, error) {\n\timages, err := a.store.LocalImages()\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tcontainers, err := readContainers(a.store.Config().DockerBin)\n\tif err != nil {\n\t\t// Without the container list a used image could look removable.\n\t\t// docker rmi would still refuse it, but the plan must not claim\n\t\t// otherwise, so no list means no plan.\n\t\treturn nil, err\n\t}\n\treturn planCleanup(p, images, a.store.Builds(), containers, keep), nil\n}","approx":false},"readContainers()":{"sig":"func readContainers(docker string) ([]Container, error) {","code":"// readContainers runs docker ps. Tab separated for the same reason\n// LocalImages is: the field names of docker's JSON output have changed\n// between versions, the template names have not.\nfunc readContainers(docker string) ([]Container, error) {\n\tctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)\n\tdefer cancel()\n\tcmd := exec.CommandContext(ctx, docker, \"ps\", \"-a\", \"--no-trunc\",\n\t\t\"--format\", \"{{.ID}}\\t{{.Names}}\\t{{.Image}}\\t{{.State}}\\t{{.Status}}\\t{{.Ports}}\")\n\thideWindow(cmd)\n\tout, err := cmd.Output()\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tlist := []Container{}\n\tfor _, line := range strings.Split(string(out), \"\\n\") {\n\t\tf := strings.Split(strings.TrimRight(line, \"\\r\"), \"\\t\")\n\t\tif len(f) < 5 || f[0] == \"\" {\n\t\t\tcontinue\n\t\t}\n\t\tc := Container{ID: f[0], Name: f[1], Image: f[2], State: f[3], Status: f[4]}\n\t\tif len(f) > 5 {\n\t\t\tc.Ports = f[5]\n\t\t}\n\t\tif len(c.ID) > 12 {\n\t\t\tc.ID = c.ID[:12]\n\t\t}\n\t\tlist = append(list, c)\n\t}\n\treturn list, nil\n}","approx":false},"planCleanup()":{"sig":"func planCleanup(p Project, images []LocalImage, history []Build, containers []Container, keep int) []CleanupItem {","code":"func planCleanup(p Project, images []LocalImage, history []Build, containers []Container, keep int) []CleanupItem {\n\tif keep < 1 {\n\t\tkeep = 1 // keeping nothing would remove the version an environment is on\n\t}\n\tenvsByRepo := map[string][]Env{}\n\tfor _, e := range p.Envs {\n\t\tr := p.Effective(e).Repo()\n\t\tenvsByRepo[r] = append(envsByRepo[r], e)\n\t}\n\tusedBy := map[string]string{}\n\tfor _, c := range containers {\n\t\tif _, seen := usedBy[c.Image]; !seen {\n\t\t\tusedBy[c.Image] = c.Name\n\t\t}\n\t}\n\t// history is newest first: the first success per environment is current.\n\t// Kept as a set of refs across all environments, not looked up by the\n\t// environment a tag is filed under: two environments that share a repo and\n\t// a prefix (a Cache next to a Staging, both with none) have every tag\n\t// filed under one of them, and the other one's current image would\n\t// otherwise be ranked as an old version of the first and removed.\n\tcurrentEnv := map[string]bool{}\n\tcurrentRef := map[string]string{} // ref → name of the env it is current in\n\tenvName := map[string]string{}\n\tfor _, e := range p.Envs {\n\t\tenvName[e.ID] = e.Name\n\t}\n\tfor _, b := range history {\n\t\tif b.Status != \"success\" || b.ProjectID != p.ID || currentEnv[b.EnvID] {\n\t\t\tcontinue\n…","approx":false},"POST /api/cleanup":{"sig":"const res = await api('/api/cleanup', {method:'POST', body:JSON.stringify({projectId: p.id, keep: +keepSel.value, refs})});","code":"if (!confirm(`Xoá ${refs.length} image khỏi máy này? Bản trên registry vẫn còn, cần thì pull lại được.`)) return;\ngo.disabled = true; go.textContent = 'Đang xoá…';\ntry {\n  const res = await api('/api/cleanup', {method:'POST', body:JSON.stringify({projectId: p.id, keep: +keepSel.value, refs})});\n  const bad = (res.results || []).filter(r => !r.ok);\n  const ok = (res.results || []).length - bad.length;\n  if (bad.length){\n    // Re-read the plan: the removed tags are gone from it, and what is\n    // left reflects the machine now, not the list from before the run.","approx":true},"api.cleanupRun()":{"sig":"func (a *api) cleanupRun(w http.ResponseWriter, r *http.Request) {","code":"// cleanupRun removes the chosen tags — but only those the plan, worked out\n// again right now, still says to remove. A container started since the\n// dialog opened, or a newer build, takes a tag out of the list by itself.\nfunc (a *api) cleanupRun(w http.ResponseWriter, r *http.Request) {\n\tvar req struct {\n\t\tProjectID string   `json:\"projectId\"`\n\t\tKeep      int      `json:\"keep\"`\n\t\tRefs      []string `json:\"refs\"`\n\t}\n\tif err := json.NewDecoder(r.Body).Decode(&req); err != nil {\n\t\tfail(w, http.StatusBadRequest, \"JSON không hợp lệ\")\n\t\treturn\n\t}\n\tp, ok := a.store.Config().FindProject(req.ProjectID)\n\tif !ok {\n\t\tfail(w, http.StatusNotFound, \"không tìm thấy dự án\")\n\t\treturn\n\t}\n\titems, err := a.cleanupPlan(p, keepParam(strconv.Itoa(req.Keep)))\n\tif err != nil {\n\t\tfail(w, http.StatusInternalServerError, err.Error())\n\t\treturn\n\t}\n\tremovable := map[string]bool{}\n\tfor _, it := range items {\n\t\tif it.Remove {\n\t\t\tremovable[it.Ref] = true\n\t\t}\n\t}\n\ttype result struct {\n\t\tRef   string `json:\"ref\"`\n\t\tOK    bool   `json:\"ok\"`\n\t\tError string `json:\"error,omitempty\"`\n…","approx":false},"Store.removeImage()":{"sig":"func (s *Store) removeImage(ref string) error {","code":"// removeImage untags one local image. docker's own message is returned on\n// refusal, because it is the one that says what still needs the image.\nfunc (s *Store) removeImage(ref string) error {\n\tctx, cancel := context.WithTimeout(context.Background(), 60*time.Second)\n\tdefer cancel()\n\tvar out bytes.Buffer\n\tcmd := exec.CommandContext(ctx, s.Config().DockerBin, \"rmi\", ref)\n\thideWindow(cmd)\n\tcmd.Stdout, cmd.Stderr = &out, &out\n\tif err := cmd.Run(); err != nil {\n\t\tmsg := strings.TrimSpace(out.String())\n\t\tif msg == \"\" {\n\t\t\tmsg = err.Error()\n\t\t}\n\t\treturn errors.New(msg)\n\t}\n\treturn nil\n}","approx":false},"Store.Containers()":{"sig":"func (s *Store) Containers() []Container {","code":"//\n// Two more things keep the poll from stalling. docker ps is not run at all\n// while docker itself is known to be down — it would sit out its timeout on\n// every poll. And only one refresh runs at a time: a poll that arrives while\n// one is in flight is answered from the list it is about to replace, rather\n// than starting a second docker process and waiting on it.\nfunc (s *Store) Containers() []Container {\n\tconst freshFor = 10 * time.Second\n\ts.mu.Lock()\n\tlist := s.containers\n\tstale := list == nil || time.Since(s.containersAt) >= freshFor\n\trefresh := stale && !s.containersBusy\n\tif refresh {\n\t\ts.containersBusy = true\n\t}\n\ts.mu.Unlock()\n\n\tif refresh {\n\t\tfresh := []Container{}\n\t\tif _, ok := s.DockerVersion(); ok {\n\t\t\tif got, err := readContainers(s.Config().DockerBin); err == nil {\n\t\t\t\tfresh = got\n\t\t\t}\n\t\t}\n\t\ts.mu.Lock()\n\t\ts.containers, s.containersAt, s.containersBusy = fresh, time.Now(), false\n\t\ts.mu.Unlock()\n\t\tlist = fresh\n\t}\n\tif list == nil {\n\t\tlist = []Container{}\n\t}\n\treturn matchContainers(s.Config(), s.Builds(), list)\n}","approx":false},"matchContainers()":{"sig":"func matchContainers(cfg Config, history []Build, list []Container) []Container {","code":"// matchContainers fills in which project, environment and build each\n// container runs. history must be newest first, as Store.Builds returns it.\nfunc matchContainers(cfg Config, history []Build, list []Container) []Container {\n\tbyRef := map[string]Build{}\n\tbyDigest := map[string]Build{}\n\tfor _, b := range history {\n\t\tif b.Status != \"success\" {\n\t\t\tcontinue\n\t\t}\n\t\tif _, seen := byRef[b.Ref]; !seen && b.Ref != \"\" {\n\t\t\tbyRef[b.Ref] = b\n\t\t}\n\t\tif b.Digest != \"\" {\n\t\t\tk := repoOf(b.Ref) + \"@\" + b.Digest\n\t\t\tif _, seen := byDigest[k]; !seen ":{"sig":"func crossSiteWrite(r *http.Request) string {","code":"// crossSiteWrite says why a request that changes something did not come\n// from DIMA's own page, or \"\".\nfunc crossSiteWrite(r *http.Request) string {\n\tswitch r.Method {\n\tcase http.MethodGet, http.MethodHead:\n\t\treturn \"\"\n\t}\n\tif !strings.HasPrefix(strings.ToLower(r.Header.Get(\"Content-Type\")), \"application/json\") {\n\t\treturn \"chỉ nhận request JSON từ giao diện của DIMA\"\n\t}\n\tif site := r.Header.Get(\"Sec-Fetch-Site\"); site != \"\" && site != \"same-origin\" && site != \"none\" {\n\t\treturn \"từ chối request từ trang web khác\"\n\t}\n\tif origin := r.Header.Get(\"Origin\"); origin != \"\" {\n\t\tu, err := url.Parse(origin)\n\t\tif err != nil || !isLoopbackName(u.Hostname()) {\n\t\t\treturn \"từ chối request từ trang web khác\"\n\t\t}\n\t}\n\treturn \"\"\n}","approx":false}};

// Mở file này bằng file:// thì không phải secure context, nên
// navigator.clipboard không tồn tại và lời gọi đầu tiên im lặng thất bại.
// Đường lùi là textarea ẩn + execCommand, vốn vẫn chạy ở mọi ngữ cảnh.
function copyText(text, el){
  const ok = () => toast('Đã chép ' + text);

  // Đường lùi cuối: bôi đen sẵn chữ trên màn hình để người dùng chỉ việc Ctrl+C.
  // Cần có, vì execCommand cũng bị chặn khi thiếu user activation.
  const selectIt = () => {
    if (el){
      const r = document.createRange();
      r.selectNodeContents(el);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
      toast('Đã bôi đen sẵn — bấm Ctrl+C');
    } else {
      toast('Trình duyệt chặn clipboard');
    }
  };

  const legacy = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let done = false;
    try { done = document.execCommand('copy'); } catch { done = false; }
    ta.remove();
    done ? ok() : selectIt();
  };

  if (window.isSecureContext && navigator.clipboard?.writeText){
    navigator.clipboard.writeText(text).then(ok, legacy);
  } else {
    legacy();
  }
}

function setPaneWidth(which, px){
  const min = which === 'aside' ? 180 : 240;
  const max = Math.max(min, innerWidth - 360);
  const w = Math.round(Math.min(max, Math.max(min, px)));
  document.documentElement.style.setProperty(which === 'aside' ? '--asideW' : '--inspW', w + 'px');
  remember(which + 'W', w);
  syncLabels();
}
['aside','insp'].forEach(k => { const v = +recall(k + 'W'); if (v) setPaneWidth(k, v); });

function mountGutter(el, which){
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    el.classList.add('on');
    const startX = e.clientX;
    const box = el.parentElement.getBoundingClientRect();
    const base = box.width;
    const move = ev => setPaneWidth(which, which === 'aside'
      ? base + (ev.clientX - startX)
      : base - (ev.clientX - startX));
    const up = () => {
      el.classList.remove('on');
      removeEventListener('mousemove', move);
      removeEventListener('mouseup', up);
      document.body.style.userSelect = '';
    };
    document.body.style.userSelect = 'none';
    addEventListener('mousemove', move);
    addEventListener('mouseup', up);
  });
}
mountGutter($('#gutterL'), 'aside');
mountGutter($('#gutterR'), 'insp');

function renderTables(host, f){
  const keys = [...new Set([...Object.keys(DB), ...Object.keys(TOUCH)])]

  hot.forEach(k => {
    const t = DB[k];

      `<button class="tblrow" data-t="${esc(k)}"><b>${esc(t ? t.name : k)}</b><i>${TOUCH[k].length} bước</i></button>`);

         <span class="opt op-${esc(x.op)}">${esc(OP_NAME[x.op] || x.op)}</span>
         <span class="to">${esc(FLOWS[x.fi].name)} · bước ${x.si+1}</span>
       </button>`));
  });
  // Bảng không luồng nào đụng tới vẫn liệt kê: hoặc là bản đồ còn thiếu luồng,
  // hoặc là bảng chết — cả hai đều đáng biết.
  if (cold.length){
    host.insertAdjacentHTML('beforeend', `<div class="grp">Chưa luồng nào đụng tới (${cold.length})</div>`);
    cold.forEach(k => host.insertAdjacentHTML('beforeend',
      `<button class="tblrow cold" data-t="${esc(k)}"><b>${esc(DB[k].name)}</b><i>${DB[k].cols.length} cột</i></button>`));
  }
  if (!keys.length) host.innerHTML = `<div class="grp">Không có bảng nào khớp</div>`;
  $$('.tblrow', host).forEach(b => b.onclick = () => openTable(b.dataset.t));
  $$('.btnrow[data-si]', host).forEach(b => b.onclick = () => {
    const fi = +b.dataset.fi, si = +b.dataset.si;
    select(fi, 0); jump(si); openInspector(si);
  });
}

function renderTour(host, f){
  let shown = 0;
  TOUR.forEach((t, i) => {
    if (f && !(t.title + ' ' + t.file + ' ' + (t.fn || '') + ' ' + t.why).toLowerCase().includes(f)) return;
    shown++;
    host.insertAdjacentHTML('beforeend',
      `<button class="stop" data-k="${i}"><span class="n">${i+1}</span><span class="st">
         <span>${esc(t.title || t.fn || t.file)}</span>
         <code>${esc(t.file)}</code>
         <div>${esc(t.why)}</div></span></button>`);
  });
  if (!shown) host.innerHTML = `<div class="grp">Không có chặng nào khớp</div>`;
  $$('.stop', host).forEach(b => b.onclick = () => openStop(+b.dataset.k));
}

function renderTheme(host, f){
  let group = null, shown = 0;
  FLOWS.forEach((fl, i) => {
    if (f && !hay(fl).includes(f)) return;
    if (fl.group !== group){
      group = fl.group;
      host.insertAdjacentHTML('beforeend', `<div class="grp">${esc(group || 'Luồng')}</div>`);
    }
    host.insertAdjacentHTML('beforeend',
      `<button class="flow" data-i="${i}">
         <div class="t"><span class="n">${i+1}</span><span>${esc(fl.name)}</span></div>
         <div class="s">${esc(fl.sub || '')} · ${fl.steps.length} bước</div>
       </button>`);
    shown++;
  });
  if (!shown) host.innerHTML = `<div class="grp">Không có luồng nào khớp</div>`;
  $$('.flow', host).forEach(b => b.onclick = () => select(+b.dataset.i, 0));
}

function renderScreens(host, f){
  let shown = 0;
  SCREEN_ORDER.forEach(key => {
    const sc = SCREENS[key];
    const rows = (BY_SCREEN[key] || []).filter(t =>
      !f || hay(FLOWS[t.fi]).includes(f) || t.btn.toLowerCase().includes(f));
    const navs = (sc.nav || []).filter(n => !f || (n.btn + ' ' + (n.note||'')).toLowerCase().includes(f));
    if (!rows.length && !navs.length) return;
    shown++;
    host.insertAdjacentHTML('beforeend',
      `<div class="scr">
         <div class="sn"><b>${esc(sc.name)}</b><code>${esc(sc.fn || '')}${sc.file ? ' · ' + esc(sc.file) : ''}</code></div>
         <div class="sd">${esc(sc.desc || '')}</div>
       </div>`);
    rows.forEach(t => host.insertAdjacentHTML('beforeend',
      `<button class="btnrow" data-fi="${t.fi}" data-ti="${t.ti}">
         <span class="chip">${esc(t.btn)}</span>
         <span class="to">→ ${esc(FLOWS[t.fi].name)}</span>
       </button>`));
    navs.forEach(n => host.insertAdjacentHTML('beforeend',
      `<div class="btnrow nav"><span class="chip">${esc(n.btn)}</span><span class="to">${esc(n.note||'')}</span></div>`));
  });
  if (!shown) host.innerHTML = `<div class="grp">Không có màn hình nào khớp</div>`;
  $$('.btnrow[data-fi]', host).forEach(b => b.onclick = () => select(+b.dataset.fi, +b.dataset.ti));
}

function markActive(){
  const i = FLOWS.indexOf(flow);
  $$('.flow').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  $$('.btnrow[data-fi]').forEach(b =>
    b.classList.toggle('on', +b.dataset.fi === i && +b.dataset.ti === trig));
  $$('.tblrow').forEach(b => b.classList.toggle('on', focus.table === b.dataset.t));
  $$('.stop').forEach(b => b.classList.toggle('on', focus.stop === +b.dataset.k));
}

// Hai chế độ mới chỉ hiện khi có dữ liệu cho chúng, để dự án không có CSDL
// hay chưa khai lộ trình không phải nhìn một cái nút dẫn vào danh sách rỗng.
const MODES = {theme:'#mTheme', screen:'#mScreen', table:'#mTable', tour:'#mTour'};
$('#mTable').hidden = !HAS_DB;
$('#mTour').hidden  = !TOUR.length;
$('#q').oninput = renderList;
Object.entries(MODES).forEach(([m, sel]) => $(sel).onclick = () => {
  mode = m; remember('mode', m); syncModes(); renderList();
});
function syncModes(){
  Object.entries(MODES).forEach(([m, sel]) => $(sel).classList.toggle('on', mode === m));
}
{ const m = recall('mode'); if (MODES[m] && !$(MODES[m]).hidden) mode = m; }

/* ---------- chọn luồng ---------- */
function select(i, t = 0){
  halt();
  cur = -1; picked = -1;
  flow = FLOWS[i];
  trig = Math.min(t, Math.max(0, (flow.triggers || []).length - 1));
  drawCrumb(); drawTriggers();
  $('#plain').innerHTML = flow.plain ? `<b>Nói dễ hiểu</b>${esc(flow.plain)}` : '';
  build();
  setZoom(zoom);
  markActive();
  closeInspector();
  reset();
  wrap.scrollTo({left:0, top:0});
}

function drawCrumb(){
  const t = (flow.triggers || [])[trig];
  const sc = t ? SCREENS[t.screen] : null;
  $('#crumb').innerHTML =
    (sc ? `<span class="c-screen">${esc(sc.name)}</span><span class="c-sep">›</span>
           <span class="c-btn">${esc(t.btn)}</span><span class="c-sep">›</span>` : '') +
    `<span class="c-flow">${esc(flow.name)}</span><span class="c-sub">· ${esc(flow.sub || '')}</span>`;
}

function drawTriggers(){
  const list = flow.triggers || [];
  const bar = $('#trigbar');
  const nameOf = t => (SCREENS[t.screen] || {}).name || t.screen;
  if (list.length < 2){
    bar.innerHTML = list.length
      ? `<span class="lbl">Bấm từ:</span><span class="tchip on"><s>${esc(nameOf(list[0]))}</s> ${esc(list[0].btn)}</span>`
      : `<span class="lbl">Không có nút nào mở luồng này.</span>`;
    return;
  }
  bar.innerHTML = `<span class="lbl">Bấm được từ ${list.length} chỗ:</span>` + list.map((t, i) =>
    `<button class="tchip ${i===trig?'on':''}" data-t="${i}"><s>${esc(nameOf(t))}</s> ${esc(t.btn)}</button>`).join('');
  $$('.tchip[data-t]', bar).forEach(c => c.onclick = () => {
    trig = +c.dataset.t; drawCrumb(); drawTriggers(); markActive();
  });
}

/* ---------- dựng canvas ---------- */
function build(){
  $$('.node, .band, .lane-label', stage).forEach(el => el.remove());
  svg.innerHTML = defs();
  nodes = []; edges = [];

  const used = LANE_ORDER.filter(l => flow.steps.some(s => s.lane === l));
  const laneY = {};
  used.forEach((l, k) => laneY[l] = PAD_T + k * LANE_H);

  const width  = PAD_L + flow.steps.length * COL + 40;
  const height = PAD_T * 2 + used.length * LANE_H + BACK_GAP + 20;
  stage.style.width = width + 'px';
  stage.style.height = height + 'px';
  stageW = width; stageH = height;
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);

  used.forEach(l => {
    const info = LANES[l];
    const band = document.createElement('div');
    band.className = 'band';
    band.style.cssText = `--c:${info.c};top:${laneY[l]}px;height:${LANE_H}px;width:${width}px`;
    band.innerHTML = `<div class="fill"></div><div class="rule"></div>`;
    stage.appendChild(band);

    const lab = document.createElement('div');
    lab.className = 'lane-label';
    lab.style.cssText = `--c:${info.c};top:${laneY[l] + LANE_H/2}px;left:14px`;
    lab.innerHTML = `${esc(info.label)}<small>${esc(info.sub || '')}</small>`;
    stage.appendChild(lab);
  });

  flow.steps.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'node';
    el.style.cssText = `--c:${LANES[s.lane].c};left:${PAD_L + i * COL}px;top:0px`;
    el.innerHTML =
      `<div class="n-top"><span class="n-i">${i+1}</span><span class="n-file">${esc(s.file)}</span></div>
       <div class="n-fn">${esc(s.fn)}</div>
       <div class="n-desc">${esc(s.desc)}</div>${dbChips(s)}`;
    el.onclick = () => { jump(i); openInspector(i); };
    $$('.db', el).forEach(c => c.onclick = e => { e.stopPropagation(); openTable(c.dataset.t); });
    stage.appendChild(el);
    nodes.push({el, x:PAD_L + i * COL, w:NW, y:0, h:0});
  });

  nodes.forEach((n, i) => {
    n.h = n.el.offsetHeight;
    n.y = laneY[flow.steps[i].lane] + (LANE_H - n.h) / 2;
    n.el.style.top = n.y + 'px';
  });

  gutterY = PAD_T + used.length * LANE_H + 18;
  for (let i = 0; i < nodes.length - 1; i++){
    edges.push(makeEdge(i, i + 1, flow.steps[i+1].edge, 'main'));
  }
  (flow.extra || []).forEach((x, k) =>
    edges.push(makeEdge(x.from, x.to, x.label, x.kind || 'err', k * 15)));
}

function dbChips(s){
  if (!(s.db || []).length) return '';
  return `<div class="dbs">${s.db.map(d =>
    `<button class="db op-${esc(d.op || '')}" data-t="${esc(tkey(d.table))}" title="${esc(OP_NAME[d.op || ''])} bảng ${esc(d.table)}">${esc(d.table)}</button>`).join('')}</div>`;
}

function defs(){
  const mk = (id, c) =>
    `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
       orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;
  return `<defs>${DATA.lanes.map(l => mk('ar-' + l.key, l.color)).join('')}
    ${mk('ar-err', '#8a5260')}${mk('ar-loop', '#568a77')}</defs>`;
}

function makeEdge(a, b, label, kind, drop = 0){
  const A = nodes[a], B = nodes[b];
  // Cạnh chính nối hai khối liền nhau thì đi thẳng. Cạnh quay lui, hoặc cạnh
  // phụ nhảy xa, thì vòng xuống máng phía dưới để khỏi cắt ngang khối khác.
  const detour = B.x < A.x || (kind !== 'main' && Math.abs(b - a) > 1);
  let d;
  if (!detour){
    const x1 = A.x + A.w, y1 = A.y + A.h/2, x2 = B.x, y2 = B.y + B.h/2;
    const dx = Math.max(38, (x2 - x1) / 2);
    d = `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
  } else {
    const yb = Math.max(gutterY, Math.max(A.y + A.h, B.y + B.h) + 34) + drop;
    const x1 = A.x + A.w/2, x2 = B.x + B.w/2;
    d = `M${x1},${A.y + A.h} C${x1},${yb} ${x2},${yb} ${x2},${B.y + B.h}`;
  }
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.createElementNS(ns, 'g');
  const colour = LANES[flow.steps[b].lane].c;

  const base = document.createElementNS(ns, 'path');
  base.setAttribute('d', d);
  base.setAttribute('class', 'e-base' + (kind === 'main' ? '' : ' ' + kind));
  g.appendChild(base);

  let lit = null, dash = null, alt = null;
  if (kind === 'main'){
    lit = document.createElementNS(ns, 'path');
    lit.setAttribute('d', d);
    lit.setAttribute('class', 'e-lit');
    lit.style.setProperty('--c', colour);
    lit.setAttribute('marker-end', `url(#ar-${flow.steps[b].lane})`);
    g.appendChild(lit);

    dash = document.createElementNS(ns, 'path');
    dash.setAttribute('d', d);
    dash.setAttribute('class', 'e-flow');
    g.appendChild(dash);
  } else {
    base.setAttribute('marker-end', `url(#ar-${kind})`);
    alt = document.createElementNS(ns, 'path');
    alt.setAttribute('d', d);
    alt.setAttribute('class', 'e-alt');
    alt.setAttribute('stroke', kind === 'loop' ? '#7ee0a5' : '#ff7b8a');
    g.appendChild(alt);
  }

  if (label){
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('class', 'e-label' + (kind === 'main' ? '' : ' ' + kind));
    t.setAttribute('text-anchor', 'middle');
    const mid = midOf(d);
    t.setAttribute('x', mid.x); t.setAttribute('y', mid.y - 8);
    t.textContent = label;
    g.appendChild(t);
  }
  svg.appendChild(g);

  const rec = {a, b, kind, base, lit, dash, alt, len:0};
  if (lit){
    rec.len = lit.getTotalLength();
    lit.style.strokeDasharray = rec.len;
    lit.style.strokeDashoffset = rec.len;
  }
  return rec;
}

function midOf(d){
  const ns = 'http://www.w3.org/2000/svg';
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', d);
  svg.appendChild(p);
  const pt = p.getPointAtLength(p.getTotalLength() / 2);
  p.remove();
  return pt;
}

/* ---------- panel chi tiết ---------- */
function openInspector(i){
  picked = i; focus = {}; markActive();
  const s = flow.steps[i], lane = LANES[s.lane], src = SRC[s.fn];
  $('#insp').classList.remove('hide');
  nodes.forEach((n, k) => n.el.classList.toggle('picked', k === i));

  $('#inspHead').innerHTML =
    `<span class="lane" style="--c:${lane.c}">${esc(lane.label)}</span>
     <div class="nm"><b style="color:${lane.c}">${esc(s.fn)}</b><div>${esc(lane.sub || '')}</div></div>
     <button class="x" id="inspX" title="Đóng">×</button>`;
  $('#inspX').onclick = closeInspector;

  const prev = i > 0 ? flow.steps[i-1] : null;
  const next = i < flow.steps.length - 1 ? flow.steps[i+1] : null;

  // Cùng một hàm thường nằm trong nhiều luồng — chỗ này là cái hay bị bỏ sót
  // nhất khi đọc code, nên liệt kê hẳn ra và bấm sang được.
  const xref = [];
  FLOWS.forEach((f, fi) => f.steps.forEach((st, si) => {
    if (st.fn === s.fn && !(f === flow && si === i)) xref.push({fi, si, f});
  }));

  const trigs = (flow.triggers || []).map(t =>
    `<div class="pos">${esc((SCREENS[t.screen]||{}).name || t.screen)} › <b>${esc(t.btn)}</b>${
      t.sel ? ` <code style="color:var(--dim2)">${esc(t.sel)}</code>` : ''}</div>`).join('');

  $('#inspBody').innerHTML = `
    <div class="sec"><h4>Vị trí</h4>
      <div class="loc"><code id="locTxt">${esc(s.file)}</code><button id="locCopy">Chép</button></div>
      ${src && src.sig ? `<div class="sig" style="margin-top:7px">${esc(src.sig)}</div>` : ''}
    </div>

    <div class="sec"><h4>Nhiệm vụ</h4><div class="desc">${esc(s.desc)}</div></div>

    <div class="sec"><h4>Trong luồng này</h4>
      <div class="pos">Bước ${i+1}/${flow.steps.length} · ${esc(flow.name)}</div>
      <div class="hop">
        ${prev ? `<button data-hop="${i-1}"><span>← bước ${i}</span><b>${esc(prev.fn)}</b></button>` : ''}
        ${next ? `<button data-hop="${i+1}"><span>bước ${i+2} →</span><b>${esc(next.fn)}</b></button>` : ''}
      </div>
    </div>

    ${trigs ? `<div class="sec"><h4>Nút mở luồng này</h4>${trigs}</div>` : ''}

    ${(s.db || []).length ? `<div class="sec"><h4>Bảng dữ liệu</h4><div class="dbs" style="margin:0">${
      s.db.map(d => `<button class="db op-${esc(d.op || '')}" data-t="${esc(tkey(d.table))}">${esc(OP_NAME[d.op || ''])} · ${esc(d.table)}</button>`).join('')
    }</div></div>` : ''}

    ${xref.length ? `<div class="sec xref"><h4>Hàm này còn nằm ở ${xref.length} chỗ khác</h4>
      ${xref.map(x => `<button data-fi="${x.fi}" data-si="${x.si}">${esc(x.f.name)}<i>bước ${x.si+1}</i></button>`).join('')}
    </div>` : ''}

    <div class="sec"><h4>Mã nguồn${src && src.approx ? ' — vùng quanh dòng này' : ''}</h4>
      ${src && src.code
        ? `<pre class="code">${esc(src.code)}</pre>
           <div class="stamp">${src.approx
              ? 'Bước này là một nhánh điều kiện hoặc một lời gọi, không phải cả một hàm — đây là vài dòng quanh nó. '
              : ''}${SRC_STAMP ? 'Trích lúc ' + esc(SRC_STAMP) + ' — chạy lại <code>qf-flowmap</code> sau khi sửa mã.' : ''}</div>`
        : `<div class="nosrc">Không trỏ vào mã nguồn trong repo, nên không có đoạn mã nào để trích.</div>`}
    </div>`;

  $('#locCopy').onclick = () => copyText(s.file, $('#locTxt'));
  $$('.db', $('#inspBody')).forEach(b => b.onclick = () => openTable(b.dataset.t));
  $$('[data-hop]', $('#inspBody')).forEach(b =>
    b.onclick = () => { const k = +b.dataset.hop; jump(k); openInspector(k); });
  $$('.xref button', $('#inspBody')).forEach(b => b.onclick = () => {
    const fi = +b.dataset.fi, si = +b.dataset.si;
    select(fi, 0); jump(si); openInspector(si);
  });
}

function closeInspector(){
  $('#insp').classList.add('hide');
  picked = -1; focus = {}; markActive();
  nodes.forEach(n => n.el.classList.remove('picked'));
}

// Panel dùng chung cho những thứ không phải một bước trên canvas: bảng dữ liệu
// và chặng lộ trình. Bỏ đánh dấu khối đang chọn để khỏi hiểu nhầm là panel
// đang nói về khối đó.
function openAside(head, body){
  picked = -1;
  nodes.forEach(n => n.el.classList.remove('picked'));
  $('#insp').classList.remove('hide');
  $('#inspHead').innerHTML = head + `<button class="x" id="inspX" title="Đóng">×</button>`;
  $('#inspX').onclick = closeInspector;
  $('#inspBody').innerHTML = body;
  markActive();
}

function openTable(k){
  k = tkey(k);
  const t = DB[k], uses = TOUCH[k] || [];
  focus = {table: k};
  const loc = t && t.file ? t.file + (t.line ? ':' + t.line : '') : '';
  const cols = t ? t.cols.map(c =>
    `<tr class="${c.src ? 'added' : ''}" title="${c.src ? 'thêm ở ' + esc(c.src) : ''}">
       <td>${esc(c.n)}</td><td>${esc(c.t)}</td>
       <td>${c.pk ? '<span class="tag pk">PK</span>' : ''}${c.fk ? `<span class="tag fk" data-t="${esc(c.fk.split('.')[0])}">→ ${esc(c.fk)}</span>` : ''}${
         c.nn && !c.pk ? '<span class="tag">NOT NULL</span>' : ''}${c.note ? `<span class="tag">${esc(c.note)}</span>` : ''}</td>
     </tr>`).join('') : '';
  // Bảng khác trỏ khoá ngoại vào bảng này — hướng ngược lại của cột "→", hay bị quên nhất.
  const refBy = Object.values(DB).filter(o => o !== t && o.cols.some(c => c.fk && tkey(c.fk.split('.')[0]) === k));

  openAside(
    `<span class="lane" style="--c:#f0a94c">Bảng</span>
     <div class="nm"><b style="color:#f0a94c">${esc(t ? t.name : k)}</b><div>${t ? t.cols.length + ' cột' : 'không có trong schema'}</div></div>`,
    `${loc ? `<div class="sec"><h4>${t.manual ? 'Khai tay trong flows.json' : 'Tạo ở'}</h4>
       <div class="loc"><code id="locTxt">${esc(loc)}</code><button id="locCopy">Chép</button></div></div>` : ''}
     ${t && t.desc ? `<div class="sec"><h4>Nhiệm vụ</h4><div class="desc">${esc(t.desc)}</div></div>` : ''}
     <div class="sec xref"><h4>${uses.length ? `Luồng đụng tới bảng này (${uses.length} bước)` : 'Chưa luồng nào đụng tới bảng này'}</h4>
       ${uses.map(x => `<button data-fi="${x.fi}" data-si="${x.si}"><span class="opt op-${esc(x.op)}">${esc(OP_NAME[x.op] || x.op)}</span> ${
         esc(FLOWS[x.fi].name)}<i>bước ${x.si+1} · ${esc(FLOWS[x.fi].steps[x.si].fn)}</i></button>`).join('')}
     </div>
     ${refBy.length ? `<div class="sec"><h4>Bảng trỏ khoá ngoại vào đây</h4><div class="dbs" style="margin:0">${
       refBy.map(o => `<button class="db op-" data-t="${esc(tkey(o.name))}">${esc(o.name)}</button>`).join('')}</div></div>` : ''}
     <div class="sec"><h4>Cột</h4>${t
       ? `<table class="cols">${cols}</table>
          <div class="stamp">${t.manual
            ? 'Cột khai tay, không đối chiếu được với migration.'
            : 'Đọc từ migration SQL — cột có dấu + là thêm ở migration sau; rê chuột để xem file nào.'}</div>`
       : `<div class="nosrc">Không tìm thấy bảng này trong schema — sai tên, bảng đã bị xoá, hoặc flows.json chưa khai "schema".</div>`}
     </div>`);

  if (loc) $('#locCopy').onclick = () => copyText(loc, $('#locTxt'));
  $$('.xref button', $('#inspBody')).forEach(b => b.onclick = () => {
    const fi = +b.dataset.fi, si = +b.dataset.si;
    select(fi, 0); jump(si); openInspector(si);
  });
  $$('.tag.fk, .db', $('#inspBody')).forEach(b => b.onclick = () => openTable(b.dataset.t));
}

// "ui:552" → đường dẫn thật, để so được bước nào nằm cùng file với chặng lộ trình.
const fileOf = ref => { const h = String(ref || '').split(':')[0]; return (DATA.aliases || {})[h] || h; };

function openStop(k){
  const t = TOUR[k];
  focus = {stop: k};
  const path = fileOf(t.file), src = t.fn ? SRC[t.fn] : null;
  const here = [];
  FLOWS.forEach((f, fi) => f.steps.forEach((st, si) => { if (fileOf(st.file) === path) here.push({fi, si, f, st}); }));

  openAside(
    `<span class="lane" style="--c:var(--accent)">Chặng ${k+1}/${TOUR.length}</span>
     <div class="nm"><b style="color:var(--accent)">${esc(t.title || t.fn || t.file)}</b><div>${esc(t.fn || '')}</div></div>`,
    `<div class="sec"><h4>Vị trí</h4>
       <div class="loc"><code id="locTxt">${esc(t.file)}</code><button id="locCopy">Chép</button></div>
       ${src && src.sig ? `<div class="sig" style="margin-top:7px">${esc(src.sig)}</div>` : ''}
     </div>
     <div class="sec"><h4>Vì sao đọc chỗ này</h4><div class="desc">${esc(t.why)}</div></div>
     <div class="sec"><h4>Lộ trình</h4><div class="hop">
       ${k > 0 ? `<button data-stop="${k-1}"><span>← chặng ${k}</span><b>${esc(TOUR[k-1].title || TOUR[k-1].file)}</b></button>` : ''}
       ${k < TOUR.length - 1 ? `<button data-stop="${k+1}"><span>chặng ${k+2} →</span><b>${esc(TOUR[k+1].title || TOUR[k+1].file)}</b></button>` : ''}
     </div></div>
     ${here.length ? `<div class="sec xref"><h4>Luồng đi qua file này (${here.length} bước)</h4>
       ${here.map(x => `<button data-fi="${x.fi}" data-si="${x.si}">${esc(x.f.name)}<i>bước ${x.si+1} · ${esc(x.st.fn)}</i></button>`).join('')}
     </div>` : ''}
     ${src && src.code ? `<div class="sec"><h4>Mã nguồn</h4><pre class="code">${esc(src.code)}</pre>
       <div class="stamp">${SRC_STAMP ? 'Trích lúc ' + esc(SRC_STAMP) + '.' : ''}</div></div>` : ''}`);

  $('#locCopy').onclick = () => copyText(t.file, $('#locTxt'));
  $$('[data-stop]', $('#inspBody')).forEach(b => b.onclick = () => openStop(+b.dataset.stop));
  $$('.xref button', $('#inspBody')).forEach(b => b.onclick = () => {
    const fi = +b.dataset.fi, si = +b.dataset.si;
    select(fi, 0); jump(si); openInspector(si);
  });
}

/* ---------- phát lại ---------- */
const dur = () => 1450 - (+$('#speed').value) * 120;

function paint(animateEdge){
  nodes.forEach((n, i) => {
    n.el.classList.toggle('done', i < cur);
    n.el.classList.toggle('active', i === cur);
    n.el.classList.toggle('picked', i === picked);
  });
  edges.forEach(e => {
    if (e.kind !== 'main'){
      if (e.alt) e.alt.classList.toggle('on', cur >= e.a);
      return;
    }
    const on = e.b <= cur, isCurrent = e.b === cur;
    e.lit.classList.toggle('on', on);
    if (on){
      e.lit.style.transition = (isCurrent && animateEdge) ? `stroke-dashoffset ${dur()}ms linear` : 'none';
      e.lit.style.strokeDashoffset = 0;
    } else {
      e.lit.style.transition = 'none';
      e.lit.style.strokeDashoffset = e.len;
    }
    e.dash.classList.toggle('on', isCurrent && playing);
  });
  drawTrack();
  drawNow();
  if (cur >= 0) reveal(cur);
}

function drawTrack(){
  $('#track').innerHTML = flow.steps.map((s, i) =>
    `<div class="pip ${i < cur ? 'done' : ''} ${i === cur ? 'active' : ''}" data-i="${i}" title="${esc(s.fn)}">${i+1}</div>`).join('');
  $$('#track .pip').forEach(p => p.onclick = () => { const k = +p.dataset.i; jump(k); openInspector(k); });
  const act = $('#track .pip.active');
  if (act) act.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
}

function drawNow(){
  const host = $('#now');
  if (cur < 0){
    host.innerHTML = `<span class="hint">Bấm <kbd>Chạy</kbd> để mô phỏng · bấm một khối để xem chi tiết hàm · <kbd>Space</kbd> chạy/dừng · <kbd>←</kbd> <kbd>→</kbd> từng bước · <kbd>B</kbd> ẩn/hiện cột trái · kéo mép cột để đổi bề rộng · <kbd>Ctrl</kbd>+lăn chuột phóng to.</span>`;
    return;
  }
  const s = flow.steps[cur];
  host.innerHTML =
    `<span class="k">Bước ${cur+1}/${flow.steps.length} · ${esc(LANES[s.lane].label)} · ${esc(s.file)}</span>
     <span class="fn">${esc(s.fn)}</span><span class="d">— ${esc(s.desc)}</span>`;
}

function reveal(i){
  const n = nodes[i];
  const left = n.x * zoom, right = (n.x + n.w) * zoom;
  const vl = wrap.scrollLeft, vr = vl + wrap.clientWidth;
  if (left < vl + 60 || right > vr - 60){
    wrap.scrollTo({left: Math.max(0, left - wrap.clientWidth / 2 + n.w * zoom / 2), behavior:'smooth'});
  }
  const top = n.y * zoom, bot = (n.y + n.h) * zoom;
  const vt = wrap.scrollTop, vb = vt + wrap.clientHeight;
  if (top < vt + 20 || bot > vb - 20){
    wrap.scrollTo({top: Math.max(0, top - wrap.clientHeight / 2 + n.h * zoom / 2), behavior:'smooth'});
  }
}

// halt dừng bộ đếm mà không vẽ lại — vẽ lại trước khi cur về giá trị hợp lệ
// sẽ đọc phải một bước không tồn tại của luồng vừa chuyển sang.
function halt(){ playing = false; clearTimeout(timer); timer = null; }
function reset(){ halt(); cur = -1; paint(false); syncBtns(); }
function jump(i){ halt(); cur = i; paint(false); syncBtns(); }
function next(anim = true){
  if (!flow || cur >= flow.steps.length - 1) return false;
  cur++; paint(anim); syncBtns(); return true;
}
function prev(){ if (cur > -1){ halt(); cur--; paint(false); syncBtns(); } }

function play(){
  if (!flow) return;
  if (cur >= flow.steps.length - 1) cur = -1;
  playing = true; syncBtns();
  const tick = () => {
    if (!playing) return;
    if (!next(true)){ playing = false; paint(false); syncBtns(); return; }
    timer = setTimeout(tick, dur() + 240);
  };
  tick();
}
function stop(){ halt(); if (flow) paint(false); syncBtns(); }

function syncBtns(){
  const b = $('#bPlay');
  b.textContent = playing ? '❚❚ Dừng' : '▶ Chạy';
  b.classList.toggle('stop', playing);
  b.classList.toggle('run', !playing);
  $('#bPrev').disabled = !flow || cur < 0;
  $('#bNext').disabled = !flow || cur >= flow.steps.length - 1;
}

$('#bPlay').onclick  = () => playing ? stop() : play();
$('#bNext').onclick  = () => { stop(); next(true); };
$('#bPrev').onclick  = prev;
$('#bReset').onclick = reset;
$('#bFit').onclick   = () => fit();

/* ---------- thu phóng & kéo ---------- */
function setZoom(z){
  zoom = Math.min(1.6, Math.max(0.4, z));
  stage.style.transform = `scale(${zoom})`;
  sizer.style.width  = (stageW * zoom) + 'px';
  sizer.style.height = (stageH * zoom) + 'px';
  syncLabels();
}
function fit(){
  if (!flow) return;
  setZoom(Math.min(1, Math.max(0.55, (wrap.clientHeight - 20) / stageH)));
  wrap.scrollTo({left:0, top:0});
}
wrap.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.1 : 0.9));
}, {passive:false});

let drag = null;
wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.node') || e.button !== 0) return;
  drag = {x:e.clientX, y:e.clientY, l:wrap.scrollLeft, t:wrap.scrollTop};
  wrap.style.cursor = 'grabbing';
});
addEventListener('mousemove', e => {
  if (!drag) return;
  wrap.scrollLeft = drag.l - (e.clientX - drag.x);
  wrap.scrollTop  = drag.t - (e.clientY - drag.y);
});
addEventListener('mouseup', () => { drag = null; wrap.style.cursor = ''; });

function syncLabels(){
  const dx = wrap.scrollLeft / zoom;
  $$('.lane-label', stage).forEach(l => l.style.transform = `translateY(-50%) translateX(${dx}px)`);
}
wrap.addEventListener('scroll', syncLabels);

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); playing ? stop() : play(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); stop(); next(true); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
  else if (e.key === 'Home'){ reset(); }
  else if (e.key === 'Escape'){ closeInspector(); }
  else if (e.key === 'b' || e.key === 'B'){ toggleAside(); }
});
addEventListener('resize', syncLabels);

/* ---------- khởi động ---------- */
if (!FLOWS.length){
  document.querySelector('main').innerHTML =
    `<div class="fatal"><b>Chưa có luồng nào.</b><br>File dữ liệu rỗng — chạy lại <code>qf-flowmap</code> sau khi điền flowmap/flows.json.</div>`;
} else {
  syncModes();
  renderList();
  select(0, 0);
}
</script>
</body>
</html>
