<!DOCTYPE html>
<!--
  Bản đồ luồng end-to-end — khung dùng chung.
  Dữ liệu của từng dự án được flowmap-build.mjs nhét vào khối DATA bên dưới;
  đừng sửa file này để mô tả một dự án cụ thể.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIMA — Bản đồ luồng end-to-end</title>
<style>
:root{
  --bg:#0c0f14; --bg2:#11151c; --panel:#141922; --line:#232a36; --line2:#2e3746;
  --fg:#e6ebf2; --dim:#8b97a8; --dim2:#5f6b7c; --accent:#57b6ff;
  --nw:214px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:13px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
.mono,code,pre{font-family:Consolas,"JetBrains Mono","SF Mono",monospace}

header{
  flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:10px 16px; background:var(--bg2); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:15px;letter-spacing:.3px}
.brand span{color:var(--dim);font-size:12px}
.legend{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
.legend i{display:inline-flex;align-items:center;gap:6px;font-style:normal;color:var(--dim);font-size:11.5px}
.legend i::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}

main{flex:1 1 auto;display:flex;min-height:0}
aside{
  position:relative;
  flex:0 0 auto; width:var(--asideW,300px); min-width:180px;
  background:var(--bg2); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
body.no-aside aside{display:none}

/* Dải kéo để đổi bề rộng, nằm đè lên mép panel. */
.gutter{
  position:absolute;top:0;bottom:0;width:7px;cursor:col-resize;z-index:30;
}
.gutter::after{
  content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:transparent;transition:background .15s;
}
.gutter:hover::after,.gutter.on::after{background:var(--accent)}
aside .gutter{right:-3px}
.insp .gutter{left:-3px}

button.icon{
  flex:0 0 auto;border:1px solid var(--line2);background:var(--panel);color:var(--dim);
  border-radius:7px;padding:5px 9px;cursor:pointer;font:inherit;line-height:1;
}
button.icon:hover{border-color:#41506a;color:var(--fg)}
.modes{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 0}
.modes button{
  flex:1 1 40%;padding:6px 8px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px;
  border:1px solid var(--line2);background:var(--panel);color:var(--dim);
}
.modes button.on{background:#18222f;border-color:#2b4a68;color:var(--fg)}
.search{padding:8px 10px 6px}
.search input{
  width:100%; padding:7px 10px; border-radius:8px; border:1px solid var(--line2);
  background:var(--panel); color:var(--fg); outline:none; font:inherit;
}
.search input:focus{border-color:var(--accent)}
.list{overflow:auto;padding:0 8px 18px;flex:1 1 auto}
.grp{padding:14px 8px 6px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2)}
.flow{
  display:block;width:100%;text-align:left;cursor:pointer;
  padding:8px 10px;margin-bottom:3px;border-radius:8px;
  border:1px solid transparent;background:none;color:var(--fg);font:inherit;
}
.flow:hover{background:#1a212c}
.flow.on{background:#18222f;border-color:#2b4a68}
.flow .t{display:flex;align-items:center;gap:8px}
.flow .n{
  flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--line);
  color:var(--dim);display:grid;place-items:center;font-size:10.5px
}
.flow.on .n{background:var(--accent);color:#06121d;font-weight:700}
.flow .s{color:var(--dim);font-size:11.5px;margin-top:3px;margin-left:28px}

.scr{margin:10px 0 2px;padding:8px 10px;border-radius:8px;background:#151b24;border:1px solid var(--line)}
.scr .sn{display:flex;align-items:baseline;gap:8px}
.scr .sn b{font-size:12.5px}
.scr .sn code{color:var(--dim2);font-size:10.5px;margin-left:auto}
.scr .sd{color:var(--dim);font-size:11px;margin-top:3px}
.btnrow{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  padding:7px 10px 7px 14px;margin:2px 0;border-radius:8px;
  border:1px solid transparent;background:none;color:var(--fg);font:inherit;
}
.btnrow:hover{background:#1a212c}
.btnrow.on{background:#18222f;border-color:#2b4a68}
.btnrow .chip{
  flex:0 0 auto;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:2px 8px;border-radius:6px;background:#1e2733;border:1px solid var(--line2);
  font-size:11.5px;color:#cfe0f2;
}
.btnrow.on .chip{background:var(--accent);border-color:var(--accent);color:#06121d;font-weight:600}
.btnrow .to{color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btnrow.nav{cursor:default}
.btnrow.nav:hover{background:none}
.btnrow.nav .chip{background:none;border-style:dashed;color:var(--dim2)}
.btnrow.nav .to{color:var(--dim2);font-style:italic}

section{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg2);
}
.crumb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.crumb .c-screen{color:var(--dim);font-size:12px}
.crumb .c-btn{
  padding:1px 8px;border-radius:6px;background:#1e2733;border:1px solid var(--line2);
  font-size:11.5px;color:#cfe0f2;
}
.crumb .c-sep{color:var(--dim2)}
.crumb .c-flow{font-size:14px;font-weight:600}
.crumb .c-sub{color:var(--dim);font-size:11.5px}
.spacer{flex:1 1 auto}
button.b{
  border:1px solid var(--line2);background:var(--panel);color:var(--fg);
  padding:6px 11px;border-radius:7px;cursor:pointer;font:inherit;
}
button.b:hover:not(:disabled){border-color:#41506a;background:#1a2130}
button.b:disabled{opacity:.4;cursor:default}
button.b.run{background:var(--accent);border-color:var(--accent);color:#06121d;font-weight:600}
button.b.run:hover:not(:disabled){background:#77c5ff}
button.b.stop{background:#3a1f26;border-color:#6b3540;color:#ffb3bd}
.speed{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11.5px}
.speed input{width:90px;accent-color:var(--accent)}

.trigbar{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:6px 14px;border-bottom:1px solid var(--line);background:#0f131a;
}
.trigbar .lbl{color:var(--dim2);font-size:11px}
.tchip{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:inherit;font-size:11.5px;
  padding:3px 9px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);color:var(--dim);
}
.tchip:hover{border-color:#41506a;color:var(--fg)}
.tchip.on{background:#18222f;border-color:#3d6c96;color:var(--fg)}
.tchip s{text-decoration:none;color:var(--dim2)}
.tchip.on s{color:#8fb9dd}

.plain{
  flex:0 0 auto;padding:7px 14px;border-bottom:1px solid var(--line);background:#12161d;
  color:#c3ccd8;font-size:12px;
}
.plain b{color:var(--dim2);font-weight:600;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;margin-right:8px}
.plain:empty{display:none}

/* Bảng dữ liệu một bước đụng tới — màu theo thao tác, đọc nhạt, ghi vàng, xoá đỏ. */
.dbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.db{
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;font:inherit;font-size:10.5px;
  padding:1px 7px;border-radius:5px;border:1px solid var(--line2);background:#10151c;color:var(--dim);
  font-family:Consolas,monospace;
}
.db::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--op)}
.db:hover{border-color:var(--op);color:var(--fg)}
.op-read{--op:#57b6ff} .op-write{--op:#f0a94c} .op-delete{--op:#ff7b8a} .op-{--op:#5f6b7c}
.opt{font-size:10px;color:var(--op);font-family:inherit}

/* Bề rộng cố định: để tự co thì cột nhãn PK/FK giành chỗ và cột kiểu bị bẻ từng chữ một. */
table.cols{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
table.cols td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
table.cols td:first-child{width:38%;font-family:Consolas,monospace;color:var(--fg)}
table.cols td:nth-child(2){width:30%;font-family:Consolas,monospace;color:var(--dim)}
table.cols tr.added td:first-child::after{content:" +";color:var(--dim2)}
.tag{display:inline-block;font-size:9.5px;padding:0 5px;border-radius:4px;margin:1px 3px 1px 0;border:1px solid var(--line2);color:var(--dim)}
.tag.pk{border-color:#8a7a3a;color:#ffd166}
.tag.fk{border-color:#3d6c96;color:#8fb9dd;cursor:pointer}
.tag.fk:hover{background:#18222f}

.tblrow{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  margin:10px 0 2px;padding:7px 10px;border-radius:8px;background:#151b24;border:1px solid var(--line);
  color:var(--fg);font:inherit;
}
.tblrow:hover,.tblrow.on{border-color:#2b4a68}
.tblrow b{font-family:Consolas,monospace;font-size:12.5px;font-weight:400}
.tblrow i{font-style:normal;color:var(--dim2);font-size:11px;margin-left:auto}
.tblrow.cold{margin:2px 0;padding:4px 10px;background:none;border-color:transparent;color:var(--dim)}
.tblrow.cold b{font-size:11.5px}

.stop{
  display:flex;gap:9px;width:100%;text-align:left;cursor:pointer;
  padding:8px 10px;margin-bottom:3px;border-radius:8px;border:1px solid transparent;background:none;color:var(--fg);font:inherit;
}
.stop:hover{background:#1a212c}
.stop.on{background:#18222f;border-color:#2b4a68}
.stop .n{
  flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--line);
  color:var(--dim);display:grid;place-items:center;font-size:10.5px
}
.stop.on .n{background:var(--accent);color:#06121d;font-weight:700}
.stop .st{min-width:0}
.stop .st code{display:block;color:var(--dim2);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .st div{color:var(--dim);font-size:11.5px;margin-top:2px}

.wrap{flex:1 1 auto;position:relative;overflow:auto;background:
  radial-gradient(circle at 1px 1px,#1b2230 1px,transparent 0) 0 0/26px 26px, var(--bg)}
.sizer{position:relative}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
svg.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}

.band{position:absolute;left:0;pointer-events:none}
.band .fill{position:absolute;inset:0;background:var(--c);opacity:.030}
.band .rule{position:absolute;left:0;right:0;top:0;height:1px;background:var(--line)}
.lane-label{
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--c);opacity:.85;white-space:nowrap;pointer-events:none;
}
.lane-label small{display:block;color:var(--dim2);letter-spacing:.2px;text-transform:none;font-size:10.5px;margin-top:2px}

.node{
  position:absolute;width:var(--nw);padding:9px 11px 10px;border-radius:10px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line2);
  transition:border-color .22s, box-shadow .22s, transform .22s, background .22s;
}
.node::before{
  content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2px;border-radius:2px;
  background:var(--c);opacity:.55;
}
.node:hover{border-color:#41506a}
.node .n-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.node .n-i{
  width:17px;height:17px;border-radius:5px;background:#1d2530;color:var(--dim);
  display:grid;place-items:center;font-size:10px;flex:0 0 auto
}
.node .n-file{color:var(--dim2);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .n-fn{font-family:Consolas,monospace;font-size:12.5px;color:var(--c);word-break:break-word}
.node .n-desc{color:var(--dim);font-size:11.5px;margin-top:5px}
.node.done{border-color:#33506b;background:#161d27}
.node.done .n-i{background:var(--c);color:#06121d;font-weight:700}
.node.active{
  border-color:var(--c);background:#1a2331;transform:scale(1.035);
  box-shadow:0 0 0 1px var(--c),0 0 26px -4px var(--c),0 10px 30px -12px #000;
  z-index:3;
}
.node.active .n-i{background:var(--c);color:#06121d;font-weight:700}
.node.active .n-desc{color:#c3ccd8}
.node.picked{outline:2px dashed var(--c);outline-offset:3px}

.e-base{fill:none;stroke:var(--line2);stroke-width:1.6}
.e-lit{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linecap:round;opacity:0}
.e-lit.on{opacity:1}
.e-flow{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:7 13;opacity:0}
.e-flow.on{opacity:.9;animation:march .55s linear infinite}
@keyframes march{to{stroke-dashoffset:-20}}
.e-base.err{stroke-dasharray:5 6;stroke:#6b414b}
.e-base.loop{stroke-dasharray:5 6;stroke:#3f5f55}
.e-alt{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 8;opacity:0}
.e-alt.on{opacity:.9;animation:march .75s linear infinite}
.e-label{font-size:10.5px;fill:var(--dim2);font-family:Consolas,monospace}
.e-label.err{fill:#a8626f}
.e-label.loop{fill:#6fae92}

.insp{
  position:relative;
  flex:0 0 auto;width:var(--inspW,340px);min-width:240px;
  background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.insp.hide{display:none}
/* Màn hẹp thì panel nổi lên trên canvas, thay vì bóp canvas còn một dải. */
@media (max-width:1240px){
  .insp{position:fixed;top:0;right:0;bottom:0;z-index:20;box-shadow:-18px 0 40px -20px #000}
}
.insp-head{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.insp-head .lane{
  font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--c);
  border:1px solid var(--c);border-radius:5px;padding:1px 6px;opacity:.85;flex:0 0 auto;margin-top:2px;
}
.insp-head .nm{flex:1 1 auto;min-width:0}
.insp-head .nm b{font-family:Consolas,monospace;font-size:14px;word-break:break-word}
.insp-head .nm div{color:var(--dim2);font-size:11px;margin-top:2px}
.insp-head .x{flex:0 0 auto;border:none;background:none;color:var(--dim2);cursor:pointer;font-size:17px;line-height:1;padding:0 2px}
.insp-head .x:hover{color:var(--fg)}
.insp-body{overflow:auto;padding:4px 14px 20px;flex:1 1 auto}
.sec{margin-top:14px}
.sec > h4{margin:0 0 6px;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2);font-weight:600}
.loc{display:flex;align-items:center;gap:8px}
.loc code{
  flex:1 1 auto;background:var(--panel);border:1px solid var(--line2);border-radius:6px;
  padding:5px 8px;font-size:11.5px;color:#cfe0f2;overflow:hidden;text-overflow:ellipsis;
  user-select:all;cursor:text;
}
.loc button{
  flex:0 0 auto;border:1px solid var(--line2);background:var(--panel);color:var(--fg);
  border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit;font-size:11.5px;
}
.loc button:hover{border-color:#41506a}
.desc{color:#c3ccd8;font-size:12.5px}
.sig{
  background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;
  font-size:11.5px;color:var(--dim);white-space:pre-wrap;word-break:break-word;
}
.pos{color:var(--dim);font-size:12px}
.hop{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.hop button{
  flex:1 1 130px;min-width:0;text-align:left;border:1px solid var(--line2);background:var(--panel);
  color:var(--fg);border-radius:7px;padding:6px 9px;cursor:pointer;font:inherit;font-size:11.5px;
}
.hop button:hover{border-color:#41506a;background:#1a2130}
.hop button span{display:block;color:var(--dim2);font-size:10px;margin-bottom:1px}
.hop button b{font-family:Consolas,monospace;font-weight:400;font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xref button{
  display:block;width:100%;text-align:left;border:1px solid transparent;background:none;
  color:var(--fg);border-radius:7px;padding:5px 8px;cursor:pointer;font:inherit;font-size:11.5px;margin-bottom:2px;
}
.xref button:hover{background:#1a212c;border-color:var(--line2)}
.xref button i{font-style:normal;color:var(--dim2);font-size:10.5px;margin-left:6px}
.code{
  background:#0e1218;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;
  font-size:11px;line-height:1.55;color:#b9c6d6;overflow:auto;max-height:340px;margin:0;white-space:pre;
}
.nosrc{color:var(--dim2);font-size:11.5px;font-style:italic}
.stamp{color:var(--dim2);font-size:10.5px;margin-top:6px}

footer{
  flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg2);
  padding:8px 14px 10px;display:flex;flex-direction:column;gap:7px;
}
.track{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.pip{
  flex:0 0 auto;min-width:26px;height:22px;padding:0 7px;border-radius:6px;cursor:pointer;
  background:#1a2028;border:1px solid var(--line);color:var(--dim2);font-size:10.5px;
  display:grid;place-items:center;
}
.pip:hover{border-color:var(--line2)}
.pip.done{background:#1d2b39;border-color:#2f4a63;color:#9fc4e4}
.pip.active{background:var(--accent);border-color:var(--accent);color:#06121d;font-weight:700}
.now{display:flex;gap:9px;align-items:baseline;min-height:19px}
.now .k{color:var(--dim2);font-size:11px;flex:0 0 auto}
.now .fn{font-family:Consolas,monospace;color:var(--fg)}
.now .d{color:var(--dim);font-size:12px}
.hint{color:var(--dim2);font-size:11px}
kbd{background:#1c232e;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:10.5px}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:#1d2733;border:1px solid #3d6c96;border-radius:8px;padding:7px 14px;font-size:12px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;
}
.toast.on{opacity:1}
.fatal{margin:40px auto;max-width:560px;padding:20px;border:1px solid #6b3540;border-radius:10px;background:#1a1216}
</style>
</head>
<body>

<header>
  <div class="brand"><b id="appName"></b><span id="appSub"></span></div>
  <div class="legend" id="legend"></div>
</header>

<main>
  <aside>
    <div class="modes">
      <button id="mTheme" class="on">Theo chủ đề</button>
      <button id="mScreen">Theo màn hình</button>
      <button id="mTable" hidden>Theo bảng</button>
      <button id="mTour" hidden>Lộ trình đọc</button>
    </div>
    <div class="search"><input id="q" placeholder="Lọc…" autocomplete="off"></div>
    <div class="list" id="list"></div>
    <div class="gutter" id="gutterL" title="Kéo để đổi bề rộng"></div>
  </aside>

  <section>
    <div class="toolbar">
      <button class="icon" id="bAside" title="Ẩn/hiện danh sách luồng (B)">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <div class="speed">Tốc độ<input type="range" id="speed" min="1" max="10" value="6"></div>
      <button class="b" id="bPrev" title="Lùi một bước">◀</button>
      <button class="b run" id="bPlay">▶ Chạy</button>

c OpenStore(root string) (*Store, error) {\n\tfor _, d := range []string{root, filepath.Join(root, \"versions\"), filepath.Join(root, \"logs\")} {\n\t\tif err := os.MkdirAll(d, 0o755); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t}\n\ts := &Store{\n\t\troot:    root,\n\t\tlogs:    map[string]*logBuffer{},\n\t\tcancels: map[string]func(){},\n\t}\n\tif err := s.loadConfig(); err != nil {\n\t\treturn nil, err\n\t}\n\ts.loadHistory()\n\ts.migrateHistory()\n\treturn s, nil\n}","approx":false},"loadConfig()":{"sig":"func (s *Store) loadConfig() error {","code":"func (s *Store) loadConfig() error {\n\traw, err := os.ReadFile(s.configPath())\n\tif os.IsNotExist(err) {\n\t\ts.config = defaultConfig()\n\t\treturn s.writeConfigFile(s.config)\n\t}\n\tif err != nil {\n\t\treturn err\n\t}\n\tc, migrated, err := decodeConfig(raw)\n\tif err != nil {\n\t\t// A file cut in half by a crash must not lock the user out of the\n\t\t// app: versions/ normally still holds a readable copy.\n\t\treturn s.recoverConfigLocked(raw, err)\n\t}\n\ts.config = c\n\tif migrated {\n\t\ts.snapshotConfigLocked()\n\t\treturn s.writeConfigFile(c)\n\t}\n\treturn nil\n}","approx":false},"decodeConfig()":{"sig":"func decodeConfig(raw []byte) (Config, bool, error) {","code":"// decodeConfig reads either schema and reports whether the bytes had to be\n// migrated, so the caller can snapshot the original before overwriting it.\nfunc decodeConfig(raw []byte) (Config, bool, error) {\n\t// Notepad and PowerShell write UTF-8 with a byte order mark, and the\n\t// config file is meant to be editable by hand on Windows.\n\traw = bytes.TrimPrefix(raw, []byte(\"\\xef\\xbb\\xbf\"))\n\tvar probe struct {\n\t\tSchemaVersion int               `json:\"schemaVersion\"`\n\t\tProjects      []json.RawMessage `json:\"projects\"`\n\t\tEnvironments  []json.RawMessage `json:\"environments\"`\n\t}\n\tif err := json.Unmarshal(raw, &probe); err != nil {\n\t\treturn Config{}, false, fmt.Errorf(\"config.json không đọc được: %w\", err)\n\t}\n\tif probe.Projects == nil && probe.Environments != nil {\n\t\tvar old legacyConfig\n\t\tif err := json.Unmarshal(raw, &old); err != nil {\n\t\t\treturn Config{}, false, fmt.Errorf(\"config.json không đọc được: %w\", err)\n\t\t}\n\t\treturn migrateV1(old), true, nil\n\t}\n\tvar c Config\n\tif err := json.Unmarshal(raw, &c); err != nil {\n\t\treturn Config{}, false, fmt.Errorf(\"config.json không đọc được: %w\", err)\n\t}\n\tstale := c.SchemaVersion < currentSchema\n\tif stale {\n\t\t// v2, v3 and v4 share one Go shape — later versions only added\n\t\t// fields, and v4's one move keeps the old field for reading — so the\n\t\t// same json.Unmarshal reads them all and each migration is a pass\n\t\t// over the decoded value rather than a second decoder.\n\t\t//\n…","approx":false},"loadHistory()":{"sig":"func (s *Store) loadHistory() {","code":"func (s *Store) loadHistory() {\n\traw, err := os.ReadFile(s.historyPath())\n\tif err != nil {\n\t\ts.builds = []Build{}\n\t\treturn\n\t}\n\tvar h history\n\tif err := json.Unmarshal(bytes.TrimPrefix(raw, []byte(\"\\xef\\xbb\\xbf\")), &h); err != nil {\n\t\t// Starting empty would overwrite the unreadable file on the next\n\t\t// build, so keep a copy of it first.\n\t\tname := fmt.Sprintf(\"history-loi-%s.json\", time.Now().Format(\"20060102-150405\"))\n\t\t_ = writeFileAtomic(filepath.Join(s.root, \"versions\", name), raw, 0o644)\n\t\ts.builds = []Build{}\n\t\treturn\n\t}\n\tfor i := range h.Builds {\n\t\t// A build left \"running\" by a crash or a quit is not running now.\n\t\tif h.Builds[i].Status == \"running\" {\n\t\t\th.Builds[i].Status = \"canceled\"\n\t\t\th.Builds[i].Err = \"ứng dụng đã thoát khi build đang chạy\"\n\t\t}\n\t}\n\ts.builds = h.Builds\n}","approx":false},"api.routes()":{"sig":"func (a *api) routes(mux *http.ServeMux) {","code":"func (a *api) routes(mux *http.ServeMux) {\n\tmux.HandleFunc(\"GET /api/state\", a.state)\n\tmux.HandleFunc(\"PUT /api/config\", a.saveConfig)\n\tmux.HandleFunc(\"GET /api/config bin, args...)\n\t\thideWindow(cmd)\n\t\tif err := cmd.Start(); err != nil {\n\t\t\tcontinue\n\t\t}\n\t\treturn cmd\n\t}\n\treturn nil\n}","approx":false},"srv.Serve()":{"sig":"if err := srv.Serve(ln); err != nil {","code":"\t}\n\n\tsrv := &http.Server{Handler: guard(mux)}\n\tif err := srv.Serve(ln); err != nil {\n\t\tlog.Fatal(err)\n\t}\n}\n\n// fatal reports a startup failure and stops. Without a console on Windows a","approx":true},"return":{"sig":"if url := \"http://\" + addr; alreadyServing(url) {","code":"\t\tif ln, err := net.Listen(\"tcp\", addr); err == nil {\n\t\t\treturn ln, p, \"\"\n\t\t}\n\t\tif url := \"http://\" + addr; alreadyServing(url) {\n\t\t\treturn nil, p, url\n\t\t}\n\t}\n\treturn nil, 0, \"\"\n}","approx":true},"watchWindow()":{"sig":"func watchWindow(cmd *exec.Cmd, store *Store) {","code":"// watchWindow shuts the app down when its window is closed, the way a\n// desktop application behaves — which also frees the port.\nfunc watchWindow(cmd *exec.Cmd, store *Store) {\n\tstarted := time.Now()\n\t_ = cmd.Wait()\n\n\t// Some browsers hand the request to another process and exit at once.\n\t// Treat an immediate return as \"that was not our window\" and keep the\n\t// server up rather than quitting in the user's face.\n\tif time.Since(started) < 3*time.Second {\n\t\treturn\n\t}\n\tif store.HasRunningBuild() {\n\t\tfmt.Println(\"\\nCửa sổ đã đóng nhưng còn build đang chạy, nên ứng dụng vẫn tiếp tục.\")\n\t\tfmt.Println(\"Ctrl+C để dừng hẳn.\")\n\t\treturn\n\t}\n\tfmt.Println(\"\\nCửa sổ đã đóng. Dừng ứng dụng.\")\n\tos.Exit(0)\n}","approx":false},"cmd.Wait()":{"sig":"_ = cmd.Wait()","code":"// desktop application behaves — which also frees the port.\nfunc watchWindow(cmd *exec.Cmd, store *Store) {\n\tstarted := time.Now()\n\t_ = cmd.Wait()\n\n\t// Some browsers hand the request to another process and exit at once.\n\t// Treat an immediate return as \"that was not our window\" and keep the\n\t// server up rather than quitting in the user's face.\n\ .sel.kind === 'project' && !findProject(state.sel.id)) state.sel = {kind:'overview'};\n  if (state.sel.kind === 'env' && !findEnv(state.sel.id)) state.sel = {kind:'overview'};\n  render();\n}","approx":false},"api()":{"sig":"async function api(path, opts={}){","code":"async function api(path, opts={}){\n  const res = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});\n  if (res.status === 204) return null;\n  const data = await res.json().catch(() => ({}));\n  if (!res.ok) throw new Error(data.error || ('HTTP '+res.status));\n  return data;\n}","approx":false},"api.state()":{"sig":"func (a *api) state(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) state(w http.ResponseWriter, r *http.Request) {\n\tversion, ok := a.store.DockerVersion()\n\tcfg := a.store.Config()\n\twriteJSON(w, http.StatusOK, map[string]any{\n\t\t\"config\":        cfg,\n\t\t\"builds\":        buildViews(a.store.Builds(), cfg),\n\t\t\"dockerOk\":      ok,\n\t\t\"dockerVersion\": version,\n\t\t\"buildxOk\":      a.store.BuildxOK(),\n\t\t\"containers\":    a.store.Containers(),\n\t\t\"appVersion\":    appVersion,\n\t\t\"buildStamp\":    buildStamp,\n\t})\n}","approx":false},"Store.Config()":{"sig":"func (s *Store) Config() Config {","code":"func (s *Store) Config() Config {\n\ts.mu.RLock()\n\tdefer s.mu.RUnlock()\n\treturn s.config\n}","approx":false},"Store.Builds()":{"sig":"func (s *Store) Builds() []Build {","code":"// Builds returns the history newest first.\nfunc (s *Store) Builds() []Build {\n\ts.mu.RLock()\n\tdefer s.mu.RUnlock()\n\tout := make([]Build, len(s.builds))\n\tcopy(out, s.builds)\n\tsort.Slice(out, func(i, j int) bool { return out[i].StartedAt.After(out[j].StartedAt) })\n\treturn out\n}","approx":false},"DockerVersion()":{"sig":"func (s *Store) DockerVersion() (string, bool) {","code":"// DockerVersion reports whether the docker CLI is reachable.\n//\n// The UI polls the state endpoint every few seconds, so the answer is cached\n// briefly: asking docker each time meant spawning a process per poll, per\n// open window, for a value that almost never changes.\nfunc (s *Store) DockerVersion() (string, bool) {\n\tconst freshFor = 10 * time.Second\n\n\ts.mu.RLock()\n\tif time.Since(s.dockerCheckedAt) < freshFor {\n\t\tv, ok := s.dockerVersion, s.dockerOK\n\t\ts.mu.RUnlock()\n\t\treturn v, ok\n\t}\n\ts.mu.RUnlock()\n\n\tctx, cancel := context.WithTimeout(context.Background(), 6*time.Second)\n\tdefer cancel()\n\tcmd := exec.CommandContext(ctx, s.Config().DockerBin, \"version\", \"--format\", \"{{.Server.Version}}\")\n\thideWindow(cmd)\n\tout, err := cmd.Output()\n\n\tv := \"\"\n\tif err == nil {\n\t\tv = strings.TrimSpace(string(out))\n\t}\n\n\ts.mu.Lock()\n\ts.dockerVersion, s.dockerOK, s.dockerCheckedAt = v, v != \"\", time.Now()\n\ts.mu.Unlock()\n\treturn v, v != \"\"\n}","approx":false},"BuildxOK()":{"sig":"func (s *Store) BuildxOK() bool { return s.buildxAvailable() }","code":"// BuildxOK reports whether promotes can skip the pull/push round trip.\nfunc (s *Store) BuildxOK() bool { return s.buildxAvailable() }","approx":false},"writeJSON()":{"sig":"func writeJSON(w http.ResponseWriter, code int, v any) {","code":"func writeJSON(w http.ResponseWriter, code int, v any) {\n\tw.Header().Set(\"Content-Type\", \"application/json; charset=utf-8\")\n\tw.WriteHeader(code)\n\t_ = json.NewEncoder(w).Encode(v)\n}","approx":false},"render()":{"sig":"function render(){ renderRail(); renderPane(); labelDots(); }","code":"/* ---------- render ---------- */\nfunction render(){ renderRail(); renderPane(); labelDots(); }","approx":false},"renderPane()":{"sig":"function renderPane(){","code":"function renderPane(){\n  const sel = state.sel;\n  if (sel.kind === 'project'){ const p = findProject(sel.id); if (p) return renderProject(p); }\n  if (sel.kind === 'env'){ const hit = findEnv(sel.id); if (hit) return renderEnv(hit.p, hit.e); }\n  renderOverview();\n}","approx":false},"projectDialog()":{"sig":"function projectDialog(p){","code":"/* ---------- project settings ---------- */\nfunction projectDialog(p){\n  const draft = JSON.parse(JSON.stringify(p));\n  draft.buildArgs = draft.buildArgs || [];\n  draft.labels = draft.labels || [];\n  const envs = draft.envs || [];\n\n  const m = openModal(`\n    <h2>Cài đặt dự án ${esc(p.name)}</h2>\n    <p class=\"sub\">Giá trị ở đây áp cho mọi môi trường của dự án. Môi trường nào khai riêng thì giá trị của nó thắng.</p>\n    <div class=\"grid2\">\n      <label class=\"f\"><span>Tên dự án</span><input type=\"text\" id=\"f-name\" value=\"${esc(draft.name)}\"></label>\n      <label class=\"f\"><span>Nhóm</span>\n        ${groupPickerHTML('f-group', draft.group, '— Không thuộc nhóm nào —')}\n      </label>\n    </div>\n    <div id=\"release-wrap\">\n      <div class=\"grid2\">\n        <label class=\"f\"><span>Cách đưa version qua các môi trường</span>\n          <select id=\"f-mode\">\n            <option value=\"rebuild\" ${draft.releaseMode!=='promote'?'selected':''}>Build lại cho từng môi trường</option>\n            <option value=\"promote\" ${draft.releaseMode==='promote'?'selected':''}>Build một lần rồi promote</option>\n          </select></label>\n      </div>\n      <label class=\"f\" id=\"src-wrap\"><span>Môi trường nguồn — nơi build chính, các môi trường khác nhận promote từ đây</span>\n        <select id=\"f-src\">${envs.map(e => `<option value=\"${esc(e.id)}\" ${e.id===buildEnvId(p)?'selected':''}>${esc(e.name)}</option>`).join('')}</select>\n      </label>\n    </div>\n    <label class=\"f\"><span>Thư mục mã nguồn — nơi chạy lệnh docker build</span>\n      <div class=\"pathrow\">\n        <input type=\"text\" id=\"f-ctx\" value=\"${esc(draft.context||'')}\" placeholder=\"chưa chọn thư mục\">\n…","approx":false},"envDialog()":{"sig":"function envDialog(p, e){","code":"/* ---------- environment settings ---------- */\nfunction envDialog(p, e){\n  const draft = JSON.parse(JSON.stringify(e));\n  draft.buildArgs = draft.buildArgs || [];\n  draft.labels = draft.labels || [];\n  const inh = v => v ? `kế thừa: ${v}` : 'để trống';\n\n  const m = openModal(`\n    <h2>Cài đặt môi trường ${esc(e.name)}</h2>\n    <p class=\"sub\">Chỉ khai những gì khác với dự án ${esc(p.name)}. Ô để trống thì lấy giá trị của dự án.</p>\n    <div class=\"grid2\">\n      <label class=\"f\"><span>Tên môi trường</span><input type=\"text\" id=\"f-name\" value=\"${esc(draft.name)}\"></label>\n      <label class=\"f\"><span>Tiền tố tag</span><input type=\"text\" id=\"f-prefix\" value=\"${esc(draft.tagPrefix||'')}\" placeholder=\"prod-\"></label>\n    </div>\n    <div class=\"preview\" id=\"preview\"></div>\n    <label class=\"check\" id=\"local-check\" style=\"margin:12px 0 4px\">\n      <input type=\"checkbox\" id=\"f-local\" ${draft.isOnlyLocal?'checked':''}>\n      Chỉ dùng trên máy này — không đẩy lên registry\n    </label>\n    <div id=\"local-note\"></div>\n    <label class=\"check\" id=\"protected-check\" style=\"margin:8px 0 4px\">\n      <input type=\"checkbox\" id=\"f-protected\" ${draft.protected?'checked':''}>\n      Môi trường quan trọng (production) — build thẳng ở đây phải xác nhận, đường thường đi là promote\n    </label>\n    <div class=\"section-label\" style=\"margin:22px 0 10px\">Ghi đè cấu hình của dự án</div>\n    <div class=\"grid2\">\n      <label class=\"f\"><span>Registry</span><input type=\"text\" id=\"f-reg\" value=\"${esc(draft.registry||'')}\" placeholder=\"${esc(inh(p.registry))}\"></label>\n      <label class=\"f\"><span>Tên image</span><input type=\"text\" id=\"f-img\" value=\"${esc(draft.image||'')}\" placeholder=\"${esc(inh(p.image))}\"></label>\n      <label class=\"f\"><span>Dockerfile</span><input type=\"text\" id=\"f-df\" value=\"${esc(draft.dockerfile||'')}\" placeholder=\"${esc(inh(p.dockerfile))}\"></label>\n      <label class=\"f\"><span>Platform</span><input type=\"text\" id=\"f-plat\" value=\"${esc(draft.platform||'')}\" placeholder=\"${esc(inh(p.platform))}\"></label>\n      <label class= \t\treturn\n\t}\n\tname := fmt.Sprintf(\"config-%s.json\", time.Now().Format(\"20060102-150405\"))\n\t_ = writeFileAtomic(filepath.Join(s.root, \"versions\", name), old, 0o644)\n}","approx":false},"normalise()":{"sig":"func normalise(c Config) Config {","code":"// normalise fills in the defaults and identifiers a hand-edited or restored\n// config.json may be missing.\nfunc normalise(c Config) Config {\n\tif strings.TrimSpace(c.DockerBin) == \"\" {\n\t\tc.DockerBin = \"docker\"\n\t}\n\tc.SchemaVersion = currentSchema\n\tfor i := range c.Projects {\n\t\tp := &c.Projects[i]\n\t\tif p.ID == \"\" {\n\t\t\tp.ID = newID()\n\t\t}\n\t\tp.Group = strings.TrimSpace(p.Group)\n\t\t// A project read from a file written before schema 3, or typed in by\n\t\t// hand, has no origin. It was not created by a folder sync.\n\t\tif p.Origin != OriginFolderSync {\n\t\t\tp.Origin = OriginUser\n\t\t}\n\t\tp.FolderPath = strings.TrimSpace(p.FolderPath)\n\t\tif p.ReleaseMode != ModePromote {\n\t\t\tp.ReleaseMode = ModeRebuild\n\t\t}\n\t\tif p.BuildArgs == nil {\n\t\t\tp.BuildArgs = []KV{}\n\t\t}\n\t\tif p.Labels == nil {\n\t\t\tp.Labels = []KV{}\n\t\t}\n\t\tif p.Envs == nil {\n\t\t\tp.Envs = []Env{}\n\t\t}\n\t\t// normalise does not invent environments. It used to, for a\n…","approx":false},"writeConfigFile()":{"sig":"func (s *Store) writeConfigFile(c Config) error {","code":"func (s *Store) writeConfigFile(c Config) error {\n\traw, err := json.MarshalIndent(c, \"\", \"  \")\n\tif err != nil {\n\t\treturn err\n\t}\n\treturn writeFileAtomic(s.configPath(), append(raw, '\\n'), 0o644)\n}","approx":false},"mountPath()":{"sig":"function mountPath(input, btn, infoEl, wantedDockerfile, inheritedPath, onPick){","code":"function mountPath(input, btn, infoEl, wantedDockerfile, inheritedPath, onPick){\n  let timer;\n\n  const render = info => {\n    const inherited = !input.value.trim() && info.path;\n    if (!info.path){\n      infoEl.className = 'pathinfo none';\n      infoEl.textContent = 'Chưa chọn und and has no right to take the\n// foreground, so a dialog opened straight away lands behind DIMA's window.\n// It is therefore owned by an invisible TopMost window: windows owned by a\n// topmost window stay on top too, and the Alt press/release unlocks\n// SetForegroundWindow so the dialog also gets the keyboard.\nfunc pickFolder(title string) (string, error) {\n\tcmd := exec.Command(\"powershell.exe\", \"-NoProfile\", \"-NonInteractive\", \"-STA\",\n\t\t\"-ExecutionPolicy\", \"Bypass\", \"-EncodedCommand\", encodePowerShell(pickerScript))\n\t// The title goes in through stdin rather than into the script, so no\n\t// character in it can break the PowerShell string.\n\tcmd.Stdin = strings.NewReader(title)\n\thideWindow(cmd)\n\tvar stderr strings.Builder\n\tcmd.Stderr = &stderr\n\tout, err := cmd.Output()\n\tif err != nil {\n\t\tif msg := strings.TrimSpace(stderr.String()); msg != \"\" {\n\t\t\treturn \"\", fmt.Errorf(\"không mở được hộp thoại chọn thư mục: %s\", msg)\n\t\t}\n\t\treturn \"\", fmt.Errorf(\"không mở được hộp thoại chọn thư mục: %w\", err)\n\t}\n\treturn strings.TrimSpace(string(out)), nil\n}","approx":false},"inspectFolder()":{"sig":"func (a *api) inspectFolder(w http.ResponseWriter, r *http.Request) {","code":"// inspectFolder answers what the settings form needs to show about a path:\n// does it exist, and which Dockerfiles are in it.\nfunc (a *api) inspectFolder(w http.ResponseWriter, r *http.Request) {\n\twriteJSON(w, http.StatusOK, inspectFolder(\n\t\tr.URL.Query().Get(\"path\"), r.URL.Query().Get(\"dockerfile\")))\n}","approx":false},"mountPath › dòng báo dưới ô":{"sig":"const render = info => {","code":"function mountPath(input, btn, infoEl, wantedDockerfile, inheritedPath, onPick){\n  let timer;\n\n  const render = info => {\n    const inherited = !input.value.trim() && info.path;\n    if (!info.path){\n      infoEl.className = 'pathinfo none';\n      infoEl.textContent = 'Chưa chọn thư mục — build sẽ không chạy được.';\n      return;","approx":true},"importDialog()":{"sig":"function importDialog(){","code":"/* ---------- bulk import ---------- */\nfunction importDialog(){\n  const m = openModal(`\n    <h2>Quét thư mục mã nguồn</h2>\n    <p class=\"sub\">Chọn một thư mục cha. DIMA tìm các thư mục con có Dockerfile (sâu tối đa ba tầng) và tạo mỗi thư mục một dự án.</p>\n    <label class=\"f\"><span>Thư mục cha</span>\n      <div class=\"pathrow\">\n        <input type=\"text\" id=\"root\" placeholder=\"ví dụ: D:\\\\work\">\n        <button type=\"button\" class=\"btn\" id=\"pick\">Chọn thư mục</button>\n      </div>\n    </label>\n    <div class=\"grid2\">\n      <label class=\"f\"><span>Nhóm cho tất cả</span>\n        ${groupPickerHTML('group', '', '— lấy theo tên thư mục cha —')}</label>\n      <label class=\"f\"><span>Registry cho tất cả — để trống nếu build local</span><input type=\"text\" id=\"reg\" placeholder=\"git.mmt.local\"></label>\n    </div>\n    <div class=\"section-label\" style=\"margin:16px 0 8px\">Tìm thấy <span class=\"count\" id=\"count\">—</span>\n      <button class=\"btn sm ghost\" id=\"all\" style=\"margin-left:auto\">Chọn tất cả</button>\n      <button class=\"btn sm ghost\" id=\"none\">Bỏ chọn</button>\n    </div>\n    <div id=\"hits\"><div class=\"kv-empty\">Chọn thư mục cha để bắt đầu.</div></div>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" id=\"cancel\">Hủy</button>\n      <button class=\"btn primary\" id=\"go\" disabled>Thêm</button>\n    </div>`, true);\n\n  const rootIn = $('#root', m), group = mountGroupPicker(m, 'group');\n  let hits = [];\n  const taken = new Set(projects().flatMap(p => (p.envs||[]).map(e => (effective(p,e).context||'').toLowerCase()).concat([(p.context||'').toLowerCase()])).filter(Boolean));\n\n  const selected = () => $$('#hits input:checked', m).map(c => hits[+c.dataset.i]);\n…","approx":false},"scan()":{"sig":"const scan = async () => {","code":"const scan = async () => {\n  const path = rootIn.value.trim();\n  if (!path) return;\n  $('#hits', m).innerHTML = `<div class=\"kv-empty\">Đang quét ${esc(path)}…</div>`;\n  try {\n    const res = await api('/api/scan-folder?path=' + encodeURIComponent(path));\n    hits = res.hits || [];\n    if (group.isEmpty()) group.suggest(res.group || '');\n    drawHits();\n    if (res.truncated) toast('Quá nhiều thư mục, chỉ hiện ' + hits.length + ' cái đầu tiên', true);\n  } catch (e) {\n    hits = [];\n    $('#hits', m).innerHTML = `<div class=\"kv-empty\">${esc(e.message)}</div>`;\n    syncGo();\n  }\n};","approx":false},"api.scanFolder()":{"sig":"func (a *api) scanFolder(w http.ResponseWriter, r *http.Request) {","code":"// tree of repositories can be added in one go instead of one at a time.\n//\n// It looks three levels down, which covers a flat folder of repositories,\n// the common apps/<name> layout, and one grouping folder above either of\n// them. Descending stops as soon as a folder turns out to be buildable, so\n// a repository's own subfolders are never mistaken for separate projects.\nfunc (a *api) scanFolder(w http.ResponseWriter, r *http.Request) {\n\troot := strings.TrimSpace(r.URL.Query().Get(\"path\"))\n\tif root == \"\" {\n\t\tfail(w, http.StatusBadRequest, \"chưa chọn thư mục để quét\")\n\t\treturn\n\t}\n\tst, err := os.Stat(root)\n\tif err != nil || !st.IsDir() {\n\t\tfail(w, http.StatusBadRequest, \"không tìm thấy thư mục: \"+root)\n\t\treturn\n\t}\n\n\thits := []scanHit{}\n\t// The parent folder may itself be a project.\n\tif df := dockerfileIn(root); df != \"\" {\n\t\thits = append(hits, scanHit{Name: filepath.Base(root), Path: root, Dockerfile: df, Depth: 0})\n\t}\n\tvar walk func(dir string, depth int)\n\twalk = func(dir string, depth int) {\n\t\tif depth > 3 || len(hits) >= maxScanHits {\n\t\t\treturn\n\t\t}\n\t\tentries, err := os.ReadDir(dir)\n\t\tif err != nil {\n\t\t\treturn\n\t\t}\n\t\tfor _, e := range entries {\n\t\t\tif !e.IsDir() || len(hits) >= maxScanHits || skipDir(e.Name()) {\n\t\t\t\tcontinue\n\t\t\t}\n…","approx":false},"skipDir()":{"sig":"func skipDir(name string) bool {","code":"// skipDir keeps the scan out of folders that never hold a project of their own.\nfunc skipDir(name string) bool {\n\tswitch name {\n\tcase \"node_modules\", \"vendor\", \"dist\", \"build\", \"target\", \"bin\", \"obj\",\n\t\t\".git\", \".idea\", \".vscode\", \".venv\", \"venv\", \"__pycache__\":\n\t\treturn true\n\t}\n\treturn strings.HasPrefix(name, \".\")\n}","approx":false},"dockerfileIn()":{"sig":"func dockerfileIn(dir string) string {","code":"// dockerfileIn returns the Dockerfile to use for a folder, or \"\".\nfunc dockerfileIn(dir string) string {\n\tif _, err := os.Stat(filepath.Join(dir, \"Dockerfile\")); err == nil {\n\t\treturn \"Dockerfile\"\n\t}\n\tentries, err := os.ReadDir(dir)\n\tif err != nil {\n\t\treturn \"\"\n\t}\n\tfor _, e := range entries {\n\t\tif e.IsDir() {\n\t\t\tcontinue\n\t\t}\n\t\tif n := e.Name(); strings.HasPrefix(n, \"Dockerfile.\") ||\n\t\t\tstrings.HasSuffix(strings.ToLower(n), \".dockerfile\") {\n\t\t\treturn n\n\t\t}\n\t}\n\treturn \"\"\n}","approx":false},"drawHits()":{"sig":"const drawHits = () => {","code":"const drawHits = () => {\n  $('#count', m).textContent = hits.length;\n  if (!hits.length){\n    $('#hits', m).innerHTML = `<div class=\"kv-empty\">Không thấy thư mục con nào có Dockerfile.</div>`;\n    return syncGo();\n  }\n  const root = (rootIn.value.trim() || '').replace(/[\\\\/]+$/, '');\n  const rel = p => {\n    const s = p.startsWith(root) ? p.slice(root.length) : p;\n    return s.replace(/^[\\\\/]+/, '') || '.';\n  };\n  $('#hits', m).innerHTML = `<div class=\"builds\">` + hits.map((h, i) => {\n    const dup = taken.has(h.path.toLowerCase());\n    return `<label class=\"hit${dup ? ' dup' : ''}\">\n      <input type=\"checkbox\" data-i=\"${i}\" ${dup ? 'disabled' : 'checked'}>\n      <b class=\"hit-name\">${esc(h.name)}</b>\n      <span class=\"hit-path\" title=\"${esc(h.path)}\">${esc(rel(h.path))}</span>\n      <span class=\"badge ${dup ? '' : 'pushed'}\">${dup ? 'đã có' : esc(h.dockerfile)}</span>\n    </label>`;\n  }).join('') + `</div>`;\n  $$('#hits input', m).forEach(c => c.onchange = syncGo);\n  syncGo();\n};","approx":false},"imagesDialog()":{"sig":"function imagesDialog(){","code":"/* ---------- import from images already on this machine ---------- */\nfunction imagesDialog(){\n  const m = openModal(`\n    <h2>Quét image có sẵn</h2>\n    <p class=\"sub\">Đọc các image đang có trong Docker trên máy này và đưa chúng vào dự án.\n      Mỗi repository thành một dự án; các tag là phiên bản của nó sẽ hiện luôn trong bảng version.</p>\n    <div class=\"grid2\">\n      <label class=\"f\"><span>Nhóm cho tất cả</span>\n        ${groupPickerHTML('group', '', '— Không xếp nhóm —')}</label>\n      <label class=\"f\"><span>&nbsp;</span>\n        <label class=\"check\" style=\"height:36px\"><input type=\"checkbox\" id=\"showAll\"> Hiện cả image tải về từ Docker Hub</label>\n      </label>\n    </div>\n    <div class=\"section-label\" style=\"margin:10px 0 8px\">Repository <span class=\"count\" id=\"count\">…</span>\n      <button class=\"btn sm ghost\" id=\"all\" style=\"margin-left:auto\">Chọn tất cả</button>\n      <button class=\"btn sm ghost\" id=\"none\">Bỏ chọn</button>\n    </div>\n    <div id=\"repos\"><div class=\"kv-empty\">Đang đọc danh sách image…</div></div>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" id=\"cancel\">Hủy</button>\n      <button class=\"btn primary\" id=\"go\" disabled>Thêm</button>\n    </div>`, true);\n\n  const group = mountGroupPicker(m, 'group');\n  let repos = [];\n  const visible = () => repos.filter(r => $('#showAll', m).checked || r.private || r.known);\n  const selected = () => $$('#repos input:checked', m).map(c => c.dataset.repo);\n\n  const syncGo = () => {\n    const n = selected().length;\n    $('#go', m).disabled = n === 0;\n…","approx":false},"Store.LocalImages()":{"sig":"func (s *Store) LocalImages() ([]LocalImage, error) {","code":"// LocalImages lists what `docker images` sees, so existing work can be\n// pulled into DIMA instead of being retyped.\n//\n// It asks for tab separated fields rather than JSON: the field names of\n// `docker images --format json` have moved between docker versions, while\n// this template has been stable for years.\nfunc (s *Store) LocalImages() ([]LocalImage, error) {\n\tctx, cancel := context.WithTimeout(context.Background(), 20*time.Second)\n\tdefer cancel()\n\tcmd := exec.CommandContext(ctx, s.Config().DockerBin, \"images\",\n\t\t\"--format\", \"{{.Repository}}\\t{{.Tag}}\\t{{.ID}}\\t{{.Size}}\\t{{.CreatedSince}}\\t{{.CreatedAt}}\")\n\thideWindow(cmd)\n\tout, err := cmd.Output()\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"không đọc được danh sách image: %w\", err)\n\t}\n\n\tlist := []LocalImage{}\n\tfor _, line := range strings.Split(string(out), \"\\n\") {\n\t\tf := strings.Split(strings.TrimRight(line, \"\\r\"), \"\\t\")\n\t\tif len(f) < 6 || f[0] == \"\" || f[0] == \"<none>\" || f[1] == \"<none>\" {\n\t\t\tcontinue\n\t\t}\n\t\timg := LocalImage{Repository: f[0], Tag: f[1], ID: f[2], Size: f[3], Age: f[4]}\n\t\t// \"2026-09-22 15:45:38 +0700 +07\" — the trailing zone name is not\n\t\t// part of a layout Go understands, so parse the prefix only.\n\t\tif t, err := time.Parse(\"2006-01-02 15:04:05 -0700\", strings.Join(strings.Fields(f[5])[:3], \" \")); err == nil {\n\t\t\timg.CreatedAt = t\n\t\t}\n\t\tlist = append(list, img)\n\t}\n\treturn list, nil\n}","approx":false},"GroupImages()":{"sig":"func GroupImages(images []LocalImage) []ImageRepo {","code":"// GroupImages folds a flat image list into one entry per repository,\n// newest first.\nfunc GroupImages(images []LocalImage) []ImageRepo {\n\tbyRepo := map[string]*ImageRepo{}\n\torder := []string{}\n\n\tfor _, img := range images {\n\t\tr, ok := byRepo[img.Repository]\n\t\tif !ok {\n\t\t\treg, name := splitRepository(img.Repository)\n\t\t\tshort := name\n\t\t\tif i := strings.LastIndex(short, \"/\"); i >= 0 {\n\t\t\t\tshort = short[i+1:]\n\t\t\t}\n\t\t\tr = &ImageRepo{\n\t\t\t\tRepository: img.Repository, Registry: reg, Image: name,\n\t\t\t\tName: short, Private: reg != \"\", Age: img.Age,\n\t\t\t\tTags: []ImageTag{}, Prefixes: []string{},\n\t\t\t}\n\t\t\tbyRepo[img.Repository] = r\n\t\t\torder = append(order, img.Repository)\n\t\t}\n\t\tprefix, version, isVersion := classifyTag(img.Tag)\n\t\tr.Tags = append(r.Tags, ImageTag{\n\t\t\tTag: img.Tag, Prefix: prefix, Version: version, IsVersion: isVersion,\n\t\t\tID: img.ID, Size: img.Size, Age: img.Age, CreatedAt: img.CreatedAt,\n\t\t})\n\t}\n\n\tout := make([]ImageRepo, 0, len(order))\n\tfor _, name := range order {\n\t\tr := byRepo[name]\n…","approx":false},"splitRepository()":{"sig":"func splitRepository(repo string) (registry, image string) {","code":"// splitRepository separates the registry host from the image name.\n//\n// The first segment is a registry only when it looks like a host: it has a\n// dot or a port, or it is localhost. That is the same rule docker itself\n// uses, and it is why moby/buildkit is an image on Docker Hub while\n// harbor.tech/mm/app is an image on a private registry.\nfunc splitRepository(repo string) (registry, image string) {\n\tparts := strings.SplitN(repo, \"/\", 2)\n\tif len(parts) == 2 && (strings.ContainsAny(parts[0], \".:\") || parts[0] == \"localhost\") {\n\t\treturn parts[0], parts[1]\n\t}\n\treturn \"\", repo\n}","approx":false},"classifyTag()":{"sig":"func classifyTag(tag string) (prefix, version string, isVersion bool) {","code":"// classifyTag decides whether a tag names a release, and splits off the\n// environment prefix if it has one. A release has to contain a digit:\n// latest, cache, stable and local do not.\nfunc classifyTag(tag string) (prefix, version string, isVersion bool) {\n\tm := tagPattern.FindStringSubmatch(tag)\n\tif m == nil {\n\t\treturn \"\", tag, false\n\t}\n\tprefix, version = m[1], m[2]\n\tif version == \"\" {\n\t\tprefix, version = \"\", tag\n\t}\n\tif !strings.ContainsAny(version, \"0123456789\") {\n\t\treturn \"\", tag, false\n\t}\n\treturn prefix, version, true\n}","approx":false},"api.listImages()":{"sig":"func (a *api) listImages(w http.ResponseWriter, r *http.Request) {","code":"// listImages reports the repositories already on this machine, so work that\n// predates DIMA can be pulled in instead of retyped.\nfunc (a *api) listImages(w http.ResponseWriter, r *http.Request) {\n\timages, err := a.store.LocalImages()\n\tif err != nil {\n\t\tfail(w, http.StatusInternalServerError, err.Error())\n\t\treturn\n\t}\n\trepos := GroupImages(images)\n\n\t// Mark what is already covered, so the screen can grey those out rather\n\t// than let the same repository be imported twice.\n\tknown := map[string]bool{}\n\tfor _, p := range a.store.Config().Projects {\n\t\tfor _, e := range p.Envs {\n\t\t\tknown[strings.ToLower(p.Effective(e).Repo())] = true\n\t\t}\n\t}\n\ttype row struct {\n\t\tImageRepo\n\t\tKnown bool `json:\"known\"`\n\t}\n\tout := make([]row, 0, len(repos))\n\tfor _, rp := range repos {\n\t\tout = append(out, row{ImageRepo: rp, Known: known[strings.ToLower(rp.Repository)]})\n\t}\n\twriteJSON(w, http.StatusOK, map[string]any{\"repos\": out})\n}","approx":false},"imagesDialog › vẽ danh sách":{"sig":"$('#repos', m).innerHTML = `<div class=\"builds\">` + list.map(r => {","code":"  $('#repos', m).innerHTML = `<div class=\"kv-empty\">Không có image nào phù hợp. Tích “Hiện cả image tải về từ Docker Hub” để xem hết.</div>`;\n  return syncGo();\n}\n$('#repos', m).innerHTML = `<div class=\"builds\">` + list.map(r => {\n  const versions = r.tags.filter(t => t.isVersion);\n  const detail = versions.length\n    ? versions.slice(0, 3).map(t => t.tag).join(', ') + (versions.length > 3 ? ` +${versions.length-3}` : '')\n    : 'chưa có tag nào là phiên bản';\n  const origin = r.registry || 'Docker Hub';","approx":true},"api.importImages()":{"sig":"func (a *api) importImages(w http.ResponseWriter, r *http.Request) {","code":"// importImages turns chosen repositories into projects, and records the\n// tags they already carry as history entries — without those the imported\n// project would claim to have no versions while the images sit right there\n// on the machine.\nfunc (a *api) importImages(w http.ResponseWriter, r *http.Request) {\n\tvar req struct {\n\t\tGroup        string   `json:\"group\"`\n\t\tRepositories []string `json:\"repositories\"`\n\t}\n\tif err := json.NewDecoder(r.Body).Decode(&req); err != nil {\n\t\tfail(w, http.StatusBadRequest, \"JSON không hợp lệ\")\n\t\treturn\n\t}\n\tif len(req.Repositories) == 0 {\n\t\tfail(w, http.StatusBadRequest, \"chưa chọn image nào\")\n\t\treturn\n\t}\n\n\timages, err := a.store.LocalImages()\n\tif err != nil {\n\t\tfail(w, http.StatusInternalServerError, err.Error())\n\t\treturn\n\t}\n\twanted := map[string]bool{}\n\tfor _, name := range req.Repositories {\n\t\twanted[name] = true\n\t}\n\n\tcfg := a.store.Config()\n\tadded, recorded := 0, 0\n\tfor _, repo := range GroupImages(images) {\n\t\tif !wanted[repo.Repository] {\n\t\t\tcontinue\n\t\t}\n…","approx":false},"ImageRepo.EnvsFor()":{"sig":"func (r ImageRepo) EnvsFor() []Env {","code":"// EnvsFor proposes the environments a repository should be imported with.\n// Tags carrying prefixes become one environment each; otherwise the project\n// gets a single environment with no prefix.\nfunc (r ImageRepo) EnvsFor() []Env {\n\tif len(r.Prefixes) == 0 {\n\t\treturn []Env{{ID: newID(), Name: \"Mặc định\", BuildArgs: []KV{}, Labels: []KV{}}}\n\t}\n\tenvs := make([]Env, 0, len(r.Prefixes))\n\tfor _, p := range r.Prefixes {\n\t\tenvs = append(envs, Env{\n\t\t\tID:        newID(),\n\t\t\tName:      envNameFor(p),\n\t\t\tTagPrefix: p,\n\t\t\tBuildArgs: []KV{}, Labels: []KV{},\n\t\t})\n\t}\n\treturn envs\n}","approx":false},"envNameFor()":{"sig":"func envNameFor(prefix string) string {","code":"// envNameFor turns a tag prefix into a readable environment name.\nfunc envNameFor(prefix string) string {\n\tname := strings.Trim(prefix, \"-_\")\n\tswitch strings.ToLower(name) {\n\tcase \"prod\", \"production\":\n\t\treturn \"Production\"\n\tcase \"stg\", \"staging\":\n\t\treturn \"Staging\"\n\tcase \"dev\", \"develop\", \"development\":\n\t\treturn \"Development\"\n\tcase \"test\", \"qa\":\n\t\treturn \"Test\"\n\tcase \"uat\":\n\t\treturn \"UAT\"\n\t}\n\tif name == \"\" {\n\t\treturn \"Mặc định\"\n\t}\n\treturn strings.ToUpper(name[:1]) + name[1:]\n}","approx":false},"recordExistingTags()":{"sig":"func (a *api) recordExistingTags(p Project, repo ImageRepo) int {","code":"// going to the environment whose prefix matches, exactly as before — a Cache\n// environment does not get to swallow staging-1.2.3.\n//\n// No digest is required, same as for any other imported tag: a local-only\n// environment never pushes, so it never has one, and demanding one would\n// leave it permanently \"chưa có bản nào\".\nfunc (a *api) recordExistingTags(p Project, repo ImageRepo) int {\n\tbyPrefix := map[string]Env{}\n\tlocal := []Env{}\n\tfor _, e := range p.Envs {\n\t\tif e.IsOnlyLocal {\n\t\t\tlocal = append(local, e)\n\t\t\tcontinue\n\t\t}\n\t\tbyPrefix[e.TagPrefix] = e\n\t}\n\tn := 0\n\tfor _, t := range repo.Tags {\n\t\tprefix, version, isVersion := t.Prefix, t.Version, t.IsVersion\n\t\tenv, ok := byPrefix[prefix]\n\t\tif !isVersion || !ok {\n\t\t\t// Not a release by the ordinary rule, or a prefix no shipping\n\t\t\t// environment claims. A local-only environment takes it whole.\n\t\t\tif len(local) == 0 {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tenv, ok = local[0], true\n\t\t\t_, version, isVersion = classifyTagLocalOnly(t.Tag)\n\t\t}\n\t\tif !isVersion || !ok {\n\t\t\tcontinue\n\t\t}\n\t\ta.store.addBuild(Build{\n\t\t\tID:          newID(),\n\t\t\tProjectID:   p.ID,\n\t\t\tProjectName: p.Name,\n…","approx":false},"#addProject.onclick":{"sig":"$('#addProject').onclick = async () => {","code":"$('#addProject').onclick = async () => {\n  const c = cloneConfig();\n  c.projects = c.projects || [];\n  c.projects.push({\n    id:'', name:'Dự án '+(c.projects.length+1), releaseMode:'rebuild',\n    image:'my-api', context:'', dockerfile:'Dockerfile',\n    buildArgs:[], labels:[],\n    envs:[{id:'', name:'Staging', tagPrefix:'staging-', buildArgs:[], labels:[]}],\n  });\n  try {\n    const saved = await saveConfig(c);\n    const added = saved.projects[saved.projects.length-1];\n    state.sel = {kind:'project', id:added.id};\n    render();\n    projectDialog(added);\n  } catch (e) { toast(e.message, true); }\n};","approx":false},"addEnv()":{"sig":"async function addEnv(projectId){","code":"/* ---------- create ---------- */\nasync function addEnv(projectId){\n  const c = cloneConfig();\n  const proj = c.projects.find(p => p.id === projectId);\n  if (!proj) return;\n  proj.envs = proj.envs || [];\n  proj.envs.push({id:'', name:'Môi trường '+(proj.envs.length+1), tagPrefix:'', buildArgs:[], labels:[]});\n  try {\n    const saved = await saveConfig(c);\n    const fresh = saved.projects.find(p => p.id === projectId);\n    const added = fresh.envs[fresh.envs.length-1];\n    state.sel = {kind:'env', id:added.id};\n    render();\n    envDialog(fresh, added);\n  } catch (e) { toast(e.message, true); }\n}","approx":false},"versionsDialog()":{"sig":"async function versionsDialog(){","code":"/* ---------- config snapshots ---------- */\nasync function versionsDialog(){\n  let snaps = [];\n  try { snaps = await api('/api/config/versions'); } catch (e) { return toast(e.message, true); }\n  const m = openModal(`\n    <h2>Bản lưu của config.json</h2>\n    <p class=\"sub\">Mỗi lần lưu cài đặt, bản cũ được giữ lại ở đây.</p>\n    <div id=\"snaps\">${\n      snaps.length\n        ? snaps.map(s => `<div class=\"snap\">\n            <time>${fmt(s.savedAt)}</time>\n            <span class=\"sz\">${s.size} B</span>\n            <button class=\"btn sm\" data-view=\"${esc(s.file)}\">Xem nội dung</button>\n            <button class=\"btn sm\" data-restore=\"${esc(s.file)}\">Khôi phục</button>\n ins the failure — it just is not offered as a way\n\t\t// back.\n\t\tif strings.HasPrefix(e.Name(), \"config-loi-\") {\n\t\t\tcontinue\n\t\t}\n\t\tinfo, err := e.Info()\n\t\tif err != nil {\n\t\t\tcontinue\n\t\t}\n\t\tout = append(out, Snapshot{File: e.Name(), SavedAt: info.ModTime(), Size: info.Size()})\n\t}\n\tsort.Slice(out, func(i, j int) bool { return out[i].SavedAt.After(out[j].SavedAt) })\n\treturn out\n}","approx":false},"api.readVersion()":{"sig":"func (a *api) readVersion(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) readVersion(w http.ResponseWriter, r *http.Request) {\n\traw, err := a.store.ReadSnapshot(r.PathValue(\"file\"))\n\tif err != nil {\n\t\tfail(w, http.StatusNotFound, \"không đọc được bản lưu\")\n\t\treturn\n\t}\n\tw.Header().Set(\"Content-Type\", \"application/json; charset=utf-8\")\n\t_, _ = w.Write(raw)\n}","approx":false},"api.restoreVersion()":{"sig":"func (a *api) restoreVersion(w http.ResponseWriter, r *http.Request) {","code":"func (a *api) restoreVersion(w http.ResponseWriter, r *http.Request) {\n\tc, err := a.store.RestoreSnapshot(r.PathValue(\"file\"))\n\tif err != nil {\n\t\tfail(w, http.StatusBadRequest, err.Error())\n\t\treturn\n\t}\n\twriteJSON(w, http.StatusOK, c)\n}","approx":false},"RestoreSnapshot()":{"sig":"func (s *Store) RestoreSnapshot(name string) (Config, error) {","code":"func (s *Store) RestoreSnapshot(name string) (Config, error) {\n\traw, err := s.ReadSnapshot(name)\n\tif err != nil {\n\t\treturn Config{}, err\n\t}\n\tc, _, err := decodeConfig(raw)\n\tif err != nil {\n\t\treturn Config{}, fmt.Errorf(\"bản lưu hỏng: %w\", err)\n\t}\n\tif err := s.SaveConfig(c); err != nil {\n\t\treturn Config{}, err\n\t}\n\treturn s.Config(), nil\n}","approx":false},"migrateV1()":{"sig":"func migrateV1(old legacyConfig) Config {","code":"// migrateV1 folds the old flat environment list into a single project and\n// lifts every setting the environments already agreed on, so the effective\n// configuration is unchanged but the inheritance is visible.\nfunc migrateV1(old legacyConfig) Config {\n\tp := Project{\n\t\tID: newID(), Name: \"Dự án của tôi\", ReleaseMode: ModeRebuild,\n\t\tOrigin:    OriginUser,\n\t\tBuildArgs: []KV{}, Labels: []KV{},\n\t\tEnvs: old.Environments,\n\t}\n\tfor i := range p.Envs {\n\t\tif p.Envs[i].ID == \"\" {\n\t\t\tp.Envs[i].ID = newID()\n\t\t}\n\t\tif p.Envs[i].LastVersion == \"\" {\n\t\t\tp.Envs[i].LastVersion = p.Envs[i].LastTag\n\t\t}\n\t\tp.Envs[i].LastTag = \"\"\n\t}\n\tliftCommon(&p)\n\treturn normalise(Config{\n\t\tSchemaVersion: currentSchema,\n\t\tDockerBin:     old.DockerBin,\n\t\tProjects:      []Project{p},\n\t})\n}","approx":false},"liftCommon()":{"sig":"func liftCommon(p *Project) {","code":"// liftCommon moves every string setting the environments all share up to\n// the project and clears it on the environments. The effective value of\n// each environment is identical afterwards.\nfunc liftCommon(p *Project) {\n\tif len(p.Envs) < 2 {\n\t\treturn\n\t}\n\tfields := []struct {\n\t\tproj func(*Project) *string\n\t\tenv  func(*Env) *string\n\t}{\n\t\t{func(p *Project) *string { return &p.Registry }, func(e *Env) *string { return &e.Registry }},\n\t\t{func(p *Project) *string { return &p.Image }, func(e *Env) *string { return &e.Image }},\n\t\t{func(p *Project) *string { return &p.Context }, func(e *Env) *string { return &e.Context }},\n\t\t{func(p *Project) *string { return &p.Dockerfile }, func(e *Env) *string { return &e.Dockerfile }},\n\t\t{func(p *Project) *string { return &p.Platform }, func(e *Env) *string { return &e.Platform }},\n\t\t{func(p *Project) *string { return &p.Target }, func(e *Env) *string { return &e.Target }},\n\t\t{func(p *Project) *string { return &p.EnvFile }, func(e *Env) *string { return &e.EnvFile }},\n\t\t{func(p *Project) *string { return &p.ExtraFlags }, func(e *Env) *string { return &e.ExtraFlags }},\n\t}\n\tfor _, f := range fields {\n\t\tfirst := *f.env(&p.Envs[0])\n\t\tif strings.TrimSpace(first) == \"\" { \" + e.Name + \": \" + ctx\n\t}\n\tif !st.IsDir() {\n\t\treturn ctx + \" là một file, không phải thư mục\"\n\t}\n\t// With a build command of its own, what the folder needs is the script's\n\t// business, not ours. Only the folder itself had to be real — and the\n\t// command must not still name a placeholder that no longer exists.\n\tif bc := strings.TrimSpace(env.BuildCommand); bc != \"\" {\n\t\tif msg := CheckBuildCommand(bc); msg != \"\" {\n\t\t\treturn \"môi trường \" + e.Name + \": \" + msg\n\t\t}\n\t\treturn \"\"\n\t}\n\twant := dockerfileOr(env.Dockerfile)\n…","approx":false},"checkVersion()":{"sig":"func checkVersion(v string) (string, string) {","code":"// checkVersion validates the project version a build or promote is given.\nfunc checkVersion(v string) (string, string) {\n\tv = strings.TrimSpace(v)\n\tif v == \"\" {\n\t\treturn \"\", \"chưa nhập version\"\n\t}\n\tif !tagRe.MatchString(v) {\n\t\treturn \"\", \"version chỉ được gồm chữ, số và dấu . _ - (bắt đầu bằng chữ hoặc số, tối đa 128 ký tự) — đúng bộ ký tự docker nhận trong tag\"\n\t}\n\treturn v, \"\"\n}","approx":false},"planBuild()":{"sig":"func planBuild(docker string, p Project, target Env, version string, given map[string]string, git GitInfo) buildPlan {","code":"func planBuild(docker string, p Project, target Env, version string, given map[string]string, git GitInfo) buildPlan {\n\tenv := p.Effective(target)\n\tref := env.Ref(version)\n\tplan := buildPlan{Env: env, Ref: ref, Fields: []ParamField{}, Problems: []string{}}\n\tlabels := mergeKV(autoLabels(p, target, version, git), env.Labels)\n\n\t// A folder whose build is driven by a script replaces docker build\n\t// entirely; everything after the build — push, digest, version history,\n\t// promote — carries on unchanged.\n\tplan.Custom = strings.TrimSpace(env.BuildCommand)\n\tif plan.Custom == \"\" {\n\t\tplan.Bin, plan.Argv = docker, buildArgv(env, ref, labels)\n\t\tplan.Command = docker + \" \" + strings.Join(plan.Argv, \" \")\n\t\treturn plan\n\t}\n\n\tplan.Fields = paramFields(env, given)\n\tparams, problems := paramValues(plan.Fields)\n\tplan.Problems = problems\n\tvalues := buildVarValues(p, target, env, version, ref, labels)\n\t// commandParams never returns a built-in name, so nothing here can\n\t// overwrite a value DIMA supplies.\n\ttemplate := plan.Custom\n\tfor k, v := range params {\n\t\tvalues[k] = v\n\t\t// An empty parameter takes the space before it along, so an unticked\n\t\t// {cache} in \"-Ref {ref} {cache} -Mode\" does not leave a double gap.\n\t\t// Only that one space: anything else around it is the command's own.\n\t\tif v == \"\" {\n\t\t\ttemplate = strings.ReplaceAll(template, \" {\"+k+\"}\", \"\")\n…","approx":false},"confirmReason()":{"sig":"func confirmReason(p Project, e Env) string {","code":"//\n// Two cases. A protected environment, always. And a promote project built\n// outside its source: every environment may build its own image, but before\n// that was allowed this was refused outright, and no existing configuration\n// has the protected flag yet — without the confirmation, upgrading would\n// have turned \"production only receives the tested image\" into one click.\nfunc confirmReason(p Project, e Env) string {\n\tif e.Protected {\n\t\treturn protectedBuildWarning(p, e)\n\t}\n\tif p.BuildsOutsideSource(e.ID) {\n\t\tsrc := e.Name\n\t\tfor _, x := range p.Envs {\n\t\t\tif x.ID == p.BuildEnvID() {\n\t\t\t\tsrc = x.Name\n\t\t\t}\n\t\t}\n\t\treturn \"dự án \" + p.Name + \" build ở \" + src + \" rồi promote: build riêng ở \" + e.Name +\n\t\t\t\" sẽ ra một image mới, khác digest với bản đã test\"\n\t}\n\treturn \"\"\n}","approx":false},"Store.Start()":{"sig":"func (s *Store) Start(p Project, target Env, version string, push bool, given map[string]string) Build {","code":"// Start kicks off a build (and an optional push) in the background and\n// returns the new build record immediately. It always works with the\n// environment resolved against its project.\nfunc (s *Store) Start(p Project, target Env, version string, push bool, given map[string]string) Build {\n\tdocker := s.Config().DockerBin\n\tgit := ReadGit(p.Effective(target).Context)\n\tplan := planBuild(docker, p, target, version, given, git)\n\tenv, ref, custom := plan.Env, plan.Ref, plan.Custom\n\tbin, argv, shown := plan.Bin, plan.Argv, plan.Command\n\n\t// A local-only environment never has anywhere to push to. Start is the\n\t// one place that actually runs `docker push`, so this is enforced here\n\t// too — not just at the HTTP layer — in case some future caller reaches\n\t// Start with push=true for an environment it should not apply to.\n\t// Silently dropping the flag here (rather than erroring) is deliberate:\n\t// the HTTP handler is where the person gets told no, before anything\n\t// runs; by the time control reaches Start the build itself must go ahead\n\t// regardless.\n\tpush = push && !env.IsOnlyLocal\n\n\tb := Build{\n\t\tID:          newID(),\n\t\tProjectID:   p.ID,\n\t\tProjectName: p.Name,\n\t\tEnvID:       target.ID,\n\t\tEnvName:     target.Name,\n\t\tVersion:     version,\n\t\tTag:         env.Tag(version),\n\t\tRef:         ref,\n\t\tKind:        KindBuild,\n\t\tOnlyLocal:   env.IsOnlyLocal,\n\t\tBranch:      git.Branch,\n\t\tCommit:      git.Commit,\n…","approx":false},"ReadGit()":{"sig":"func ReadGit(dir string) GitInfo {","code":"// ReadGit inspects a build context folder.\n//\n// A folder that is not a repository, a repository without commits, or a\n// machine without git all yield IsRepo false. This is extra context about a\n// build, never a reason to refuse one.\nfunc ReadGit(dir string) GitInfo {\n\tif strings.TrimSpace(dir) == \"\" {\n\t\treturn GitInfo{}\n\t}\n\tbranch, ok := gitIn(dir, \"rev-parse\", \"--abbrev-ref\", \"HEAD\")\n\tif !ok || branch == \"\" {\n\t\treturn GitInfo{}\n\t}\n\tinfo := GitInfo{IsRepo: true, Branch: branch}\n\tif commit, ok := gitIn(dir, \"rev-parse\", \"--short\", \"HEAD\"); ok {\n\t\tinfo.Commit = commit\n\t}\n\t// --porcelain prints one line per changed path and nothing at all when\n\t// the tree is clean.\n\tif status, ok := gitIn(dir, \"status\", \"--porcelain\"); ok {\n\t\tinfo.Dirty = status != \"\"\n\t}\n\treturn info\n}","approx":false},"autoLabels()":{"sig":"func autoLabels(p Project, target Env, version string, git GitInfo) []KV {","code":"// The OCI names come first because every tool understands them. The\n// environment is the one the image was BUILT in, and is named that way on\n// purpose: a promote ships these exact bytes to production, so an image on\n// production may honestly say it was built for staging. Nothing time-based\n// is added: a \"created\" label would make two builds of identical source\n// produce different images, and docker records the time already.\nfunc autoLabels(p Project, target Env, version string, git GitInfo) []KV {\n\tout := []KV{\n\t\t{Key: \"org.opencontainers.image.version\", Value: version},\n\t\t{Key: \"org.opencontainers.image.title\", Value: p.Name},\n\t\t{Key: \"dima.build-env\", Value: target.Name},\n\t}\n\tif git.IsRepo && git.Commit != \"\" {\n\t\trev := git.Commit\n\t\tif git.Dirty {\n\t\t\t// Matches no commit: say so in the one place that travels with it.\n\t\t\trev += \"-dirty\"\n\t\t}\n\t\tout = append(out, KV{Key: \"org.opencontainers.image.revision\", Value: rev})\n\t}\n\tif git.IsRepo && git.Branch != \"\" && git.Branch != DetachedBranch {\n\t\tout = append(out, KV{Key: \"dima.branch\", Value: git.Branch})\n\t}\n\treturn out\n}","approx":false},"buildArgv()":{"sig":"func buildArgv(env Env, ref string, labels []KV) []string {","code":"// buildArgv assembles the docker command line for an environment. labels\n// are every label the image gets: mergeKV(autoLabels, env.Labels), so a\n// label the user declares under the same key wins.\nfunc buildArgv(env Env, ref string, labels []KV) []string {\n\targs := []string{\"build\", \"-t\", ref}\n\tif f := strings.TrimSpace(env.Dockerfile); f != \"\" {\n\t\targs = append(args pdateBuild(id string, fn func(*Build)) {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\tfor i := range s.builds {\n\t\tif s.builds[i].ID == id {\n\t\t\tfn(&s.builds[i])\n\t\t\ts.persistHistoryLocked()\n\t\t\treturn\n\t\t}\n\t}\n}","approx":false},"promoteDialog()":{"sig":"function promoteDialog(p, src, target, version){","code":"/* ---------- promote dialog ---------- */\nfunction promoteDialog(p, src, target, version){\n  const targets = (p.envs || []).filter(e => e.id !== src.envId);\n  if (!targets.length) return toast('Dự án chưa có môi trường nào khác để đưa sang', true);\n  const initial = target && target.id !== src.envId ? target.id : targets[0].id;\n\n  const m = openModal(`\n    <h2>Đưa version ${esc(version || src.version)} sang môi trường khác</h2>\n    <p class=\"sub\">Không build lại. Image giữ nguyên digest, chỉ được gắn thêm tag mới.</p>\n    ${state.buildxOk ? '' : `<div class=\"warnbox\">Máy này không có <code>docker buildx</code> 0.12 trở lên, nên image sẽ phải kéo về rồi đẩy lên lại. Chậm hơn, và manifest đa kiến trúc sẽ bị rút về một nền tảng.</div>`}\n    <label class=\"f\"><span>Nguồn — ${esc(src.envName)}</span>\n      <input type=\"text\" value=\"${esc(src.ref)}\" readonly></label>\n    <div class=\"inherited\">digest ${esc(src.digest || '—')}</div>\n    <label class=\"f\"><span>Đưa sang</span>\n      <select id=\"target\">${targets.map(e => `<option value=\"${esc(e.id)}\" ${e.id===initial?'selected':''}>${esc(e.name)}</option>`).join('')}</select>\n    </label>\n    <label class=\"f\"><span>Version</span>\n      <input type=\"text\" id=\"ver\" value=\"${esc(version || src.version)}\" autocomplete=\"off\"></label>\n    <div class=\"preview\" id=\"preview\"></div>\n    <div id=\"clash\"></div>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" id=\"cancel\">Hủy</button>\n      <button class=\"btn primary\" id=\"go\">Promote</button>\n    </div>`);\n\n  const sel = $('#target', m), ver = $('#ver', m);\n  const refresh2 = () => {\n    const {"sig":"if dst := project.Effective(env).Ref(version); dst == src.Ref {","code":"// Two environments of one project share a repository, so they are only\n// distinguishable by their tag prefix. Without one the promote would\n// re-point the source's own tag at itself and change nothing.\nif dst := project.Effective(env).Ref(version); dst == src.Ref {\n\tfail(w, http.StatusConflict,\n\t\t\"tag đích trùng hệt tag nguồn (\"+dst+\") nên promote sẽ không có tác dụng — đặt tiền tố tag khác nhau cho \"+\n\t\t\tsrc.EnvName+\" và \"+env.Name+\" trong cài đặt môi trường\")\n\treturn\n}","approx":true},"Store.Promote()":{"sig":"func (s *Store) Promote(p Project, target Env, src Build, version string) Build {","code":"// Promote gives an image that is already on the registry a second tag, so\n// another environment serves the byte-for-byte same image. Nothing is\n// rebuilt, so the digest of the result equals the digest of the source —\n// that equality is the whole point, and it is what makes a rollback just a\n// promote of an older version.\nfunc (s *Store) Promote(p Project, target Env, src Build, version string) Build {\n\tenv := p.Effective(target)\n\tref := env.Ref(version)\n\tsrcRef := repoOf(src.Ref) + \"@\" + src.Digest\n\tdocker := s.Config().DockerBin\n\tsteps := promoteSteps(s.buildxAvailable(), srcRef, ref)\n\n\tlines := make([]string, 0, len(steps))\n\tfor _, st := range steps {\n\t\tlines = append(lines, docker+\" \"+strings.Join(st, \" \"))\n\t}\n\n\tb := Build{\n\t\tID:            newID(),\n\t\tProjectID:     p.ID,\n\t\tProjectName:   p.Name,\n\t\tEnvID:         target.ID,\n\t\tEnvName:       target.Name,\n\t\tVersion:       version,\n\t\tTag:           env.Tag(version),\n\t\tRef:           ref,\n\t\tDigest:        src.Digest,\n\t\tKind:          KindPromote,\n\t\tSourceBuildID: src.ID,\n\t\tBranch:        src.Branch,\n\t\tCommit:        src.Commit,\n\t\tDirty:         src.Dirty,\n\t\tStatus:        \"running\",\n\t\tCommand:       strings.Join(lines, \" && \"),\n\t\tStartedAt:     time.Now(),\n…","approx":false},"repoOf()":{"sig":"func repoOf(ref string) string {","code":"// repoOf strips the tag or digest from an image reference, leaving the\n// repository. The colon of a registry port is not a tag separator, so only\n// a colon after the last slash counts.\nfunc repoOf(ref string) string {\n\tif i := strings.LastIndex(ref, \"@\"); i >= 0 {\n\t\tref = ref[:i]\n\t}\n\tslash := strings.LastIndex(ref, \"/\")\n\tif i := strings.LastIndex(ref, \":\"); i > slash {\n\t\treturn ref[:i]\n\t}\n\treturn ref\n}","approx":false},"buildxAvailable()":{"sig":"func (s *Store) buildxAvailable() bool {","code":"// buildxAvailable is checked once per run: the answer cannot change while\n// the app is open.\n//\n// It asks for --prefer-index (buildx 0.12+), not just for buildx: an older\n// buildx cannot carbon-copy a single manifest, and the index it would make\n// instead changes the digest. pull → tag → push keeps it, so that wins.\nfunc (s *Store) buildxAvailable() bool {\n\ts.buildxOnce.Do(func() {\n\t\tctx, cancel := context.WithTimeout(context.Background(), 6*time.Second)\n\t\tdefer cancel()\n\t\tcmd := exec.CommandContext(ctx, s.Config().DockerBin, \"buildx\", \"imagetools\", \"create\", \"--help\")\n\t\thideWindow(cmd)\n\t\tout, err := cmd.CombinedOutput()\n\t\ts.buildxOK = err == nil && strings.Contains(string(out), \"--prefer-index\")\n\t})\n\treturn s.buildxOK\n}","approx":false},"promoteSteps()":{"sig":"func promoteSteps(buildx bool, srcRef, dstRef string) [][]string {","code":"//\n// --prefer-index=false is what keeps the digest untouched. Given a single\n// source, imagetools by default wraps a plain image manifest in a brand-new\n// index — a different digest, and a manifest list that registries like an\n// older Harbor refuse outright (415 \"Manifest.list is not supported\"). With\n// the flag it copies the source manifest as-is, index or not.\nfunc promoteSteps(buildx bool, srcRef, dstRef string) [][]string {\n\tif buildx
